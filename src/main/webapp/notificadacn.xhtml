<!DOCTYPE html>
<html xmlns="http://www.w3c.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:x="http://xpert.com/faces">
    <h:head>
        <meta charset="utf-8" />
        <meta name="viewport"    content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="" />

        <title>NOTIFICACION-CN</title>

        <link rel="shortcut icon" type="image/png" href="#{resource['images/favicon.png']}" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>

        <link rel="stylesheet" media="screen" href="http://fonts.googleapis.com/css?family=Open+Sans:300,400,700" />
        <link href="resources/assets/css/bootstrap.min.css" rel="stylesheet" />
        <link href="resources/assets/css/font-awesome.min.css" rel="stylesheet" />

        <!-- Custom styles for our template -->
        <link href="resources/assets/css/bootstrap-theme.css" rel="stylesheet" />
        <link href="resources/assets/css/main.css" rel="stylesheet" />
        <!-- My own style css -->
        <link href="resources/assets/css/style.css" rel="stylesheet" />
    </h:head>
    <h:body>
        <!-- Start Page Loading -->
        <div id="loader-wrapper">
            <div id="loader"></div>        
            <div class="loader-section section-left"></div>
            <div class="loader-section section-right"></div>
        </div>
        <p:growl id="mensajes" showDetail="true" life="3000"/>
        <h:form id="allform" enctype="multipart/form-data" style=" background: #e3e3e3; min-height: calc(100vh - 424px);">
            <div class="menu">
                <a href="#" class="logo"  title="Logo Senadi" ><img src="resources/images/sena_2.png" width="161px"/></a>

                <i id="edit_action" class="material-icons prefix" style="color: white; margin-left: 20px; display: inline-block">person</i>    

                <p:outputLabel value="#{loginBean.nombre}" style="color: white; font-size: 18px" />


                <div style="float: right; display: inline-block; margin-top: 5px">
                    <p:commandLink styleClass="btn_logout" actionListener="#{loginBean.logout}"
                                   oncomplete="logout(xhr, status, args)"
                                   title="CERRAR SESIÓN" immediate="true">
                        <i class="material-icons" style="font-size: 30px; ">exit_to_app</i>
                    </p:commandLink>
                </div>
                <a class="itemm" href="settings.xhtml" title="Configuración" style="display:  #{loginBean.lectura eq true?'none':'inline-block'}"><i class="material-icons" >settings</i></a>
                <a class="itemm" href="abandonocn.xhtml" title="Abandono" >ABANDONO</a>
                <a class="itemm" href="caducadacn.xhtml" title="Caducadas" >CADUCADAS - NEGADAS</a> 
                <a class="itemm" href="desistidacn.xhtml" title="Desistimientos" >DESISTIDAS</a> 
                <a class="activo" href="#" title="Notificaciones" >NOTIFICADAS</a> 
                <a class="itemm" href="certificadocn.xhtml" title="Certificado Cambio Nombre" >CERTIFICADO C. NOMBRE</a>
            </div>
            <div class="card" style="margin-top: 20%; position: absolute;">
                <br/>
                <p:sidebar widgetVar="sidebar1" style="z-index: 999 !important; width: 22%; background: #E8F5E9; overflow: scroll">
                    <div id="menuside"></div>
                </p:sidebar>
                <p:commandButton icon="pi pi-arrow-right" type="button" onclick="PF('sidebar1').show()" styleClass="mr-2 " class="btn_sidebar"
                                 style="position: fixed; z-index: 999; background-color: #d30039 !important;"/>
            </div>
            <br/>
            <h:panelGrid columns="1"  style="text-align: center; font-size: 16px; font-weight: bold; margin: 0 auto; width: 97%;">
                <p:panel class="panelContent" >
                    <p:commandButton id="nuevo_registro" value="NUEVA NOTIFICACIÓN C. NOMBRE" 
                                     class="btn_peque"
                                     style="font-size: 12px; float: left"
                                     actionListener="#{notificacioncnBean.prepararNuevo}"
                                     update="allform:dlgNuevaT allform:frmNuevaT:datosNuevaT allform:frmNuevaT:guardarBtn"
                                     oncomplete="if(args.doit){PF('dlgNuevaT').show()};" process="@this" rendered="#{!loginBean.lectura}"/>
                    <p:tabView style="font-size: 12px; margin: 0 auto; width: 50%">
                        <p:tab title="Búsqueda por Criterio" >
                            <p:outputLabel value="BUSCAR: " style="font-size: 13px; font-weight: bold; margin-right: 5px;"/>
                            <p:inputText id="buscarText" value="#{notificacioncnBean.criterio}" 
                                         style="font-size: 14px; margin-right: 5px; width: 40%" placeholder="Ingrese un criterio de búsqueda"
                                         title="Puede buscar por No. Solicitud, Denominación o Titular Actual"/>
                            <p:commandButton value="BUSCAR" actionListener="#{notificacioncnBean.buscarNotificacionesCN}"
                                             update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px"
                                             process="@parent" class="btn_peque"/>
                        </p:tab>
                        <p:tab title="Búsqueda por Fecha" >                            
                            <p:outputLabel value="DESDE:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{notificacioncnBean.fechaInicio}" label="Fecha Desde" style="font-size: 13px; margin-right: 5px;" 
                                        placeholder="Fecha Inicio de Búsqueda" navigator="true"/>
                            <p:outputLabel value="HASTA:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{notificacioncnBean.fechaFin}" label="Fecha Hasta" style="font-size: 13px; margin-right: 5px;"
                                        placeholder="Fecha Fin de Búsqueda" navigator="true"/>

                            <p:commandButton value="BUSCAR"  
                                             actionListener="#{notificacioncnBean.buscarNotificacionesPorFecha}" 
                                             update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px" class="btn_peque"
                                             process="@parent" title="Se busca por fecha de Presentación"/>                            
                        </p:tab>
                        <p:tab title="Búsqueda por Fecha Notificación" >
                            <p:outputLabel value="DESDE:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{notificacioncnBean.fechaInicioCertificado}" label="Fecha Desde" style="font-size: 13px; margin-right: 5px;" 
                                        placeholder="Fecha Inicio de Búsqueda" navigator="true"/>
                            <p:outputLabel value="HASTA:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{notificacioncnBean.fechaFinCertificado}" label="Fecha Hasta" style="font-size: 13px; margin-right: 5px;"
                                        placeholder="Fecha Fin de Búsqueda" navigator="true"/>

                            <p:commandButton value="BUSCAR"  
                                             actionListener="#{notificacioncnBean.buscarNotificacionesPorFechaCertificado}" 
                                             update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px" class="btn_peque"
                                             process="@parent" title="Se busca por fecha de Presentación"/>
                        </p:tab>
                    </p:tabView>

                    <div style="float: right; font-weight: bold; margin-top: -20px; border: solid #9c27b0; padding: 6px; " >REGLAMENTO</div>
                    <div style="float: right; font-weight: bold; margin-top: -20px; border: solid #00E676; padding: 6px; " >ERJAFE</div>
                    <div style="float: right; font-weight: bold; margin-top: -20px; border: solid dodgerblue; padding: 6px; " >COA</div>
                    <div style="float: right; font-weight: bold; margin-top: -20px; border: solid green; padding: 6px" >CON NOTIFICACIÓN</div>
                    <br/>
                    <p:commandButton value="PASAR A ABANDONOS" actionListener="#{notificacioncnBean.prepararPasarAbandonos}" 
                                     update="mensajes dlgTipoAbandono tipoAbanForm"
                                     style="float: right; font-weight: bold; margin-top: 20px; margin-right: 5px; " class="btn_peque"
                                     oncomplete="if(args.abait){PF('dlgTipoAbandono').show();}"/>
                    <p:commandButton value="PARA ABANDONO" actionListener="#{notificacioncnBean.prepararParaAbandonos}" 
                                     update="mensajes dlgParaAbandono tipoAbanForm"
                                     style="float: right; font-weight: bold; margin-top: 20px;" class="btn_peque"
                                     oncomplete="if(args.abait){PF('dlgParaAbandono').show();}"/>
                    
                    <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()" />

                    <p:dialog widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                        <p:graphicImage name="/images/ajax-loader.gif" />
                    </p:dialog>
                    <p:outputLabel id="num_reg" value="#{notificacioncnBean.numRegistros}" style="float: left; font-size: 12px"/>
                    <br/>
                    <p:dataTable id="tablaDeDatos" var="notificacion"
                                 value="#{notificacioncnBean.notificaciones}" widgetVar="tablaDeNotificaciones"
                                 emptyMessage="No hay Datos para mostrar"                                              
                                 filteredValue="#{notificacioncnBean.notificacionesFiltradas}"
                                 binding="#{notificacioncnBean.notificacionesDataTable}"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="20"
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 selection="#{notificacioncnBean.selectedNotificaciones}"
                                 style="margin:3px auto; font-size: 9px !important;" 
                                 rowKey="#{notificacion.id}" rowStyleClass="#{notificacion.tipoAbandono eq 'ERJAFE'?'row-erjafe':notificacion.tipoAbandono eq 'REGLAMENTO'?'row-reglamento':notificacion.tipoAbandono eq 'COA'?'row-coa':''}">

                        <f:facet name="header">
                            <p:outputPanel>
                                <h:outputText value="BUSCAR EN RESULTADO: " />
                                <p:inputText id="globalFilter" onkeyup="PF('tablaDeNotificaciones').filter()"
                                             style="width:300px" placeholder="Escriba aquí"/>
                            </p:outputPanel>
                        </f:facet>

                        <p:column selectionMode="multiple" style="width:16px;text-align:center" rendered="#{!loginBean.lectura}" exportable="false"/>

                        <p:column headerText="Solicitud" style="text-align: center;" filterBy="#{notificacion.solicitud}" >
                            <h:outputText value="#{notificacion.solicitud}" title="#{notificacioncnBean.getTooltipAbandono(notificacion)}"/>
                        </p:column>
                        <p:column headerText="F. Presentación" style="text-align: center;" filterBy="#{notificacion.fechaPresentacion}" >
                            <h:outputText value="#{notificacion.fechaPresentacion}" title="#{notificacioncnBean.getTooltipAbandono(notificacion)}">
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>                        
                        <p:column  headerText="Notificación" style="text-align: center;" filterBy="#{notificacion.notificacion}" >
                            <p:commandLink id="notlink" value="#{notificacion.notificacion}" style="color: #0089ec; font-size: 14px;" process="@this"
                                           title="Visualizar Notificación #{notificacion.notificacion}" actionListener="#{notificacioncnBean.validarNotificacion(notificacion)}"
                                           oncomplete="if(args.viewnotificacion){otherpage(args.view)};" update="mensajes notlink" rendered="#{notificacion.notificacionEmitida}"/>
                            <h:outputText value="#{notificacion.notificacion}" rendered="#{!notificacion.notificacionEmitida}" title="#{notificacioncnBean.getTooltipAbandono(notificacion)}"/>
                        </p:column>                        
                        <p:column headerText="F. Notificacion" style="text-align: center;" filterBy="#{notificacion.fechaNotificacion}" >
                            <h:outputText value="#{notificacion.fechaNotificacion}" title="#{notificacioncnBean.getTooltipAbandono(notificacion)}">
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Registro" style="text-align: center; width: 13rem" filterBy="#{notificacion.registro}" >
                            <h:outputText value="#{notificacion.registro}" title="#{notificacioncnBean.getTooltipAbandono(notificacion)}"/>
                        </p:column>
                        <p:column headerText="F. Registro" style="text-align: center;" filterBy="#{notificacion.fechaRegistro}" >
                            <h:outputText value="#{notificacion.fechaRegistro}" title="#{notificacioncnBean.getTooltipAbandono(notificacion)}">
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Denominación" style="text-align: center;" filterBy="#{notificacion.denominacion}" >
                            <h:outputText value="#{notificacion.denominacion}" title="#{notificacioncnBean.getTooltipAbandono(notificacion)}"/>
                        </p:column>
                        <p:column headerText="signo" style="text-align: center;" filterBy="#{notificacion.signo}" >
                            <h:outputText value="#{notificacion.signo}" title="#{notificacioncnBean.getTooltipAbandono(notificacion)}"/>
                        </p:column>                       
                        <p:column headerText="T. Anterior" style="text-align: center;" filterBy="#{notificacion.titularAnterior}" >
                            <h:outputText value="#{notificacion.titularAnterior}" title="#{notificacioncnBean.getTooltipAbandono(notificacion)}"/>
                        </p:column>
                        <p:column headerText="T. Actual" style="text-align: center;" filterBy="#{notificacion.titularActual}" >
                            <h:outputText value="#{notificacion.titularActual}" title="#{notificacioncnBean.getTooltipAbandono(notificacion)}"/>
                        </p:column>
                        <p:column headerText="Dom. T. Actual" style="text-align: center;" filterBy="#{notificacion.domicilioTitularActual}" rendered="false">
                            <h:outputText value="#{notificacion.domicilioTitularActual}" rendered="false"/>
                        </p:column>
                        <p:column headerText="Apoderado Representante" style="text-align: center;"  visible="false" >
                            <h:outputText value="#{notificacion.apeApodRepre}" title="#{notificacioncnBean.getTooltipAbandono(notificacion)}"/>
                        </p:column>
                        <p:column headerText="Casillero Senadi" style="text-align: center;"  visible="false" >
                            <h:outputText value="#{notificacion.casilleroSenadi}" title="#{notificacioncnBean.getTooltipAbandono(notificacion)}"/>
                        </p:column>

                        <p:column headerText="Casillero Judicial" style="text-align: center;"  visible="false" >
                            <h:outputText value="#{notificacion.casilleroJudicial}" title="#{notificacioncnBean.getTooltipAbandono(notificacion)}"/>
                        </p:column>
                        <p:column headerText="Responsable" style="text-align: center;">
                            <h:outputText value="#{notificacion.responsable}" title="#{notificacioncnBean.getTooltipAbandono(notificacion)}"/>
                        </p:column>
                        <p:column id="editar" headerText="Acción"  exportable="false" style="margin: 0 auto; width: 150px;" 
                                  styleClass="#{notificacion.notificacionEmitida eq true ?'border_green_color':null}">                            
                            <p:commandLink class="link"
                                           actionListener="#{notificacioncnBean.prepararEditar}"
                                           update="allform:dlgNuevaT allform:frmNuevaT:datosNuevaT allform:frmNuevaT:guardarBtn "
                                           oncomplete="if(args.peditar){PF('dlgNuevaT').show()};"
                                           process="@this"
                                           title="Editar" rendered="#{!loginBean.lectura}">
                                <i id="edit_action" class="material-icons md-18">edit</i>
                            </p:commandLink>
                            <p:commandLink class="link"
                                           actionListener="#{notificacioncnBean.prepararHistorial}"
                                           title="Seguimiento" process="@this"
                                           update="allform:dlgHistorial"
                                           oncomplete="PF('dlgHistorial').show();" rendered="#{!loginBean.lectura}">
                                <i id="history_action" class="material-icons md-18">history</i>                            
                            </p:commandLink>
                            <p:commandLink class="link" title="Descargar" disabled="#{notificacion.notificacionEmitida}"
                                           actionListener="#{notificacioncnBean.prepararDescarga}"
                                           process="@this" update="mensajes allform:dlgFechaNotificacion"
                                           oncomplete="PF('dlgFechaNotificacion').show();" rendered="#{!loginBean.lectura}">
                                <i id="download_action" class="material-icons md-18">cloud_download</i>

                            </p:commandLink>
                            <p:commandLink class="link" title="Descargar" rendered="#{!loginBean.lectura}"
                                           actionListener="#{notificacioncnBean.viewErjafe}"
                                           process="@this" 
                                           update="mensajes"
                                           oncomplete="popupwindow('erjreport', '_blank', args);">
                                <i id="download_action" class="material-icons md-18">cloud_download</i>
                            </p:commandLink>
                            <p:commandLink class="link_remove" 
                                           actionListener="#{notificacioncnBean.eliminarNotificacion}"
                                           update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                           title="Eliminar" process="@this" rendered="#{!loginBean.lectura}">
                                <i id="delete_action" class="material-icons md-18">delete</i>
                                <p:confirm header="CONFIRMAR" message="SEGURO DE ELIMINAR LA NOTIFICACIÓN CON SOLICITUD: #{notificacion.solicitud} ?"/> 
                            </p:commandLink>
                            <p:commandLink class="link" actionListener="#{notificacioncnBean.prepararViewRo}"
                                           update="allform:dlgRoshow mensajes"
                                           oncomplete="if(args.viewro){PF('dlgRoshow').show()};"
                                           process="@this"
                                           title="Visualizar ro" rendered="#{loginBean.lectura}">

                                <i class="pi pi-eye" style="font-size: 2rem"></i>
                            </p:commandLink>
                        </p:column>
                        <f:facet name="footer">
                            <!-- <p:selectBooleanCheckbox value="{notificacioncnBean.separado}" itemLabel="Separados" rendered="{!loginBean.lectura}" /> -->
                            <p:commandButton process="tablaDeDatos" value="Descargar Seleccionados" 
                                             actionListener="#{notificacioncnBean.downloadSelected}" 
                                             update="mensajes" oncomplete="popupwindow('cambionombrep', '_self', args);" 
                                             rendered="#{!loginBean.lectura}" class="btn_peque" />
                            <p:commandButton process="tablaDeDatos" value="Descargar Seleccionados ERJAFE" 
                                         actionListener="#{notificacioncnBean.downloadSelectedErjafe}" 
                                         update="mensajes" oncomplete="popupwindow('erjreport', '_self', args);" 
                                         rendered="#{!loginBean.lectura}" class="btn_peque"/>

                        </f:facet>
                    </p:dataTable>
                    <p:outputLabel id="num_registros" value="#{notificacioncnBean.numRegistros}" style="float: left; font-size: 12px"/>
                    <h:panelGrid columns="2" style="float: right;">
                        <h:commandLink title="Exportar a excel..." rendered="#{!loginBean.lectura}" immediate="true">
                            <p:graphicImage class="excel" width="20px" height="20px" library="images" name="excel.png"/>
                            <p:dataExporter type="xlsx" target="tablaDeDatos" fileName="#{notificacioncnBean.exportName}"/>
                        </h:commandLink>
                        <br/>
                    </h:panelGrid>
                    <br/>
                </p:panel>
            </h:panelGrid>
            
            <p:dialog id="dlgTipoAbandono" modal="true" resizable="true"
                      header="TRÁMITES SELECCIONADOS PARA PASAR A ABANDONO" fitViewport="true"
                      widgetVar="dlgTipoAbandono" style="font-size: 11px; margin-bottom: 10px" showEffect="clip" 
                      hideEffect="explode" closeOnEscape="true" width="600px">
                <p:ajax event="close" update="dlgTipoAbandono" resetValues="true" />
                <p:growl id="tipoAb" life="1000"/>
                <h:form id="tipoAbanForm" >
                    <p:panel style="margin: 0 auto; text-align: center;" styleClass="panelpasa">
                        <p:outputLabel value="Con esta opción Ud. pasará todas las notificaciones seleccionadas a la pestaña de 'ABANDONOS'"
                                       style="font-size: 10px !important; text-align: center !important"/>
                    </p:panel>
                    <p:dataTable id="tablaDeAbandonos" var="abandono"
                                 value="#{notificacioncnBean.selectedNotificaciones}" widgetVar="tablaDeAbandonos"
                                 emptyMessage="No hay Datos para mostrar"                                                                               
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="10"
                                 rowsPerPageTemplate="10,25,60,150,200,250,300"
                                 style="margin:3px auto; font-size: 9px !important;">

                        <p:column headerText="Solicitud" style="text-align: center;" filterBy="#{notificacion.solicitud}" >
                            <h:outputText value="#{abandono.solicitud}" />
                        </p:column>
                        <p:column headerText="Solicitud" style="text-align: center;" filterBy="#{notificacion.denominacion}" >
                            <h:outputText value="#{abandono.denominacion}" />
                        </p:column>
                        <p:column headerText="Notificación" style="text-align: center;" filterBy="#{notificacion.notificacion}" >
                            <h:outputText value="#{abandono.notificacion}" />
                        </p:column>
                        <p:column headerText="F. Notificación" style="text-align: center;" >
                            <h:outputText value="#{abandono.fechaNotificacion}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <f:facet name="footer">
                            <p:outputPanel>
                                <h:outputText value="#{notificacioncnBean.selectedNotificaciones.size()} Registros" style="font-size: 9px"/>
                            </p:outputPanel>
                        </f:facet>
                    </p:dataTable>
                    <p:panelGrid style="width:  100% !important" columns="2" columnClasses="twenty-percent, seventy-percent">
                        <p:outputLabel value="Tipo Abandono:" for="tipoAbandono"/>
                        <p:selectOneMenu id="tipoAbandono" value="#{notificacioncnBean.tipoAbandono}" class="maxsize" >
                            <f:selectItem itemLabel="Seleccionar..." itemValue="" noSelectionOption="true" />
                            <f:selectItem itemLabel="ERJAFE" itemValue="ERJAFE"/>
                            <f:selectItem itemLabel="REGLAMENTO" itemValue="REGLAMENTO"/>
                            <f:selectItem itemLabel="COA" itemValue="COA"/>
                        </p:selectOneMenu>
                    </p:panelGrid>

                    <p:commandButton value="CERRAR" class="btn_cerrar" onclick="PF('dlgTipoAbandono').hide();" style="float: right;"/>
                    <p:commandButton value="PASAR A ABANDONOS" actionListener="#{notificacioncnBean.pasarAAbandonos}" 
                                     update="mensajes allform:tablaDeDatos tipoAbandono" process="@form"
                                     style="float: right; font-weight: bold;" class="btn_buscar"
                                     oncomplete="if(args.abit){PF('dlgTipoAbandono').hide();}">
                        <p:confirm header="CONFIRMAR" message="SEGURO DE PASAR LAS NOTIFICACIONES SELECCIONADAS A ABANDONO ?"/> 
                    </p:commandButton>

                </h:form>
            </p:dialog>
            
            <p:dialog id="dlgParaAbandono" modal="true" resizable="true"
                      header="TRÁMITES SELECCIONADOS PARA ESTABLECER COMO ABANDONO" fitViewport="true"
                      widgetVar="dlgParaAbandono" style="font-size: 11px; margin-bottom: 10px;" showEffect="clip" 
                      hideEffect="explode" closeOnEscape="true" width="800px">
                <p:ajax event="close" update="dlgParaAbandono" resetValues="true" />
                <p:growl id="paraAb" life="1000"/>
                <h:form id="paraAbanForm" >
                    <p:panel style="margin: 0 auto; text-align: center;" styleClass="panelpara">
                        <p:outputLabel value="Las Notificaciones seleccionadas se configurarán para abandono y una vez cumplido el plazo respectivo se pasarán a la pestaña 'ABANDONOS'"
                                       style="font-size: 10px !important; text-align: center !important;"/>
                    </p:panel>
                    <p:dataTable id="tablaDePara" var="abandono"
                                 value="#{notificacioncnBean.selectedNotificaciones}" widgetVar="tablaDePara"
                                 emptyMessage="No hay Datos para mostrar"                                                                               
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="10"

    <script type="text/javascript">
        $(document).ready(function () {
            setTimeout(function () {
                $('body').addClass('loaded');
                $('h1').css('color', '#222222');
                $("#footer").load("footer.html");
            }, 150);
            $("#menuside").load("menusidebar.html", function () {
                jQuery('#not_nom').addClass('activomenu');
                jQuery('#cambiosnomtitul').removeClass('sideinactivo').addClass('sideactivo');
            });
        });

        function getIdIndex(idName) {
            var doc = document.forms['allform'];
            var i;
            var idResult = 0;
            for (i = 0; doc.length > i; i++) {
                if (doc[i].id.includes(idName)) {
                    idResult = i;
                    console.log(doc[i].id);
                    break;
                }
            }
            return idResult;
        }

        //<![CDATA[
        function popupwindow(url, title, args) {
            if (args.doit) {
                window.open(url, title);
            }
        }
        function otherpage(url) {
            setTimeout(function () {
                window.open(url, '_blank');
            }, 0);
        }
        function logout(xhr, status, args) {
            setTimeout(function () {
                window.location = 'login.xhtml';
            }, 500);
        }
        //]]>
    </script>
