<!DOCTYPE html>
<html xmlns="http://www.w3c.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:x="http://xpert.com/faces">
    <h:head>
        <meta charset="utf-8" />
        <meta name="viewport"    content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="" />

        <title>CANCELACIÓN TÍTULOS</title>

        <link rel="shortcut icon" type="image/png" href="#{resource['images/favicon.png']}" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>

        <link rel="stylesheet" media="screen" href="http://fonts.googleapis.com/css?family=Open+Sans:300,400,700" />
        <link href="resources/assets/css/bootstrap.min.css" rel="stylesheet" />
        <link href="resources/assets/css/font-awesome.min.css" rel="stylesheet" />

        <!-- Custom styles for our template -->
        <link href="resources/assets/css/bootstrap-theme.css" rel="stylesheet" />
        <link href="resources/assets/css/main.css" rel="stylesheet" />
        <!-- My own style css -->
        <link href="resources/assets/css/style.css" rel="stylesheet" />

    </h:head>
    <h:body>
        <!-- Start Page Loading -->
        <div id="loader-wrapper">
            <div id="loader"></div>        
            <div class="loader-section section-left"></div>
            <div class="loader-section section-right"></div>
        </div>
        <p:growl id="mensajes" showDetail="true" life="4000"/>
        <h:form id="allform" enctype="multipart/form-data" style=" background: #e3e3e3; min-height: calc(100vh - 424px);">
            <div class="menu">
                <a href="#" class="logo"  title="Logo Senadi" ><img src="resources/images/sena_2.png" width="161px"/></a>

                <i id="edit_action" class="material-icons prefix" style="color: white; margin-left: 20px; display: inline-block">person</i>    

                <p:outputLabel value="#{loginBean.nombre}" style="color: white; font-size: 18px" />

                <div style="float: right; display: inline-block; margin-top: 5px">
                    <p:commandLink styleClass="btn_logout" actionListener="#{loginBean.logout}"
                                   oncomplete="logout(xhr, status, args)"
                                   title="CERRAR SESIÓN" immediate="true">
                        <i class="material-icons" style="font-size: 30px; ">exit_to_app</i>
                    </p:commandLink>
                </div>
                <a class="itemm" href="settings.xhtml" title="Configuración" style="display: #{loginBean.grupoActivo eq 'SC_CancelacionTitulos' or loginBean.lectura ? 'none':'inline-block'}"><i class="material-icons" >settings</i></a> 
                <a class="itemm" href="uplocert.xhtml" title="Upload Certificados" style="display: #{loginBean.grupoActivo eq 'SC_CancelacionTitulos' or loginBean.lectura ? 'none':'inline-block'}"><i class="material-icons" >upload</i></a>
                <a class="itemm" href="reportemod.xhtml" title="Reporte Modificaciones" >REPORTE MODIFICACIONES</a>
                <a class="itemm" href="cambiocasillero.xhtml" title="Cambio de Casillero" style="display: #{loginBean.grupoActivo eq 'SC_CancelacionTitulos' or loginBean.lectura ? 'none':'inline-block'}">CAMBIO DE CASILLERO</a>
                <a class="activo" href="#" title="Cancelación títulos" >CANCELACIÓN DE TÍTULOS</a>
                <a class="itemm" href="alcancesmod.xhtml" title="Alcances de Modificaciones" >ALCANCES</a>

            </div>
            <div class="card" style="margin-top: 20%; position: absolute;">
                <br/>
                <p:sidebar widgetVar="sidebar1" style="z-index: 999 !important; width: 22%; background: #E8F5E9; overflow: scroll">
                    <div id="menuside"></div>
                </p:sidebar>
                <p:commandButton icon="pi pi-arrow-right" type="button" onclick="PF('sidebar1').show()" styleClass="mr-2 " class="btn_sidebar"
                                 style="position: fixed; z-index: 999; background-color: #d30039 !important;"/>
            </div>
            <br/>
            <h:panelGrid columns="1"  style="text-align: center; font-size: 16px; font-weight: bold; margin: 0 auto; width: 80%;">

                <p:panel id="panelCancel" rendered="#{loginBean.grupoActivo eq 'SC_CancelacionTitulos' or loginBean.grupoActivo eq 'SC_Modificacion'}">
                    <br/>

                    <p:commandButton value="REGISTRAR TÍTULO" icon="pi pi-file" style="float: left" 
                                     disabled="#{cancelacionBean.tramantiguo}" class="btn_peque"  process="@parent" actionListener="#{cancelacionBean.registrarTitulo}"
                                     oncomplete="PF('dlgNuevoRegistro').show();" update="allform:dlgNuevoRegistro allform:frmNuevoRegistro mensajes"/>

                    <p:outputLabel value="Buscar Título"/>
                    <!-- <p:inputText value="{cancelacionBean.numtitulo}" placeholder="Ingrese un número de título" style="width: 20%"
                                 title="Ingrese un número de título..." autocomplete="off" disabled="{cancelacionBean.tramantiguo}"/> -->
                    <p:commandButton value="BUSCAR" actionListener="#{cancelacionBean.buscarTitulo}" process="@parent" 
                                     update="allform:dlgCancelacionTitulo mensajes" class="btn_peque" 
                                     oncomplete="if(args.doit){PF('dlgCancelacionTitulo').show();}" disabled="#{cancelacionBean.tramantiguo}"/>
                    <p:selectBooleanCheckbox value="#{cancelacionBean.tramantiguo}" style="margin-left: 10px;" title="Trámite sin título" itemLabel="Trámite sin título">
                        <p:ajax event="change" update="mensajes allform:panelCancel allform:tituloreg" process="@this" listener="#{cancelacionBean.tramAntiguaAction}" />
                    </p:selectBooleanCheckbox>

                    <p:commandButton value="X" style="float: right !important" class="btn_cerrar" title="CANCELAR ACCIÓN" rendered="#{cancelacionBean.busqueda}"
                                     update="mensajes allform:panelCancel allform:tituloreg" process="@this" actionListener="#{cancelacionBean.cancelacionEjecucion}"
                                     oncomplete="PF('permanentTip').hide();"/>
                    <br/><br/>
                    <p:panelGrid columns="4" style="text-align: center; margin: 0 auto !important; width: 90%; border-style: solid" 
                                 id="tituloreg" rendered="#{cancelacionBean.busqueda}" >
                        <p:outputLabel value="#{cancelacionBean.etiquetaTitulo}" />
                        <h:panelGroup >
                            <p:inputText value="#{cancelacionBean.tituloCancelado.numeroTitulo}" readonly="#{!cancelacionBean.tramantiguo}" 
                                         style="background: #C9E7C5 !important; width: 85%; text-transform: uppercase;" 
                                         placeholder="#{cancelacionBean.ejemploTitRes}" title="#{cancelacionBean.ejemploTitRes}"/>
                            <p:commandButton icon="pi pi-search" class="btn_peque"  actionListener="#{cancelacionBean.buscarResolucionSenadi}" rendered="#{cancelacionBean.tramantiguo}"
                                             process="@parent" update="mensajes allform:panelCancel allform:tituloreg" style="border-style: solid; border-color: #00bcd4;"/>
                        </h:panelGroup>

                        <p:outputLabel value="Expediente:"/>
                        <p:inputText value="#{cancelacionBean.tituloCancelado.expediente}" readonly="true" class="maxsize"/>
                        <p:outputLabel value="Número Trámite: " for="numTram"/>
                        <p:inputText id="numTram" value="#{cancelacionBean.tituloCancelado.numeroTramite}" disabled="true"
                                     class="maxsize" required="true"/>
                        <p:outputLabel value="Denominación:" for="denotext"/>
                        <p:panelGrid columns="2" style="width: 100%; padding: 0 !important; margin: 0 !important" class="noBorders maxsize">
                            <p:inputTextarea id="denotext" value="#{cancelacionBean.tituloCancelado.denominacion}" disabled="true" class="maxsize" 
                                             style="font-size: 16px !important; background: #C9E7C5 !important; " rows="3" required="true"/>
                            <p:commandButton id="btnedreg" class="btn_peque" actionListener="#{cancelacionBean.prepararVerDenominacion}" 
                                             icon="pi pi-refresh" oncomplete="PF('dlgEditarDeno').show()" process="@this"
                                             update="allform:dlgEditarDeno mensajes" />
                        </p:panelGrid>                        
                        <p:outputLabel value="Fecha Expediente:"/>
                        <p:inputText value="#{cancelacionBean.tituloCancelado.fechaExpediente}" disabled="true" class="maxsize">
                            <f:convertDateTime pattern="yyyy-MM-dd" />
                        </p:inputText>
                        <p:outputLabel value="Fecha Emisión:"/>
                        <p:inputText value="#{cancelacionBean.titulo.fechaEmisionDocumento}" disabled="true" class="maxsize"/>
                        <p:outputLabel value="Fecha Vencimiento:"/>
                        <p:inputText value="#{cancelacionBean.titulo.fechaVencimiento}" disabled="true" class="maxsize"/>

                        <p:outputLabel value="#{cancelacionBean.labeltramocdi}" for="numocdiPan"
                                       style="font-size: 14px !important; color: black !important; font-weight: bold !important;"/>
                        <h:panelGroup>
                            <p:inputText id="numocdiPan" value="#{cancelacionBean.tituloCancelado.numeroTramiteOCDI}" required="true" 
                                         label="Número de Trámite OCDI" style="background: #aed581 !important; width: 55%; text-transform: uppercase;" 
                                         title="Número de Trámite OCDI" rendered="#{!cancelacionBean.renuncia}"/>
                            <p:commandButton icon="pi pi-search" class="btn_peque"  actionListener="#{cancelacionBean.prepararVerDocumentosOCDI}"
                                             process="@parent" update="mensajes allform:dlgDocumentosOcdi"  oncomplete="if(args.viewdococdi){PF('dlgDocumentosOcdi').show();}"
                                             style="border-style: solid; border-color: #00bcd4;" rendered="#{!cancelacionBean.renuncia}"/>
                            <p:selectBooleanCheckbox value="#{cancelacionBean.renuncia}" style="margin-left: 10px;" title="Renuncia voluntaria" itemLabel="Renuncia voluntaria">
                                <p:ajax event="change" update="mensajes allform:panelCancel allform:tituloreg" process="@this" listener="#{cancelacionBean.renunciaVoluntaria}" />
                            </p:selectBooleanCheckbox>
                        </h:panelGroup>

                        <p:outputLabel value="#{cancelacionBean.labelResol}" for="resolucionPan" />
                        <p:inputText id="resolucionPan" value="#{cancelacionBean.tituloCancelado.resolucion}" class="maxsize" 
                                     required="true" style="border-style: solid;" />

                        <p:outputLabel value="#{cancelacionBean.labelFechaR}" for="fechaResPan" />
                        <p:calendar pattern="yyyy-MM-dd" value="#{cancelacionBean.tituloCancelado.fechaResolucion}" label="Fecha de resolución" 
                                    style="font-size: 20px !important; margin-right: 5px; " required="true" navigator="true"
                                    placeholder="Fecha de Resolución" inputStyleClass="maxsize" id="fechaResPan" />

                        <p:outputLabel value="Tipo:" for="tipcanc" style="font-size: 14px !important; color: black !important; font-weight: bold !important;"/>
                        <p:selectOneMenu id="tipcanc" style="margin-right: 100px;" class="maxsize" required="#{!cancelacionBean.tiporenuncia}"
                                         value="#{cancelacionBean.tituloCancelado.tipoCancelacion}" >
                            <f:selectItem itemLabel="Seleccionar..." itemValue="" noSelectionOption="true"/>
                            <f:selectItem itemLabel="CANCELACIÓN TOTAL" itemValue="TOTAL"/>
                            <f:selectItem itemLabel="CANCELACIÓN PARCIAL" itemValue="PARCIAL"/>
                            <f:selectItem itemLabel="NULIDAD TOTAL" itemValue="NULIDAD TOTAL"/>
                            <f:selectItem itemLabel="NULIDAD PARCIAL" itemValue="NULIDAD PARCIAL" />
                            <f:selectItem id="aa" itemLabel="RENUNCIA PARCIAL" itemValue="RENUNCIA PARCIAL"/>
                            <f:selectItem id="bb" itemLabel="RENUNCIA TOTAL" itemValue="RENUNCIA TOTAL"/>
                            <f:selectItem id="cc" itemLabel="EMBARGO PARCIAL" itemValue="EMBARGO PARCIAL"/>
                            <f:selectItem id="dd" itemLabel="EMBARGO TOTAL" itemValue="EMBARGO TOTAL"/>
                            <p:ajax event="change" update="mensajes allform:panelCancel allform:tituloreg" process="@parent" listener="#{cancelacionBean.enableProductosV}" />
                        </p:selectOneMenu>

                        <p:outputLabel value="Productos Vigentes:" rendered="#{cancelacionBean.prodvig}" id="prodvigL" 
                                       style="font-size: 14px !important; color: black !important; font-weight: bold !important;"/>
                        <p:inputTextarea value="#{cancelacionBean.tituloCancelado.productosVigentes}" class="maxsize" id="prodvigT"
                                         rendered="#{cancelacionBean.prodvig}" />

                        <p:outputLabel value="#{cancelacionBean.labeladjuntar}" style="font-size: 14px !important; color: black !important; font-weight: bold !important;"/>
                        <h:panelGroup>
                            <p:fileUpload skinSimple="true" mode="simple" label="ADJUNTAR" accept=".pdf" update="mensajes" rendered="#{!cancelacionBean.tramocdi}"
                                          uploadLabel="SUBIR" value="#{cancelacionBean.file}" title="ADJUNTE LA RESOLUCIÓN" chooseButtonStyleClass="btn_peque"
                                          />
                            <p:commandLink id="notlink" value="#{cancelacionBean.tituloCancelado.resolucion}" style="color: #0089ec; font-size: 14px;" 
                                           rendered="#{cancelacionBean.tramocdi}" process="@this" title="Visualizar Resolución #{cancelacionBean.tituloCancelado.resolucion}" 
                                           oncomplete="otherpage('#{cancelacionBean.tituloCancelado.documento}');" update="mensajes notlink" />
                        </h:panelGroup>

                        <p:outputLabel value=""/>
                        <p:spacer>
                            <p:tooltip id="permanentTip" for="btnedreg" style="font-size: 13px" position="right" hideEvent="true" 
                                       showDelay="0" widgetVar="permanentTip" >
                                <h:outputText value="Asegúrese que la denominación"/>
                                <br/>
                                <h:outputText value="esté escrita correctamente, "/>
                                <br/>
                                <h:outputText value="caso contrario editar bajo"/>
                                <br/>
                                <h:outputText value="su responsabilidad o informar"/>
                                <br/>
                                <h:outputText value="al Administrador "/>
                            </p:tooltip>
                        </p:spacer>
                        <p:outputLabel value="" rendered="#{cancelacionBean.prodvig}" id="empty1"/>
                        <p:outputLabel value="" rendered="#{cancelacionBean.prodvig}" id="empty2"/>
                        <p:outputLabel value=""/>
                        <p:commandButton value="EJECUTAR ACCIÓN" actionListener="#{cancelacionBean.ejecutarAccion}" class="btn_buscar" process="@form"
                                         title="Cancelamiento Parcial ocurre cuando el titular ha decidido cancelar solo determinada protección del título"
                                         update="mensajes allform:panelCancel allform:panelTitC allform:tablaDeDatos" rendered="#{cancelacionBean.busqueda}"
                                         >
                            <p:confirm header="CONFIRMAR" message="Seguro de Realizar la #{cancelacionBean.tituloCancelado.tipoCancelacion} del Título #{cancelacionBean.tituloCancelado.numeroTitulo} con expediente #{cancelacionBean.tituloCancelado.expediente} ?"/>
                        </p:commandButton>
                    </p:panelGrid>

                    <br/>
                </p:panel>               

            </h:panelGrid>           

            <p:panel id="panelTitC" style="width: 97%; margin: 0 auto; text-align: center" >
                <p:outputLabel value="TÍTULOS CANCELADOS" style="font-size: 16px !important;"/>
                <p:dataTable id="tablaDeDatos" var="titulocancelado"
                             value="#{cancelacionBean.titulosCancelados}" widgetVar="tablaDeDatos"
                             emptyMessage="No hay Datos para mostrar"
                             binding="#{cancelacionBean.tituloCanceladoDataTable}"
                             paginator="true"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             rows="20" rowsPerPageTemplate="20,50,100,150,200,250,300"
                             style="border: black !important; "
                             selectionMode="single" 
                             rowKey="#{titulocancelado.id}" >

                    <p:column headerText="N. Canc." style="text-align: center;" class="rowtable"
                              filterBy="#{titulocancelado.id}" filterMatchMode="contains">
                        <h:outputText value="#{titulocancelado.id}" />
                    </p:column>
                    <p:column headerText="Título/Resolución" style="text-align: center;" class="rowtable"
                              filterBy="#{titulocancelado.numeroTitulo}" filterMatchMode="contains">
                        <h:outputText value="#{titulocancelado.numeroTitulo}" />
                    </p:column>
                    <p:column headerText="Expediente" style="text-align: center;" class="rowtable"
                              filterBy="#{titulocancelado.expediente}" filterMatchMode="contains">
                        <h:outputText value="#{titulocancelado.expediente}" />
                    </p:column>
                    <p:column headerText="N. Trámite OCDI" style="text-align: center;" class="rowtable"
                              filterBy="#{titulocancelado.numeroTramiteOCDI}" filterMatchMode="contains">
                        <h:outputText value="#{titulocancelado.numeroTramiteOCDI}" />
                    </p:column>
                    <p:column headerText="Denominación" style="text-align: center;" class="rowtable"
                              filterBy="#{titulocancelado.denominacion}" filterMatchMode="contains">
                        <h:outputText value="#{titulocancelado.denominacion}" />
                    </p:column>
                    <p:column headerText="Resolución OCDI / Resolución RV" style="text-align: center;" class="rowtable"
                              filterBy="#{titulocancelado.resolucion}" filterMatchMode="contains">
                        <h:outputText value="#{titulocancelado.resolucion}" />
                    </p:column>
                    <p:column headerText="F. Resolución OCDI / F.RenunciaV." style="text-align: center;" class="rowtable">                        
                        <h:outputText value="#{titulocancelado.fechaResolucion}" >
                            <f:convertDateTime pattern="yyyy-MM-dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="F. Actualización Aplicativo" style="text-align: center;" class="rowtable">                        
                        <h:outputText value="#{titulocancelado.fechaCancelacion}" >
                            <f:convertDateTime pattern="yyyy-MM-dd" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="P. Vigentes" style="text-align: center;" class="rowtable">
                        <h:outputText value="#{titulocancelado.productosVigentes}" />
                    </p:column>
                    <p:column headerText="Tipo" style="text-align: center;" class="rowtable"
                              filterBy="#{titulocancelado.tipoText}" filterMatchMode="contains">
                        <h:outputText value="#{titulocancelado.tipoText}" />
                    </p:column>
                    <p:column headerText="Usuario" style="text-align: center;" class="rowtable"
                              filterBy="#{titulocancelado.usuario}" filterMatchMode="contains">
                        <h:outputText value="#{titulocancelado.usuario}" />
                    </p:column>
                    <p:column  headerText="Acción" style="text-align: center;" >                        
                        <p:commandLink id="notlink"  style="color: #0089ec; font-size: 14px;" process="@this" class="linkcas"
                                       title="Visualizar Documento #{titulocancelado.resolucion}" oncomplete="otherpage('#{titulocancelado.documento}');"
                                       update="mensajes" rendered="#{!(titulocancelado.documento eq null)}">
                            <i class="pi pi-eye" style="font-size: 2rem"></i>
                        </p:commandLink>
                        <p:commandLink id="reversar" actionListener="#{cancelacionBean.reversarCancelacion}" process="@this" 
                                       class="link_remove" title="Reversar Cancelación del título #{titulocancelado.numeroTitulo}" 
                                       style="color: #0089ec; font-size: 14px;"  update="mensajes allform:tablaDeDatos" rendered="#{loginBean.grupoActivo eq 'SC_CancelacionTitulos' or loginBean.grupoActivo eq 'SC_Modificacion'}">
                            <i class="pi pi-backward" style="font-size: 2rem"></i>
                            <p:confirm header="REVERSAR #{titulocancelado.numeroTitulo}" message="SEGURO QUE DESEA REVERSAR LA CANCELACIÓN DEL TÍTULO #{titulocancelado.denominacion} ?"/>
                        </p:commandLink>
                    </p:column>
                    <f:facet name="footer">
                        <p:outputLabel value="#{cancelacionBean.titulosCancelados.size()} Registros"/>                        
                    </f:facet>
                </p:dataTable>
                <h:panelGrid columns="2" style="float: right;">
                    <h:commandLink title="Exportar a excel..." rendered="#{loginBean.grupoActivo eq 'SC_CancelacionTitulos'?true:false}" immediate="true">
                        <p:graphicImage class="excel" width="20px" height="20px" library="images" name="excel.png"/>
                        <p:dataExporter type="xls" target="tablaDeDatos" fileName="titulos_cancelados" />
                    </h:commandLink>                        
                </h:panelGrid>
                <br/>
            </p:panel>

            <p:confirmDialog global="true" showEffect="explode" hideEffect="explode" style="white-space: pre; ">
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes btn_peque" />
                <p:commandButton value="No" type="button"  styleClass="ui-confirmdialog-no btn_peque" />
            </p:confirmDialog>

            <p:dialog id="dlgNuevoRegistro" modal="true" resizable="true"
                      header="TRÁMITES QUE NO TIENEN REGISTRADO EL TÍTULO EN LA BASE DE DATOS" fitViewport="true" width="70%"
                      widgetVar="dlgNuevoRegistro" style="font-size: 11px; margin-bottom: 10px; " showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true" >
                <p:ajax event="close" update="dlgNuevoRegistro" resetValues="true" />
                <h:form id="frmNuevoRegistro" style="text-align: center !important; margin: 0 auto !important;">
                    <p:panel style="width: 55%; text-align: center; margin: 0 auto;">
                        <p:outputLabel value="Los registros que se muestren en esta ventana, no poseen título registrado en la base de datos"
                                       style="color: blue;"/>
                    </p:panel>
                    <br/>
                    <p:outputLabel value="Denominación: "/>
                    <p:inputText value="#{cancelacionBean.denominacionRegistro}" style="font-size: 16px !important; width: 300px"/>
                    <p:commandButton id="buscarBtn" value="BUSCAR" class="btn_peque" actionListener="#{cancelacionBean.buscarPorDenominacion}" 
                                     process="@parent" update="mensajes allform:frmNuevoRegistro tablaDeTramSinTit" />
                    <p:commandButton actionListener="#{cancelacionBean.limpiarBusquedaSinTi}" title="LIMPIAR TABLA"
                                     update="allform:frmNuevoRegistro tablaDeTramSinTit mensajes" process="@this" icon="pi pi-sync" class="btn_peque"/>
                    
                    <p:dataTable id="tablaDeTramSinTit" var="tramsintit"
                                 value="#{cancelacionBean.signosSinTitulo}" widgetVar="tablaDeTramSinTit"
                                 emptyMessage="No hay Datos para mostrar"                                              
                                 filteredValue="#{cancelacionBean.signosSinTituloFiltrados}"
                                 binding="#{cancelacionBean.signoSinTituloDataTable}"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="20" rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 style="border: black !important; "
                                 selectionMode="single"
                                 rowKey="#{tramsintit.codigoSolicitudSigno}" >

                        <p:column headerText="Denominación" style="text-align: center;" class="rowtable"
                                  filterBy="#{tramsintit.denominacion}" filterMatchMode="contains">
                            <h:outputText value="#{tramsintit.denominacion}" />
                        </p:column>

                        <p:column headerText="Trámite" style="text-align: center;" class="rowtable"
                                  filterBy="#{tramsintit.numTramite}" filterMatchMode="contains">
                            <h:outputText value="#{tramsintit.numTramite}" />
                        </p:column>

                        <p:column headerText="F. Presentación" style="text-align: center;" class="rowtable">
                            <h:outputText value="#{tramsintit.fechaPresentacion}" />
                        </p:column>

                        <p:column headerText="Expediente" style="text-align: center;" class="rowtable"
                                  filterBy="#{tramsintit.numeroExpediente}" filterMatchMode="contains">
                            <h:outputText value="#{tramsintit.numeroExpediente}" />
                        </p:column>

                        <p:column headerText="NIZA" style="text-align: center;" class="rowtable"
                                  filterBy="#{tramsintit.clasificacionNiza}" filterMatchMode="contains">
                            <h:outputText value="#{tramsintit.clasificacionNiza}" />
                        </p:column>

                        <p:column headerText="Estado" style="text-align: center;" class="rowtable"
                                  filterBy="#{tramsintit.estado}" filterMatchMode="contains">
                            <h:outputText value="#{tramsintit.estado}" />
                        </p:column>

                        <p:column headerText="Acción" style="text-align: center">
                            <p:commandLink class="linkcas"
                                           actionListener="#{cancelacionBean.seleccionarTramSinTit}"
                                           update="allform:panelCancel mensajes allform:dlgRegistroTitulo allform:frmRegTit"
                                           oncomplete="if(args.tramsitido){PF('dlgRegistroTitulo').show();}"
                                           process="@this"
                                           title="Seleccionar #{tramsintit.numTramite}" >
                                <i class="pi pi-pencil" style="font-weight: bold"></i>
                            </p:commandLink>
                        </p:column>
                        <f:facet name="footer">
                            <p:outputLabel value="#{cancelacionBean.signosSinTitulo.size()} Registros"/>                        
                        </f:facet>
                    </p:dataTable>
                    <p:commandButton value="CERRAR" class="btn_cerrar" oncomplete="PF('dlgNuevoRegistro').hide()" style="float: right"/>
                    <!--<p:commandButton value="CERRAR" class="btn_cerrar" oncomplete="PF('dlgEditarDeno').hide()" style="float: right"/>-->
                </h:form>
            </p:dialog>

            <p:dialog id="dlgRegistroTitulo" modal="true" resizable="true"
                      header="TRÁMITE #{cancelacionBean.signoSinTitulo.numTramite}" 
                      fitViewport="true" width="40%" widgetVar="dlgRegistroTitulo" style="font-size: 11px; margin-bottom: 10px; " 
                      showEffect="explode" hideEffect="explode" closeOnEscape="true" >
                <p:ajax event="close" update="dlgRegistroTitulo" resetValues="true" />
                <h:form id="frmRegTit" style="text-align: center !important; margin: 0 auto !important; background: #e9e9e9 !important" >

                    <p:panelGrid columns="2" style="width: 100%" columnClasses="twenty-percent, seventy-percent">                        
                        <p:outputLabel value="Denominación:"/> 
                        <p:inputText value="#{cancelacionBean.signoSinTitulo.denominacion}" readonly="true" class="maxsize" style="background: #E8F5E9 !important; font-weight: bold !important;"/>
                        <p:outputLabel value="Expediente:"/>
                        <p:inputText value="#{cancelacionBean.signoSinTitulo.numeroExpediente}" readonly="true" class="maxsize" style="background: #E8F5E9 !important; font-weight: bold !important;"/>
                        <p:outputLabel value="Fecha Presentación:"/>
                        <p:inputText value="#{cancelacionBean.signoSinTitulo.fechaPresentacion}" readonly="true" class="maxsize" style="background: #E8F5E9 !important; font-weight: bold !important;"/>
                        <p:outputLabel value="NIZA:"/>
                        <p:inputText value="#{cancelacionBean.signoSinTitulo.clasificacionNiza}" readonly="true" class="maxsize" style="background: #E8F5E9 !important; font-weight: bold !important;"/>
                        <p:outputLabel value="Estado:"/>
                        <p:inputText value="#{cancelacionBean.signoSinTitulo.estado}" readonly="true" class="maxsize" style="background: #E8F5E9 !important; font-weight: bold !important;"/>
                        <p:outputLabel value="Titulo:" for="titInput"/>
                        <p:inputText id="titInput" widgetVar="titInput" value="#{cancelacionBean.signoSinTitulo.numTitulo}" required="true" class="maxsize" />
                        <p:outputLabel value="Fecha Emisión:"/>
                        <p:calendar pattern="yyyy-MM-dd" value="#{cancelacionBean.signoSinTitulo.fechaEmisionDocumento}" label="Fecha de emisión" 
                                    style="font-size: 20px !important; margin-right: 5px; "  navigator="true"
                                    placeholder="Fecha de Emisión" inputStyleClass="maxsize" id="fechaEmis" />
                        <p:outputLabel value="Fecha Vencimiento:"/>
                        <p:calendar pattern="yyyy-MM-dd" value="#{cancelacionBean.signoSinTitulo.fechaVencimiento}" label="Fecha de vencimiento" 
                                    style="font-size: 20px !important; margin-right: 5px; " navigator="true"
                                    placeholder="Fecha de Vencimiento" inputStyleClass="maxsize" id="fechaVenc"/>                        
                    </p:panelGrid>

                    <p:commandButton value="CERRAR" onclick="PF('dlgRegistroTitulo').hide();" class="btn_cerrar" style="float: right; margin-top: 3px;"/>
                    <p:commandButton value="GUARDAR" class="btn_buscar" style="float: right; margin-right: 2px !important; margin-top: 3px;" 
                                     actionListener="#{cancelacionBean.guardarNuevoTitulo}" update="mensajes" process="@parent"
                                     oncomplete="if(args.savetitdo){PF('dlgRegistroTitulo').hide();PF('dlgNuevoRegistro').hide();}">
                        <p:confirm header="CONFIRMAR" message="ESTÁ SEGURO DE GUARDAR EL TÍTULO ?"/>
                    </p:commandButton>

                </h:form>

            </p:dialog>

            <p:dialog id="dlgDocumentosOcdi" modal="true" resizable="true"
                      header="TRÁMITE OCDI A BUSCAR #{cancelacionBean.tituloCancelado.numeroTramiteOCDI}" 
                      fitViewport="true" width="90%" widgetVar="dlgDocumentosOcdi" style="font-size: 11px; margin-bottom: 10px; " 
                      showEffect="explode" hideEffect="explode" closeOnEscape="true" >
                <p:ajax event="close" update="dlgDocumentosOcdi" resetValues="true" />
                <h:form id="frmOcdi" style="text-align: center !important; margin: 0 auto !important; background: #e9e9e9 !important" >
                    <p:dataTable id="tablaDeCPIS" var="cpi"
                                 value="#{cancelacionBean.cpis}" widgetVar="tablaDeCPIS"
                                 emptyMessage="No hay Datos para mostrar"                                              
                                 filteredValue="#{cancelacionBean.cpisFiltrados}"
                                 binding="#{cancelacionBean.cpiDataTable}"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="10"
                                 rowsPerPageTemplate="10,25,50,100,250,500"
                                 style="border: black !important" editable="true"
                                 rowKey="#{cpi.currentProcedure}">

                        <p:ajax event="rowEdit" listener="#{cancelacionBean.onRowEditCpi}" update="mensajes"/>
                        <p:ajax event="rowEditCancel" listener="#{cancelacionBean.onRowCancelCpi}" update="mensajes"/>

                        <p:column headerText="Trámite" style="text-align: center;" class="rowtable"
                                  filterBy="#{cpi.currentProcedure}" filterMatchMode="contains">
                            <h:outputText value="#{cpi.currentProcedure}" />
                        </p:column>

                        <p:column headerText="Titular" style="text-align: center;" class="rowtable"
                                  filterBy="#{cpi.recurrent}" filterMatchMode="contains">
                            <h:outputText value="#{cpi.recurrent}" />
                        </p:column>

                        <p:column headerText="Denominación" style="text-align: center;" class="rowtable"
                                  filterBy="#{cpi.denomination}" filterMatchMode="contains" width="35%">                            
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText value="#{cpi.denomination}" />
                                </f:facet>
                                <f:facet name="input">
                                    <p:inputTextarea value="#{cpi.denomination}" style="width:100%"/>
                                </f:facet>
                            </p:cellEditor>                            
                        </p:column>

                        <p:column headerText="Fecha Recurso" style="text-align: center;" class="rowtable">
                            <h:outputText value="#{cpi.resourceDate}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>                        

                        <p:column headerText="Resolución" style="text-align: center;" class="rowtable"
                                  filterBy="#{cpi.resolutionNumber}" filterMatchMode="contains">
                            <h:outputText value="#{cpi.resolutionNumber}" />
                        </p:column>

                        <p:column headerText="Fecha Resolución" style="text-align: center;" class="rowtable">
                            <h:outputText value="#{cpi.resolutionDate}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Año" style="text-align: center;" class="rowtable"
                                  filterBy="#{cpi.cpiYear}" filterMatchMode="contains">
                            <h:outputText value="#{cpi.cpiYear}" />
                        </p:column>

                        <p:column style="width:6rem">
                            <p:rowEditor editTitle="Editar Denominación" cancelTitle="Cancelar" saveTitle="Guardar Cambios"/>
                        </p:column>

                        <p:column headerText="Documento" style="text-align: center;" class="rowtable">
                            <p:commandLink id="notlink" value="#{cpi.writtenFile}" style="color: #0089ec; font-size: 14px;" 
                                           rendered="#{cpi.document}" process="@this" title="Visualizar Resolución #{cpi.resolutionNumber}" 
                                           onclick="otherpage('#{cpi.documentPath}');" />

                            <p:outputLabel value="Sin documento" rendered="#{!cpi.document}"/>
                        </p:column>

                        <p:column headerText="Seleccionar" style="text-align: center">
                            <p:commandLink class="linkcas"
                                           actionListener="#{cancelacionBean.seleccionarCpi}"
                                           update="allform:panelCancel mensajes"
                                           oncomplete="if(args.selectdo){PF('dlgDocumentosOcdi').hide();}"
                                           process="@this"
                                           title="Seleccionar #{cpi.currentProcedure}" >
                                <i class="pi pi-check" style="font-weight: bold"></i>
                            </p:commandLink>
                        </p:column>

                        <f:facet name="footer">
                            <p:outputLabel value="#{cancelacionBean.cpis.size()} Registros."/>
                            <p:commandButton value="CERRAR" onclick="PF('dlgDocumentosOcdi').hide();" class="btn_cerrar" style="float: right"/>
                        </f:facet>

                    </p:dataTable>
                </h:form>
            </p:dialog>

            <p:dialog id="dlgEditarDeno" modal="true" resizable="true"
                      header="TÍTULO #{cancelacionBean.tituloCancelado.numeroTitulo} - Expediente: #{cancelacionBean.tituloCancelado.expediente}" fitViewport="true" width="40%"
                      widgetVar="dlgEditarDeno" style="font-size: 11px; margin-bottom: 10px; " showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true" >
                <p:ajax event="close" update="dlgEditarDeno" resetValues="true" />
                <h:form id="frmDenominacion" >
                    <p:outputLabel value="Denominación: "/>
                    <p:inputTextarea value="#{cancelacionBean.denominacion}" class="maxsize" style="font-size: 16px !important"/>
                    <br/><br/>                    
                    <p:commandButton value="CERRAR" class="btn_cerrar" oncomplete="PF('dlgEditarDeno').hide()" style="float: right"/>
                    <p:commandButton value="EDITAR" class="btn_buscar" style="float: right" actionListener="#{cancelacionBean.editarDenominacionTitulo}"
                                     oncomplete="if(args.dendoit){PF('dlgEditarDeno').hide();}" update="allform:panelCancel mensajes"
                                     process="@parent">                        
                        <p:confirm header="CONFIRMAR" message="ESTÁ SEGURO DE EDITAR LA DENOMINACIÓN ACTUAL ?"/>
                    </p:commandButton>                    
                </h:form>
            </p:dialog>

            <p:dialog id="dlgCancelacionTitulo" modal="true" resizable="true"
                      header="TÍTULOS ECONTRADOS DE LA BÚSQUEDA #{cancelacionBean.numtitulo}" fitViewport="true" width="80%"
                      widgetVar="dlgCancelacionTitulo" style="font-size: 11px; margin-bottom: 10px; " showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true" >
                <p:ajax event="close" update="dlgCancelacionTitulo" resetValues="true" />

                <h:form id="frmCancel" style="text-align: center !important; margin: 0 auto !important; background: #e9e9e9 !important" >
                    <p:outputLabel value="Buscar: " style="margin-right: 5px;"/>
                    <p:inputText value="#{cancelacionBean.titDenoText}" placeholder="Puede buscar por número de título o denominación" 
                                 style="margin-right: 5px; width: 350px"/>
                    <p:commandButton value="BUSCAR" actionListener="#{cancelacionBean.buscarTitulos}" class="btn_peque"
                                     update="frmCancel tablaDeTitulos mensajes" 
                                     process="@parent" style="height: 100% !important"/>
                    <p:commandButton actionListener="#{cancelacionBean.limpiarBusquedaTitulo}" title="LIMPIAR TABLA"
                                     update="allform:frmCancel tablaDeTitulos mensajes" process="@parent" icon="pi pi-sync" class="btn_peque"/>                                        
                    
                    <p:dataTable id="tablaDeTitulos" var="titulo"
                                 value="#{cancelacionBean.titulos}" widgetVar="tablaDeTitulos"
                                 emptyMessage="No hay Datos para mostrar"                                              
                                 filteredValue="#{cancelacionBean.titulosFiltrados}"
                                 binding="#{cancelacionBean.tituloDataTable}"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="10"
                                 rowsPerPageTemplate="10,25,50,100,250,500"
                                 style="border: black !important" 
                                 selectionMode="single"
                                 rowKey="#{titulo.codigoSolicitudSigno}">

                        <p:column headerText="Título/Registro" style="text-align: center;" class="rowtable"
                                  filterBy="#{titulo.numTitulo}" filterMatchMode="contains">
                            <h:outputText value="#{titulo.numTitulo}" style="font-size: 14px; font-weight: bold !important;"/>
                        </p:column>
                        <p:column headerText="Número Expediente" style="text-align: center;" class="rowtable"
                                  filterBy="#{titulo.numeroExpediente}" filterMatchMode="contains">
                            <h:outputText value="#{titulo.numeroExpediente}" />
                        </p:column>

                        <p:column headerText="Fecha Expediente" style="text-align: center;" class="rowtable">
                            <h:outputText value="#{titulo.fechaExpediente}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Número Trámite" style="text-align: center;" class="rowtable"
                                  filterBy="#{titulo.numTramite}" filterMatchMode="contains">
                            <h:outputText value="#{titulo.numTramite}" />
                        </p:column>

                        <p:column headerText="Denominación" style="text-align: center;" class="rowtable"
                                  filterBy="#{titulo.denominacion}" filterMatchMode="contains">
                            <h:outputText value="#{titulo.denominacion}" />
                        </p:column>
                        <p:column headerText="Fecha Emisión" style="text-align: center;" class="rowtable">
                            <h:outputText value="#{titulo.fechaEmisionDocumento}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Fecha Vencimiento" style="text-align: center;" class="rowtable">
                            <h:outputText value="#{titulo.fechaVencimiento}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Seleccionar" style="text-align: center">
                            <p:commandLink class="linkcas"
                                           actionListener="#{cancelacionBean.seleccionarTitulo}"
                                           update="allform:panelCancel mensajes"
                                           oncomplete="PF('dlgCancelacionTitulo').hide();PF('permanentTip').show();"
                                           process="@this" 
                                           title="Seleccionar #{titulo.numeroExpediente}" >
                                <i class="pi pi-check" ></i>
                            </p:commandLink>
                        </p:column>

                        <f:facet name="footer">
                            <p:outputLabel value="#{cancelacionBean.numRegistros}"/>
                            <p:commandButton value="CERRAR" onclick="PF('dlgCancelacionTitulo').hide();" class="btn_cerrar" style="float: right"/>
                        </f:facet>

                    </p:dataTable>
                                        
                </h:form>
            </p:dialog>

            <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()" />

            <p:dialog widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                <p:graphicImage name="/images/ajax-loader.gif" />
            </p:dialog>
        </h:form>


        <div id="footer"></div>

        <p:idleMonitor timeout="#{1000*60*60}" id="idleSesion">
            <p:ajax event="idle" listener="#{idleMonitorCtrl.idleListener}"
                    oncomplete="PF('idleDialog').show()" />
        </p:idleMonitor>
        <p:dialog header="Sesión Caducada" resizable="false"
                  widgetVar="idleDialog" modal="true" closable="false" style="font-size: 12px">
            <h:form id="sesionCaducaForm">
                <div class="titlePage">
                    <h:outputText value="Sesión Caducada " />
                    <p:commandButton styleClass="nav-link js-scroll-trigger"
                                     actionListener="#{loginBean.logout}"
                                     oncomplete="logout(xhr, status, args)"
                                     value="ACEPTAR" immediate="true" style="font-size: 12px"/>
                </div>
            </h:form>
        </p:dialog>


        <!-- JavaScript libs are placed at the end of the document so the pages load faster -->

        <!-- <script src="resources/assets/js/headroom.min.js"></script>
        <script src="resources/assets/js/jQuery.headroom.min.js"></script>
        <script src="resources/assets/js/template.js"></script> -->


    </h:body>
    <script type="text/javascript">
        $(document).ready(function () {
            setTimeout(function () {
                $('body').addClass('loaded');
                $('h1').css('color', '#222222');
                $("#footer").load("footer.html");

            }, 150);
            $("#menuside").load("menusidebar.html", function () {
                jQuery('#canctit').addClass('activomenu');
                jQuery('#cancelacion').removeClass('sideinactivo').addClass('sideactivo');
            });
        });

        function getIdIndex(idName) {
            var doc = document.forms['allform'];
            var i;
            var idResult = 0;
            for (i = 0; doc.length > i; i++) {
                if (doc[i].id.includes(idName)) {
                    idResult = i;
                    console.log(doc[i].id);
                    break;
                }
            }
            return idResult;
        }

        //<![CDATA[
        function popupwindow(url, title, args) {
            if (args.doit) {
                window.open(url, title);
            }
        }
        function otherpage(url) {
            setTimeout(function () {
                window.open(url, '_blank');
            }, 0);
        }
        function logout(xhr, status, args) {
            setTimeout(function () {
                window.location = 'login.xhtml';
            }, 500);
        }
        //]]>
    </script>
</html>
