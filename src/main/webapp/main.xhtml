<!DOCTYPE html>
<html xmlns="http://www.w3c.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:x="http://xpert.com/faces">
    <h:head>
        <meta charset="utf-8" />
        <meta name="viewport"    content="width=device-width, initial-scale=1.0" />
        <title>MODIFICACIONES</title>

        <link rel="shortcut icon" type="image/png" href="#{resource['images/favicon.png']}" />

        <link  href='./css-pro-layout.css' rel='stylesheet'/>        
        <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/remixicon@2.2.0/fonts/remixicon.css' />        

        <link href="./style.css" rel="stylesheet" />

    </h:head>
    <h:body>
        <!-- partial:index.partial.html -->
        <div class="layout has-sidebar fixed-sidebar fixed-header">
            <aside id="sidebar" class="sidebar break-point-lg has-bg-image" >
                <div class="image-wrapper" >
                    <img src="#{resource['images/black_left_b.png']}" alt="sidebar background" />
                    
                </div>
                <div class="sidebar-layout" >
                    <div class="sidebar-header">
                        <a href="index.xhtml">                            
                            <img src="#{resource['images/sena.png']}" height="60px"/>
                        </a>
                    </div>
                    <div class="sidebar-content">
                        <nav class="menu open-current-submenu">
                            <ul >
                                <li class="menu-item" style="background: darkslategray">
                                    <a href="#">
                                        <span class="menu-icon">
                                            <i class="ri-vip-diamond-fill"></i>
                                        </span>
                                        <span class="menu-title">Transferencias</span>
                                    </a>
                                </li>
                                <li class="menu-item" style="background: darkslategray">
                                    <a href="#">
                                        <span class="menu-icon">
                                            <i class="ri-vip-diamond-fill"></i>
                                        </span>
                                        <span class="menu-title">Cambios de Domicilio</span>
                                    </a>
                                </li>
                                <li class="menu-item" style="background: darkslategray">
                                    <a href="#">
                                        <span class="menu-icon">
                                            <i class="ri-vip-diamond-fill"></i>
                                        </span>
                                        <span class="menu-title">Cambios de Nombre</span>
                                    </a>
                                </li>
                            </ul>
                            
                        </nav>

                    </div>
                    <div class="sidebar-footer"><img src="#{resource['images/sena.png']}" height="60px"/></div>
                </div>
            </aside>
            <div id="overlay" class="overlay"></div>
            <div class="layout">
                <header class="header">
                    <a id="btn-collapse" href="#">
                        <i class="ri-menu-line ri-xl"></i>
                    </a>
                    <a id="btn-toggle" href="#" class="sidebar-toggler break-point-lg">
                        <i class="ri-menu-line ri-xl"></i>
                    </a>
                    <h2 style="margin-left: 10px;">TRANSFERENCIAS</h2>
                </header>
                <main class="content">
                    <!-- Start Page Loading -->
                    <div id="loader-wrapper">
                        <div id="loader"></div>        
                        <div class="loader-section section-left"></div>
                        <div class="loader-section section-right"></div>
                    </div>
                    <p:growl id="mensajes" showDetail="true" life="4000"/>
                    <h:form id="allform" enctype="multipart/form-data" style=" background: #e3e3e3; min-height: calc(100vh - 424px);">
                        <div class="menu">

                            <i id="edit_action" class="material-icons prefix" style="color: white; margin-left: 20px; display: inline-block">person</i>    

                            <p:outputLabel value="#{loginBean.nombre}" style="color: white; font-size: 18px" />

                            <div style="float: right; display: inline-block; margin-top: 5px">
                                <p:commandLink styleClass="btn_logout" actionListener="#{loginBean.logout}"
                                               oncomplete="logout(xhr, status, args)"
                                               title="CERRAR SESIÓN" immediate="true">
                                    <i class="material-icons" style="font-size: 30px; ">exit_to_app</i>
                                </p:commandLink>
                            </div>
                            <a class="itemm" href="settings.xhtml" title="Configuración" style="display:  #{loginBean.lectura eq true?'none':'inline-block'}"><i class="material-icons" >settings</i></a>
                            <a class="itemm" href="caducadas.xhtml" title="Caducadas" >CADUCADAS - NEGADAS</a>
                            <a class="itemm" href="desistimientos.xhtml" title="Desistimientos" >DESISTIMIENTOS</a> 
                            <a class="itemm" href="prorrogatransf.xhtml" title="Prórrogas" >PRÓRROGAS</a>
                            <a class="itemm" href="notificaciones.xhtml" title="Notificaciones" >NOTIFICACIONES</a> 
                            <a class="activo" href="#" title="Transferencias" >TRANSFERENCIAS</a>
                        </div>
                        <br/>
                        <h:panelGrid columns="1"  style="text-align: center; font-size: 16px; font-weight: bold; margin: 0 auto; width: 97%;">
                            <p:panel class="panelContent" >
                                <p:commandButton id="nuevo_registro" value="NUEVA TRANSFERENCIA" 
                                                 style="font-size: 12px; float: left"
                                                 class="btn_peque"
                                                 actionListener="#{transferenciaBean.prepararNuevo}"
                                                 update="allform:dlgNuevaT allform:frmNuevaT:datosNuevaT allform:frmNuevaT:guardarBtn"
                                                 oncomplete="if(args.doit){PF('dlgNuevaT').show()};" process="@this" rendered="#{!loginBean.lectura}"/>
                                <p:tabView style="font-size: 12px; margin: 0 auto; width: 50%; color: black !important">
                                    <p:tab title="Búsqueda por Criterio" >
                                        <p:outputLabel value="BUSCAR: " style="font-size: 13px; font-weight: bold; margin-right: 5px;"/>
                                        <p:inputText id="buscarText" value="#{transferenciaBean.criterio}" 
                                                     style="font-size: 14px; margin-right: 5px; width: 40%" placeholder="Ingrese un criterio de búsqueda"
                                                     title="Puede buscar por No. Solicitud, Denominación o Titular Actual"/>
                                        <p:commandButton value="BUSCAR" actionListener="#{transferenciaBean.buscarTransferencias}"
                                                         update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                                         style="font-size: 13px"
                                                         process="@parent" class="btn_peque"/>
                                    </p:tab>
                                    <p:tab title="Búsqueda por Fecha" >                            
                                        <p:outputLabel value="DESDE:" style="font-size: 13px; margin-right: 5px;"/>
                                        <p:calendar pattern="yyyy-MM-dd" value="#{transferenciaBean.fechaInicio}" label="Fecha Desde" style="font-size: 20px !important; margin-right: 5px;" 
                                                    placeholder="Fecha Inicio de Búsqueda"/>
                                        <p:outputLabel value="HASTA:" style="font-size: 13px; margin-right: 5px;"/>
                                        <p:calendar pattern="yyyy-MM-dd" value="#{transferenciaBean.fechaFin}" label="Fecha Hasta" style="font-size: 13px; margin-right: 5px;"
                                                    placeholder="Fecha Fin de Búsqueda"/>

                                        <p:commandButton value="BUSCAR"  
                                                         actionListener="#{transferenciaBean.buscarTransferenciasPorFecha}" 
                                                         update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                                         style="font-size: 13px"
                                                         process="@parent" title="Se busca por fecha de Presentación" class="btn_peque"/>                            
                                    </p:tab>
                                    <p:tab title="Búsqueda por Fecha Certificado" >                            
                                        <p:outputLabel value="DESDE:" style="font-size: 13px; margin-right: 5px;"/>
                                        <p:calendar pattern="yyyy-MM-dd" value="#{transferenciaBean.fechaInicioCertificado}" label="Fecha Desde" style="font-size: 13px; margin-right: 5px;" 
                                                    placeholder="Fecha Inicio de Búsqueda"/>
                                        <p:outputLabel value="HASTA:" style="font-size: 13px; margin-right: 5px;"/>
                                        <p:calendar pattern="yyyy-MM-dd" value="#{transferenciaBean.fechaFinCertificado}" label="Fecha Hasta" style="font-size: 13px; margin-right: 5px;"
                                                    placeholder="Fecha Fin de Búsqueda"/>

                                        <p:commandButton value="BUSCAR"  
                                                         actionListener="#{transferenciaBean.buscarTransferenciasPorFechaCertificado}" 
                                                         update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                                         style="font-size: 13px" class="btn_peque"
                                                         process="@parent" title="Se busca por fecha de Presentación"/>                            
                                    </p:tab>
                                </p:tabView>
                                <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()" />

                                <p:dialog widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                                    <p:graphicImage name="/images/ajax-loader.gif" />
                                </p:dialog>
                                <p:outputLabel id="num_reg" value="#{transferenciaBean.numRegistros}" style="float: left; font-size: 12px"/>
                                <br/>
                                <p:dataTable id="tablaDeDatos" var="transferencia"
                                             value="#{transferenciaBean.transferencias}" widgetVar="tablaDeDatos"
                                             emptyMessage="No hay Datos para mostrar"                                              
                                             filteredValue="#{transferenciaBean.transferenciasFiltradas}"
                                             binding="#{transferenciaBean.transferenciasDataTable}"
                                             paginator="true"
                                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                             rows="20"
                                             rowsPerPageTemplate="20,50,100,150,200,250,300"
                                             selection="#{transferenciaBean.selectedTransferencias}"
                                             style="border: black !important" 
                                             rowKey="#{transferencia.id}">

                                    <f:facet name="header">
                                        <p:outputPanel>
                                            <h:outputText value="BUSCAR EN RESULTADO: " />
                                            <p:inputText id="globalFilter" onkeyup="PF('tablaDeDatos').filter()"
                                                         style="width:300px" placeholder="Escriba aquí"/>
                                        </p:outputPanel>
                                    </f:facet>

                                    <p:column selectionMode="multiple" style="width:16px;text-align:center" rendered="#{!loginBean.lectura}" exportable="false"/>

                                    <p:column headerText="Solicitud" style="text-align: center;" filterBy="#{transferencia.solicitud}" >
                                        <h:outputText value="#{transferencia.solicitud}" />
                                    </p:column>

                                    <p:column headerText="F. Presentación" style="text-align: center;" filterBy="#{transferencia.fechaPresentacion}" >
                                        <h:outputText value="#{transferencia.fechaPresentacion}" >
                                            <f:convertDateTime pattern="yyyy-MM-dd"/>
                                        </h:outputText>
                                    </p:column>                        

                                    <p:column headerText="Certificado" style="text-align: center;" filterBy="#{transferencia.certificado}" >
                                        <h:outputText value="#{transferencia.certificado}" />
                                    </p:column>

                                    <p:column headerText="F. Certificado" style="text-align: center;" filterBy="#{transferencia.fechaCertificado}" >
                                        <h:outputText value="#{transferencia.fechaCertificado}" >
                                            <f:convertDateTime pattern="yyyy-MM-dd"/>
                                        </h:outputText>
                                    </p:column>

                                    <p:column headerText="Registro" style="text-align: center; width: 13rem" filterBy="#{transferencia.registro}" >
                                        <h:outputText value="#{transferencia.registro}" />
                                    </p:column>
                                    <p:column headerText="F. Registro" style="text-align: center;" filterBy="#{transferencia.fechaRegistro}" >
                                        <h:outputText value="#{transferencia.fechaRegistro}" >
                                            <f:convertDateTime pattern="yyyy-MM-dd"/>
                                        </h:outputText>                                
                                    </p:column>

                                    <p:column headerText="Denominación" style="text-align: center;" filterBy="#{transferencia.denominacion}" >
                                        <h:outputText value="#{transferencia.denominacion}" />
                                    </p:column>
                                    <p:column headerText="signo" style="text-align: center;" filterBy="#{transferencia.signo}" >
                                        <h:outputText value="#{transferencia.signo}" />
                                    </p:column>                       
                                    <p:column headerText="T. Anterior" style="text-align: center;" filterBy="#{transferencia.titularAnterior}" >
                                        <h:outputText value="#{transferencia.titularAnterior}" />
                                    </p:column>
                                    <p:column headerText="T. Actual" style="text-align: center;" filterBy="#{transferencia.titularActual}" >
                                        <h:outputText value="#{transferencia.titularActual}" />
                                    </p:column>
                                    <p:column headerText="Dom. T. Actual" style="text-align: center;" filterBy="#{transferencia.domicilioTitularActual}" rendered="false" >
                                        <h:outputText value="#{transferencia.domicilioTitularActual}" />
                                    </p:column>
                                    <p:column headerText="Apoderado Representante" style="text-align: center;" filterBy="#{transferencia.apoderadoRepresentanteLegal}" visible="false" >
                                        <h:outputText value="#{transferencia.apoderadoRepresentanteLegal}" />
                                    </p:column>
                                    <p:column headerText="Casillero Senadi" style="text-align: center;" filterBy="#{transferencia.casilleroSenadi}" visible="false" >
                                        <h:outputText value="#{transferencia.casilleroSenadi}" />
                                    </p:column>

                                    <p:column headerText="Casillero Judicial" style="text-align: center;" filterBy="#{transferencia.casilleroJudicial}" visible="false" >
                                        <h:outputText value="#{transferencia.casilleroJudicial}" />
                                    </p:column>

                                    <p:column headerText="Responsable" style="text-align: center;" filterBy="#{transferencia.responsable}" >
                                        <h:outputText value="#{transferencia.responsable}" />
                                    </p:column>

                                    <p:column id="editar" headerText="Acción"  exportable="false" style="margin: 0 auto; width: 107px;" rendered="#{!loginBean.lectura}">                            
                                        <p:commandLink class="link"
                                                       actionListener="#{transferenciaBean.prepararEditar}"
                                                       update="allform:dlgNuevaT allform:frmNuevaT:datosNuevaT allform:frmNuevaT:guardarBtn "
                                                       oncomplete="if(args.peditar){PF('dlgNuevaT').show()};"
                                                       process="@this"
                                                       title="Editar" >
                                            <i id="edit_action" class="material-icons md-18">edit</i>
                                        </p:commandLink>
                                        <p:commandLink class="link" title="Descargar"
                                                       actionListener="#{transferenciaBean.viewTransferencia}"
                                                       process="@this"
                                                       update="mensajes"
                                                       oncomplete="popupwindow('reportes', '_blank', args);">
                                            <i id="download_action" class="material-icons md-18">cloud_download</i>                            
                                        </p:commandLink>
                                        <p:commandLink class="link"
                                                       actionListener="#{transferenciaBean.prepararHistorial}"
                                                       title="Seguimiento" process="@this"
                                                       update="allform:dlgHistorial"
                                                       oncomplete="PF('dlgHistorial').show();">
                                            <i id="history_action" class="material-icons md-18">history</i>                            
                                        </p:commandLink>

                                        <p:commandLink class="link_remove" 
                                                       actionListener="#{transferenciaBean.eliminarTransferencia}"
                                                       update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                                       title="Eliminar" process="@this" >
                                            <i id="delete_action" class="material-icons md-18">delete</i>
                                            <p:confirm header="CONFIRMAR" message="SEGURO DE ELIMINAR LA TRANSFERENCIA CON SOLICITUD: #{transferencia.solicitud} ?"/> 
                                        </p:commandLink>
                                    </p:column>
                                    <f:facet name="footer">
                                        <p:selectBooleanCheckbox value="#{transferenciaBean.separado}" itemLabel="Separados" rendered="#{!loginBean.lectura}" />
                                        <p:commandButton process="tablaDeDatos" value="Descargar Seleccionados" 
                                                         actionListener="#{transferenciaBean.downloadSelected}" 
                                                         update="mensajes" oncomplete="popupwindow('reportes', '_self', args);" 
                                                         rendered="#{!loginBean.lectura}" class="btn_peque" />

                                    </f:facet>
                                </p:dataTable>
                                <p:outputLabel id="num_registros" value="#{transferenciaBean.numRegistros}" style="float: left; font-size: 12px"/>

                                <h:panelGrid columns="2" style="float: right;">
                                    <h:commandLink title="Exportar a excel..." rendered="#{!loginBean.lectura}" immediate="true">
                                        <p:graphicImage class="excel" width="20px" height="20px" library="images" name="excel.png"/>
                                        <p:dataExporter type="xls" target="tablaDeDatos" fileName="#{transferenciaBean.exportName}" />
                                    </h:commandLink>                        
                                </h:panelGrid>
                                <br/>
                            </p:panel>              

                        </h:panelGrid>
                        <p:dialog id="dlgNuevaT" modal="true" resizable="true" styleClass="dlgFormNice" 
                                  header="#{transferenciaBean.dialogTitle}" fitViewport="true"
                                  widgetVar="dlgNuevaT" style="font-size: 11px; margin-bottom: 10px" showEffect="explode" 
                                  hideEffect="explode" closeOnEscape="true" width="80%">
                            <p:ajax event="close" update="dlgNuevaT" resetValues="true" />
                            <p:growl id="nuevoreg" life="1000"/>
                            <h:form id="frmNuevaT" >
                                <p:panelGrid columns="6" id="datosNuevaT" styleClass="showcase-text-align-center" style="width: 100%">

                                    <p:outputLabel value="Solicitud:" for="solicitudForm"/>
                                    <h:panelGroup>

                                        <p:inputText id="solicitudForm" value="#{transferenciaBean.transferencia.solicitud}" title="Solicitud" required="true" 
                                                     style="background: #aed581 !important; width: 85%; text-transform: uppercase" />
                                        <p:commandButton icon="pi pi-search" class="btn_peque"  style="position: absolute;" actionListener="#{transferenciaBean.buscarTramite}" 
                                                         rendered="#{transferenciaBean.dialogTitle eq 'NUEVA TRANSFERENCIA'?true:false}" process="@parent" 
                                                         update="mensajes frmNuevaT:datosNuevaT"/>
                                    </h:panelGroup>

                                    <p:outputLabel value="F. Presentación:" for="fpresentacionForm"/>                            
                                    <p:calendar id="fpresentacionForm"  value="#{transferenciaBean.transferencia.fechaPresentacion}" timeZone="GMT-5"
                                                mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha de Presentación" inputStyleClass="maxsize"/>

                                    <p:outputLabel value="Certificado:" for="certificadoForm"/>                            
                                    <p:inputText id="certificadoForm" value="#{transferenciaBean.transferencia.certificado}"  title="Certificado" label="Se genera automáticamente"
                                                 style="background: #FFCDD2 !important;" required="true" class="maxsize">
                                        <p:tooltip for="certificadoForm" value="Número que se crea automáticamente" position="right"/>
                                        <p:keyFilter mask="num" />
                                    </p:inputText>

                                    <p:outputLabel value="F. Certificado:" for="fcertificadoForm"/>                            
                                    <p:calendar id="fcertificadoForm"  value="#{transferenciaBean.transferencia.fechaCertificado}" timeZone="GMT-5"
                                                mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha de Certificado" inputStyleClass="maxsize"/>

                                    <p:outputLabel value="Registro:" for="registroForm"/>                            
                                    <p:inputText id="registroForm" value="#{transferenciaBean.transferencia.registro}" title="Registro" required="true" class="maxsize"/>

                                    <p:outputLabel value="F. Registro:" for="fregistroForm"/>                            
                                    <p:calendar id="fregistroForm"  value="#{transferenciaBean.transferencia.fechaRegistro}" timeZone="GMT-5"
                                                mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha de Registro" inputStyleClass="maxsize"/>

                                    <p:outputLabel value="Denominación:" for="denominacionForm"/>                            
                                    <p:inputTextarea id="denominacionForm" value="#{transferenciaBean.transferencia.denominacion}" title="Denominación" 
                                                     required="true" style="width: 100% !important" class="maxsize"/>

                                    <p:outputLabel value="Signo:" for="signoForm"/>                            
                                    <p:inputText id="signoForm" value="#{transferenciaBean.transferencia.signo}" title="Signo" required="true" class="maxsize"/>

                                    <p:outputLabel value="Titular Anterior:" for="tanteriorForm"/>                            
                                    <p:inputTextarea id="tanteriorForm" value="#{transferenciaBean.transferencia.titularAnterior}" title="Titular Anterior" required="true" class="maxsize"/>

                                    <p:outputLabel value="Titular Actual:" for="tactualForm"/>                            
                                    <p:inputTextarea id="tactualForm" value="#{transferenciaBean.transferencia.titularActual}" title="Titular Actual" required="true" class="maxsize"/>

                                    <p:outputLabel value="Domicilio T. Actual:" for="dtactualForm" rendered="false"/>                            
                                    <p:inputTextarea id="dtactualForm" value="#{transferenciaBean.transferencia.domicilioTitularActual}" title="Domicilio Titular Actual" 
                                                     class="maxsize" rendered="false"/>

                                    <p:outputLabel value="Apoderado Representante:" for="aporeplegalForm"/>                            
                                    <p:inputTextarea id="aporeplegalForm" value="#{transferenciaBean.transferencia.apoderadoRepresentanteLegal}" title="Apoderado Representante Legal" 
                                                     required="true" class="maxsize"/>

                                    <p:outputLabel value="F. Notificación:" for="fechaNotificacionForm"/>                            
                                    <p:calendar id="fechaNotificacionForm"  value="#{transferenciaBean.transferencia.fechaNotificacion}" timeZone="GMT-5"
                                                mask="true" pattern="yyyy-MM-dd" title="Fecha Notifición" inputStyleClass="maxsize"/>

                                    <p:outputLabel value="Casillero SENADI:" for="casSenadiForm"/>                            
                                    <p:inputText id="casSenadiForm" value="#{transferenciaBean.transferencia.casilleroSenadi}" title="Casillero SENADI" class="maxsize"/>

                                    <p:outputLabel value="Casillero JUDICIAL:" for="casJudicialForm"/>                            
                                    <p:inputText id="casJudicialForm" value="#{transferenciaBean.transferencia.casilleroJudicial}" title="Casillero Judicial" class="maxsize"/>

                                    <p:outputLabel value="RO:" for="roForm"/>                            
                                    <p:inputTextarea id="roForm" value="#{transferenciaBean.transferencia.ro}" title="RO" class="maxsize"/>

                                    <p:outputLabel value="Identificación:" for="identificacionForm"/>                            
                                    <p:inputText id="identificacionForm" value="#{transferenciaBean.transferencia.identificacion}" title="Identificación" class="maxsize"/>

                                    <p:outputLabel value="Comprobante" for="comproForm"/>
                                    <p:inputText id="comproForm" value="#{transferenciaBean.transferencia.comprobante}" title="comprobante" class="maxsize"/>

                                    <p:outputLabel value="Responsable:" for="responsableForm"/>                            
                                    <p:inputText id="responsableForm" value="#{transferenciaBean.transferencia.responsable}" title="Responsable" 
                                                 rendered="true" required="true" style="background: #E8F5E9 !important;" class="maxsize"/>                       

                                    <p:outputLabel value="Url: " style="float: right !important"/>
                                    <p:commandLink value="Ruta Expediente" onclick="otherpage('#{transferenciaBean.transferencia.rutaExpediente}')" 
                                                   disabled="#{transferenciaBean.transferencia.solicitud eq null? true:false}" style="color: blue"/>

                                    <p:commandLink value="Ruta Casillero" onclick="otherpage('https://registro.propiedadintelectual.gob.ec/casilleros/media/files/#{transferenciaBean.transferencia.casilleroSenadi}/')" 
                                                   disabled="#{transferenciaBean.transferencia.solicitud eq null? true:false}" style="color: blue"/>                                                

                                </p:panelGrid>
                                <p:panelGrid id="guardarBtn" columns="4" styleClass="ui-noborder" style="float: right">                            

                                    <p:outputLabel value="PASAR A: " rendered="#{transferenciaBean.dialogTitle eq 'NUEVA TRANSFERENCIA'?false:true}"/>
                                    <p:selectOneMenu id="estadoRegistro" style="margin-right: 100px" 
                                                     value="#{transferenciaBean.estadoTemp}" rendered="#{transferenciaBean.dialogTitle eq 'NUEVA TRANSFERENCIA'?false:true}">
                                        <f:selectItem itemLabel="Seleccionar..." itemValue="" noSelectionOption="true"/>
                                        <f:selectItem itemLabel="NOTIFICADAS" itemValue="NOTIFICADAS"/>
                                        <f:selectItem itemLabel="DESISTIDAS" itemValue="DESISTIDAS"/>
                                        <f:selectItem itemLabel="CADUCADAS-NEGADAS" itemValue="CADUCADAS-NEGADAS"/>
                                    </p:selectOneMenu>
                                    <p:commandButton value="#{transferenciaBean.saveEdit}" actionListener="#{transferenciaBean.guardarTransferencia}"
                                                     update="mensajes allform:tablaDeDatos datosNuevaT"
                                                     oncomplete="if(args.saved){PF('dlgNuevaT').hide();}"
                                                     process="@form" class="btn_buscar">
                                        <p:confirm header="Seguridad" message="#{transferenciaBean.mensajeConfirmacion}" />
                                    </p:commandButton>
                                    <p:commandButton value="CERRAR" oncomplete="PF('dlgNuevaT').hide();" process="@form" class="btn_buscar"/>                            
                                </p:panelGrid>
                            </h:form>
                        </p:dialog>
                        <p:dialog id="dlgHistorial" modal="true" resizable="true"
                                  header="#{transferenciaBean.dialogTitle}" fitViewport="true"
                                  widgetVar="dlgHistorial" style="font-size: 11px;" showEffect="explode" 
                                  hideEffect="explode" closeOnEscape="true">
                            <p:ajax event="close" update="dlgHistorial" resetValues="true" />                
                            <h:form id="frmHistory" >

                                <p:inputTextarea id='historialText' value="#{transferenciaBean.historial}" rows="10" cols="115" readonly="true"/>

                            </h:form>

                        </p:dialog>

                        <p:confirmDialog global="true" showEffect="explode" hideEffect="explode">
                            <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes btn_peque" update="allform:tablaDeDatos"/>
                            <p:commandButton value="No" type="button"  styleClass="ui-confirmdialog-no btn_peque" />
                        </p:confirmDialog>
                        <br/>
                    </h:form>
                    <footer class="footer">
                        <small style="margin-bottom: 20px; display: inline-block">
                            © 2022 SERVICIO NACIONAL DE DERECHOS INTELECTUALES
                        </small>
                        <br />
                    </footer>
                </main>
                <div class="overlay"></div>
            </div>
        </div>

        <p:idleMonitor timeout="#{1000*60*60}" id="idleSesion">
            <p:ajax event="idle" listener="#{idleMonitorCtrl.idleListener}"
                    oncomplete="PF('idleDialog').show()" />
        </p:idleMonitor>
        <p:dialog header="Sesión Caducada" resizable="false"
                  widgetVar="idleDialog" modal="true" closable="false" style="font-size: 12px">
            <h:form id="sesionCaducaForm">
                <div class="titlePage">
                    <h:outputText value="Sesión Caducada " />
                    <p:commandButton styleClass="nav-link js-scroll-trigger"
                                     actionListener="#{loginBean.logout}"
                                     oncomplete="logout(xhr, status, args)"
                                     value="ACEPTAR" immediate="true" style="font-size: 12px"/>
                </div>
            </h:form>
        </p:dialog>

        <!-- partial -->
        <script src='https://unpkg.com/@popperjs/core@2'></script>
        <script src="./script.js"></script>

    </h:body>
