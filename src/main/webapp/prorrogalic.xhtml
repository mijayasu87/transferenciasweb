<!DOCTYPE html>
<html xmlns="http://www.w3c.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:x="http://xpert.com/faces">
    <h:head>
        <meta charset="utf-8" />
        <meta name="viewport"    content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="" />

        <title>PRORROGA-LICENCIA</title>

        <link rel="shortcut icon" type="image/png" href="#{resource['images/favicon.png']}" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>

        <link rel="stylesheet" media="screen" href="http://fonts.googleapis.com/css?family=Open+Sans:300,400,700" />
        <link href="resources/assets/css/bootstrap.min.css" rel="stylesheet" />
        <link href="resources/assets/css/font-awesome.min.css" rel="stylesheet" />

        <!-- Custom styles for our template -->
        <link href="resources/assets/css/bootstrap-theme.css" rel="stylesheet" />
        <link href="resources/assets/css/main.css" rel="stylesheet" />
        <!-- My own style css -->
        <link href="resources/assets/css/style.css" rel="stylesheet" />
    </h:head>
    <h:body>
        <!-- Start Page Loading -->
        <div id="loader-wrapper">
            <div id="loader"></div>
            <div class="loader-section section-left"></div>
            <div class="loader-section section-right"></div>
        </div>
        <p:growl id="mensajes" showDetail="true" life="3000"/>
        <h:form id="allform" enctype="multipart/form-data" style=" background: #e3e3e3; min-height: calc(100vh - 424px);">
            <div class="menu">
                <a href="#" class="logo"  title="Logo Senadi" ><img src="resources/images/sena_2.png" width="161px"/></a>

                <i id="edit_action" class="material-icons prefix" style="color: white; margin-left: 20px; display: inline-block">person</i>

                <p:outputLabel value="#{loginBean.nombre}" style="color: white; font-size: 18px" />


                <div style="float: right; display: inline-block; margin-top: 5px">
                    <p:commandLink styleClass="btn_logout" actionListener="#{loginBean.logout}"
                                   oncomplete="logout(xhr, status, args)"
                                   title="CERRAR SESIÓN" immediate="true">
                        <i class="material-icons" style="font-size: 30px; ">exit_to_app</i>
                    </p:commandLink>
                </div>
                <a class="itemm" href="settings.xhtml" title="Configuración" style="display:  #{loginBean.lectura eq true?'none':'inline-block'}"><i class="material-icons" >settings</i></a>
                <a class="itemm" href="abandonolic.xhtml" title="Abandonos" >ABANDONOS</a>
                <a class="itemm" href="caducadalic.xhtml" title="Caducadas" >CADUCADAS - NEGADAS</a>
                <a class="itemm" href="desistidalic.xhtml" title="Desistidas" >DESISTIDAS</a>
                <a class="itemm" href="terminacionlic.xhtml" title="Terminación Licencia" >TERMINACIÓN LICENCIA</a>
                <a class="activo" href="#" title="Prórrogas" >PRÓRROGAS</a>
                <a class="itemm" href="notificadalic.xhtml" title="Notificadas" >NOTIFICADAS</a>
                <a class="itemm" href="certificadolic.xhtml" title="Certificado Licencia" >CERTIFICADO LICENCIA</a>
            </div>
            <div class="card" style="margin-top: 20%; position: absolute;">
                <br/>
                <p:sidebar widgetVar="sidebar1" style="z-index: 999 !important; width: 22%; background: #E8F5E9; overflow: scroll">
                    <div id="menuside"></div>
                </p:sidebar>
                <p:commandButton icon="pi pi-arrow-right" type="button" onclick="PF('sidebar1').show()" styleClass="mr-2 " class="btn_sidebar"
                                 style="position: fixed; z-index: 999; background-color: #d30039 !important;"/>
            </div>
            <br/>
            <h:panelGrid columns="1"  style="text-align: center; font-size: 16px; font-weight: bold; margin: 0 auto; width: 97%;">
                <p:panel class="panelContent" >
                    <p:tabView style="font-size: 12px; margin: 0 auto; width: 50%">
                        <p:tab title="Búsqueda por Criterio" >
                            <p:outputLabel value="BUSCAR: " style="font-size: 13px; font-weight: bold; margin-right: 5px;"/>
                            <p:inputText id="buscarText" value="#{prorrogalicenciaBean.criterio}"
                                         style="font-size: 14px; margin-right: 5px; width: 40%" placeholder="Ingrese un criterio de búsqueda"
                                         title="Puede buscar por No. Solicitud, Denominación o Titular"/>
                            <p:commandButton value="BUSCAR" actionListener="#{prorrogalicenciaBean.buscarProrroga}"
                                             update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px"
                                             process="@parent" class="btn_peque"/>
                        </p:tab>
                        <p:tab title="Búsqueda por Fecha" >
                            <p:outputLabel value="DESDE:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{prorrogalicenciaBean.fechaInicio}" label="Fecha Desde" style="font-size: 13px; margin-right: 5px;"
                                        placeholder="Fecha Inicio de Búsqueda" navigator="true"/>
                            <p:outputLabel value="HASTA:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{prorrogalicenciaBean.fechaFin}" label="Fecha Hasta" style="font-size: 13px; margin-right: 5px;"
                                        placeholder="Fecha Fin de Búsqueda" navigator="true"/>

                            <p:commandButton value="BUSCAR"
                                             actionListener="#{prorrogalicenciaBean.buscarProrrogasPorFecha}"
                                             update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px" class="btn_peque"
                                             process="@parent" title="Se busca por fecha de Presentación"/>
                        </p:tab>
                    </p:tabView>
                    <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()" />

                    <p:dialog widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                        <p:graphicImage name="/images/ajax-loader.gif" />
                    </p:dialog>
                    <p:outputLabel id="num_reg" value="#{prorrogalicenciaBean.numRegistros}" style="float: left; font-size: 12px"/>
                    <br/>
                    <p:dataTable id="tablaDeDatos" var="prorroga"
                                 value="#{prorrogalicenciaBean.prorrogas}" widgetVar="tablaDeNotificaciones"
                                 emptyMessage="No hay Datos para mostrar"
                                 filteredValue="#{prorrogalicenciaBean.prorrogasFiltradas}"
                                 binding="#{prorrogalicenciaBean.prorrogaDataTable}"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="20"
                                 selection="#{prorrogalicenciaBean.selectedProrrogas}"
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 style="margin:3px auto; font-size: 9px !important;"
                                 rowKey="#{prorroga.id}">

                        <f:facet name="header">
                            <p:outputPanel>
                                <h:outputText value="BUSCAR EN RESULTADO: " />
                                <p:inputText id="globalFilter" onkeyup="PF('tablaDeNotificaciones').filter()"
                                             style="width:300px" placeholder="Escriba aquí"/>
                            </p:outputPanel>
                        </f:facet>

                        <p:column selectionMode="multiple" style="width:16px;text-align:center" rendered="#{!loginBean.lectura}" exportable="false"/>

                        <p:column headerText="Solicitud" style="text-align: center;" filterBy="#{prorroga.solicitud}" >
                            <h:outputText value="#{prorroga.solicitud}" />
                        </p:column>
                        <p:column headerText="F. Presentación" style="text-align: center;" filterBy="#{prorroga.fechaPresentacion}" >
                            <h:outputText value="#{prorroga.fechaPresentacion}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Notificación" style="text-align: center;" filterBy="#{prorroga.notificacion}" >
                            <h:outputText value="#{prorroga.notificacion}" />
                        </p:column>
                        <p:column headerText="F. Notificacion" style="text-align: center;" filterBy="#{prorroga.fechaNotificacion}" >
                            <h:outputText value="#{prorroga.fechaNotificacion}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="N. Prórroga" style="text-align: center;" filterBy="#{prorroga.numeroProrroga}" >
                            <p:commandLink id="prolink" value="#{prorroga.numeroProrroga}" style="color: #0089ec; font-size: 14px;" process="@this"
                                           title="Visualizar Prórroga #{prorroga.numeroProrroga}" actionListener="#{prorrogalicenciaBean.validarProrroga(prorroga)}"
                                           oncomplete="if(args.viewnotificacion){otherpage(args.view)};" update="mensajes prolink" rendered="#{prorroga.prorrogaNotificada}"/>
                            <h:outputText value="#{prorroga.numeroProrroga}" rendered="#{!prorroga.prorrogaNotificada}"/>
                        </p:column>
                        <p:column headerText="Días" style="text-align: center;" filterBy="#{prorroga.diasProrroga}" >
                            <h:outputText value="#{prorroga.diasProrroga}" />
                        </p:column>
                        <p:column headerText="F. Puesta Prórroga" style="text-align: center;" filterBy="#{prorroga.fechaPuestaProrroga}" >
                            <h:outputText value="#{prorroga.fechaPuestaProrroga}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="F. Prórroga" style="text-align: center;" filterBy="#{prorroga.fechaProrroga}" >
                            <h:outputText value="#{prorroga.fechaProrroga}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Registro" style="text-align: center; width: 13rem" filterBy="#{prorroga.registro}" >
                            <h:outputText value="#{prorroga.registro}" />
                        </p:column>
                        <p:column headerText="Denominación" style="text-align: center;" filterBy="#{prorroga.denominacion}" >
                            <h:outputText value="#{prorroga.denominacion}" />
                        </p:column>
                        <p:column headerText="signo" style="text-align: center;" filterBy="#{prorroga.signo}" >
                            <h:outputText value="#{prorroga.signo}" />
                        </p:column>
                        <p:column headerText="Licenciante" style="text-align: center;" filterBy="#{prorroga.licenciante}" >
                            <h:outputText value="#{prorroga.licenciante}" />
                        </p:column>
                        <p:column headerText="Licenciatario" style="text-align: center;" filterBy="#{prorroga.licenciatario}" >
                            <h:outputText value="#{prorroga.licenciatario}" />
                        </p:column>
                        <p:column headerText="Responsable" style="text-align: center;">
                            <h:outputText value="#{prorroga.responsable}" />
                        </p:column>
                        <p:column id="editar" headerText="Acción"  exportable="false" style="margin: 0 auto; width: 140px;" >
                            <p:commandLink class="link" title="Descargar"
                                           actionListener="#{prorrogalicenciaBean.viewProrroga}"
                                           process="@this" update="mensajes"
                                           oncomplete="if(args.doit){popupwindow('prorrogalicreport', '_blank', args);}">
                                <i class="material-icons md-18">picture_as_pdf</i>
                            </p:commandLink>
                            <p:commandLink class="link"
                                           actionListener="#{prorrogalicenciaBean.prepararEditar}"
                                           update="allform:dlgNuevaT allform:frmNuevaT:datosNuevaT allform:frmNuevaT:guardarBtn "
                                           oncomplete="if(args.peditar){PF('dlgNuevaT').show()};"
                                           process="@this"
                                           title="Editar" rendered="#{!loginBean.lectura}">
                                <i id="edit_action" class="material-icons md-18">edit</i>
                            </p:commandLink>
                            <p:commandLink class="link"
                                           actionListener="#{prorrogalicenciaBean.prepararHistorial}"
                                           title="Seguimiento" process="@this"
                                           update="allform:dlgHistorial"
                                           oncomplete="PF('dlgHistorial').show();" rendered="#{!loginBean.lectura}">
                                <i id="history_action" class="material-icons md-18">history</i>
                            </p:commandLink>

                            <p:commandLink class="link_remove"
                                           actionListener="#{prorrogalicenciaBean.eliminarProrroga}"
                                           update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                           title="Eliminar" process="@this" rendered="#{!loginBean.lectura}">
                                <i id="delete_action" class="material-icons md-18">delete</i>
                                <p:confirm header="CONFIRMAR" message="SEGURO DE ELIMINAR LA PRÓRROGA CON SOLICITUD: #{prorroga.solicitud} ?"/>
                            </p:commandLink>
                        </p:column>
                        <f:facet name="footer">
                            <p:commandButton process="tablaDeDatos" value="Descargar Seleccionados"
                                             actionListener="#{prorrogalicenciaBean.downloadSelected}"
                                             update="mensajes" oncomplete="popupwindow('prorrogalicreport', '_self', args);"
                                             class="btn_peque" rendered="#{!loginBean.lectura}"/>
                        </f:facet>
                    </p:dataTable>
                    <p:outputLabel id="num_registros" value="#{prorrogalicenciaBean.numRegistros}" style="float: left; font-size: 12px"/>
                    <h:panelGrid columns="2" style="float: right;">
                        <h:commandLink title="Exportar a excel..." rendered="#{!loginBean.lectura}" immediate="true">
                            <p:graphicImage class="excel" width="20px" height="20px" library="images" name="excel.png"/>
                            <p:dataExporter type="xlsx" target="tablaDeDatos" fileName="#{prorrogalicenciaBean.exportName}"/>
                        </h:commandLink>
                        <br/>
                    </h:panelGrid>
                    <br/>
                </p:panel>
            </h:panelGrid>

            <p:dialog id="dlgNuevaT" modal="true" resizable="true" styleClass="dlgFormNice dlg-lic"
                      header="#{prorrogalicenciaBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgNuevaT" style="font-size: 11px; margin-bottom: 10px" showEffect="clip"
                      hideEffect="explode" closeOnEscape="true" width="80%">
                <p:ajax event="close" update="dlgNuevaT" resetValues="true" />
                <p:growl id="nuevoreg" life="1000"/>
                <h:form id="frmNuevaT" >
                    <p:panelGrid columns="6" id="datosNuevaT" styleClass="showcase-text-align-center" style="width: 100%"
                                 columnClasses="ten-percent,twenty-percent,ten-percent,twenty-percent,ten-percent,twenty-percent">

                        <p:outputLabel value="Solicitud:" for="solicitudForm"/>
                        <h:panelGroup>
                            <p:inputText id="solicitudForm" value="#{prorrogalicenciaBean.prorroga.solicitud}" title="Solicitud" required="true"
                                         style="background: #aed581 !important; width: 85%; text-transform: uppercase"/>
                        </h:panelGroup>

                        <p:outputLabel value="F. Presentación:" for="fpresentacionForm"/>
                        <p:calendar id="fpresentacionForm"  value="#{prorrogalicenciaBean.prorroga.fechaPresentacion}" timeZone="GMT-5" navigator="true"
                                    mask="true" pattern="yyyy-MM-dd"  required="true" title="Fecha de Presentación" inputStyleClass="maxsize"/>

                        <p:outputLabel value="Notificación:" for="notificacionForm"/>
                        <p:inputText id="notificacionForm" value="#{prorrogalicenciaBean.prorroga.notificacion}" title="Notificación"
                                     style="background: #FFCDD2 !important;" class="maxsize"/>

                        <p:outputLabel value="N. Prórroga:" for="numProrrogaForm"/>
                        <p:inputText id="numProrrogaForm" value="#{prorrogalicenciaBean.prorroga.numeroProrroga}" title="Número de Prórroga (automático incremental)"
                                     class="maxsize" readonly="true" style="background: #e0e0e0 !important;"/>

                        <p:outputLabel value="Días Prórroga:" for="diasProrrogaForm"/>
                        <p:inputText id="diasProrrogaForm" value="#{prorrogalicenciaBean.prorroga.diasProrroga}" title="Días de Prórroga"
                                     class="maxsize">
                            <p:keyFilter mask="num" />
                        </p:inputText>

                        <p:outputLabel value="F. Prórroga:" for="fprorrogaForm"/>
                        <p:calendar id="fprorrogaForm"  value="#{prorrogalicenciaBean.prorroga.fechaProrroga}" timeZone="GMT-5" navigator="true"
                                    mask="true" pattern="yyyy-MM-dd" title="Fecha de Prórroga" inputStyleClass="maxsize"/>

                        <p:outputLabel value="Escrito No. (Alcance):" for="numAlcanceForm"/>
                        <p:inputText id="numAlcanceForm" value="#{prorrogalicenciaBean.prorroga.numeroAlcance}" title="Número de escrito / alcance"
                                     class="maxsize" style="text-transform: uppercase"/>

                        <p:outputLabel value="Fecha Escrito:" for="fAlcanceForm"/>
                        <p:calendar id="fAlcanceForm"  value="#{prorrogalicenciaBean.prorroga.fechaAlcance}" timeZone="GMT-5" navigator="true"
                                    mask="true" pattern="yyyy-MM-dd" title="Fecha del escrito / alcance" inputStyleClass="maxsize"/>

                        <p:outputLabel value="Registro:" for="registroForm"/>
                        <p:inputText id="registroForm" value="#{prorrogalicenciaBean.prorroga.registro}" title="Registro" class="maxsize"/>

                        <p:outputLabel value="F. Registro:" for="fregistroForm"/>
                        <p:calendar id="fregistroForm"  value="#{prorrogalicenciaBean.prorroga.fechaRegistro}" timeZone="GMT-5" navigator="true"
                                    mask="true" pattern="yyyy-MM-dd" title="Fecha de Registro" inputStyleClass="maxsize"/>

                        <p:outputLabel value="Denominación:" for="denominacionForm"/>
                        <p:inputTextarea id="denominacionForm" value="#{prorrogalicenciaBean.prorroga.denominacion}" title="Denominación"
                                         class="maxsize"/>

                        <p:outputLabel value="Signo:" for="signoForm"/>
                        <p:inputText id="signoForm" value="#{prorrogalicenciaBean.prorroga.signo}" title="Signo" class="maxsize"/>

                        <p:outputLabel value="Licenciante:" for="licencianteForm"/>
                        <p:inputTextarea id="licencianteForm" value="#{prorrogalicenciaBean.prorroga.licenciante}" title="Licenciante"
                                         class="maxsize"/>

                        <p:outputLabel value="Licenciatario:" for="licenciatarioForm"/>
                        <p:inputTextarea id="licenciatarioForm" value="#{prorrogalicenciaBean.prorroga.licenciatario}"
                                         title="Licenciatario" class="maxsize" />

                        <p:outputLabel value="Apod. Repre. Legal:" for="nomapForm"/>
                        <p:inputTextarea id="nomapForm" value="#{prorrogalicenciaBean.prorroga.apoderadoRepresentante}" title="Apoderado Representante Legal"
                                         class="maxsize"/>

                        <p:outputLabel value="F. Notificación:" for="fechaNotificacionForm"/>
                        <p:calendar id="fechaNotificacionForm"  value="#{prorrogalicenciaBean.prorroga.fechaNotificacion}" timeZone="GMT-5" navigator="true"
                                    mask="true" pattern="yyyy-MM-dd" title="Fecha Notifición" inputStyleClass="maxsize"/>

                        <p:outputLabel value="Casillero SENADI:" for="casSenadiForm"/>
                        <p:panel class="noBorders" style="padding: 0 0 !important; border: none !important">
                            <p:inputText id="casSenadiForm" value="#{prorrogalicenciaBean.prorroga.casilleroSenadi}" title="Casillero SENADI"
                                         style="width: 80%"/>
                            <p:commandButton icon="pi pi-search" class="btn_peque" actionListener="#{prorrogalicenciaBean.buscarCasillero}"
                                             process="@parent" update="casSenadiForm" style="width: 12%" title="BUSCAR CASILLERO"/>
                        </p:panel>

                        <p:outputLabel value="Casillero JUDICIAL:" for="casJudicialForm"/>
                        <p:inputText id="casJudicialForm" value="#{prorrogalicenciaBean.prorroga.casilleroJudicial}" title="Casillero Judicial" class="maxsize"/>

                        <p:outputLabel value="Responsable:" for="responsableForm"/>
                        <p:inputText id="responsableForm" value="#{prorrogalicenciaBean.prorroga.responsable}" title="Responsable"
                                     class="maxsize" readonly="true"/>

                        <p:outputLabel value="Url: " style="float: right !important"/>

                        <p:commandLink value="Ruta Expediente" actionListener="#{prorrogalicenciaBean.prepararExpediente}" process="@this"
                                       disabled="#{prorrogalicenciaBean.prorroga.solicitud eq null? true:false}" style="color: blue"
                                       oncomplete="PF('dlgExpediente').show();" update="allform:dlgExpediente mensajes"/>

                        <p:commandLink value="Ruta Casillero" onclick="otherpage('https://registro.propiedadintelectual.gob.ec/casilleros/media/files/#{prorrogalicenciaBean.prorroga.casilleroSenadi}/')"
                                       disabled="#{prorrogalicenciaBean.prorroga.solicitud eq null? true:false}" style="color: #0089ec"/>
                    </p:panelGrid>

                    <p:panelGrid id="guardarBtn" columns="2" class="panel-bottom">
                        <p:outputLabel value="PASAR A: " class="float-right" rendered="#{prorrogalicenciaBean.saveEdit eq 'EDITAR'}"/>
                        <p:selectOneMenu id="estadoRegistro" class="float-right" value="#{prorrogalicenciaBean.estadoTemp}" rendered="#{prorrogalicenciaBean.saveEdit eq 'EDITAR'}">
                            <f:selectItem itemLabel="Seleccionar..." itemValue="" noSelectionOption="true"/>
                            <f:selectItem itemLabel="NOTIFICADAS" itemValue="NOTIFICADA"/>
                            <f:selectItem itemLabel="CERTIFICADO" itemValue="CERTIFICADO"/>
                        </p:selectOneMenu>
                    </p:panelGrid>
                    <p:commandButton value="CERRAR" oncomplete="PF('dlgNuevaT').hide();" process="@form" class="btn_cerrar float-right"/>
                    <p:commandButton value="#{prorrogalicenciaBean.saveEdit}" actionListener="#{prorrogalicenciaBean.guardarProrroga}"
                                     update="mensajes allform:tablaDeDatos datosNuevaT"
                                     oncomplete="if(args.saved){PF('dlgNuevaT').hide();}"
                                     process="@form" class="btn_buscar float-right">
                        <p:confirm header="Seguridad" message="#{prorrogalicenciaBean.mensajeConfirmacion}" />
                    </p:commandButton>

                </h:form>
            </p:dialog>

            <p:dialog id="dlgExpediente" modal="true" resizable="true"
                      header="#{prorrogalicenciaBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgExpediente" style="font-size: 11px;" showEffect="explode"
                      hideEffect="explode" closeOnEscape="true" width="50%">
                <p:ajax event="close" update="dlgExpediente" resetValues="true" />
                <h:form id="frmExpediente" >
                    <p:dataTable id="tablaDeArchivos" var="archivo"
                                 value="#{prorrogalicenciaBean.archivos}" widgetVar="tablaDeArchivos"
                                 emptyMessage="No hay Datos para mostrar"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="20"
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 style="border: black !important" >
                        <p:column headerText="Archivos" style="text-align: center;" filterBy="#{archivo}" >
                            <p:commandLink value="#{archivo.nombre}" style="color: #0089ec; font-size: 14px;"
                                           onclick="otherpage('https://registro.propiedadintelectual.gob.ec/solicitudes/media/files/renewal_forms/#{prorrogalicenciaBean.prorroga.idRenewalForm}/#{archivo.documento}')"
                                           />
                        </p:column>
                    </p:dataTable>
                </h:form>
            </p:dialog>

            <p:dialog id="dlgHistorial" modal="true" resizable="true"
                      header="#{prorrogalicenciaBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgHistorial" style="font-size: 11px; width: 200px" showEffect="explode"
                      hideEffect="explode" closeOnEscape="true">
                <p:ajax event="close" update="dlgHistorial" resetValues="true" />
                <h:form id="frmHistory" >

                    <p:inputTextarea id='historialText' value="#{prorrogalicenciaBean.historial}" rows="10" cols="115" readonly="true"/>

                </h:form>

            </p:dialog>

            <p:confirmDialog global="true" showEffect="explode" hideEffect="explode">
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes btn_peque" update="renovacionForm:tablaDeDatos"/>
                <p:commandButton value="No" type="button"  styleClass="ui-confirmdialog-no btn_peque"/>
            </p:confirmDialog>

            <br/>
        </h:form>

        <div id="footer"></div>

        <p:idleMonitor timeout="#{1000*60*60}" id="idleSesion">
            <p:ajax event="idle" listener="#{idleMonitorCtrl.idleListener}"
                    oncomplete="PF('idleDialog').show()" />
        </p:idleMonitor>
        <p:dialog header="Sesión Caducada" resizable="false"
                  widgetVar="idleDialog" modal="true" closable="false" style="font-size: 12px">
            <h:form id="sesionCaducaForm">
                <div class="titlePage">
                    <h:outputText value="Sesión Caducada " />
                    <p:commandButton styleClass="nav-link js-scroll-trigger"
                                     actionListener="#{loginBean.logout}"
                                     oncomplete="logout(xhr, status, args)"
                                     value="ACEPTAR" immediate="true" style="font-size: 12px"/>
                </div>
            </h:form>
        </p:dialog>


        <!-- JavaScript libs are placed at the end of the document so the pages load faster -->


    </h:body>
    <script type="text/javascript">
        $(document).ready(function () {
            setTimeout(function () {
                $('body').addClass('loaded');
                $('h1').css('color', '#222222');
                $("#footer").load("footer.html");
            }, 150);
            $("#menuside").load("menusidebar.html", function () {
                jQuery('#proli_doc').addClass('activomenu');
                jQuery('#cambiosdoctitul').removeClass('sideinactivo').addClass('sideactivo');
            });
        });

        function getIdIndex(idName) {
            var doc = document.forms['allform'];
            var i;
            var idResult = 0;
            for (i = 0; doc.length > i; i++) {
                if (doc[i].id.includes(idName)) {
                    idResult = i;
                    console.log(doc[i].id);
                    break;
                }
            }
            return idResult;
        }

        //<![CDATA[
        function popupwindow(url, title, args) {
            if (args.doit) {
                window.open(url, title);
            }
        }
        function otherpage(url) {
            setTimeout(function () {
                window.open(url, '_blank');
            }, 0);
        }
        function logout(xhr, status, args) {
            setTimeout(function () {
                window.location = 'login.xhtml';
            }, 500);
        }
        //]]>
    </script>
</html>
