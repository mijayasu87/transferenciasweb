<!DOCTYPE html>
<html xmlns="http://www.w3c.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:x="http://xpert.com/faces">
    <h:head>
        <meta charset="utf-8" />
        <meta name="viewport"    content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="" />

        <title>CADUCADAS-NEGADAS-PRENDA</title>

        <link rel="shortcut icon" type="image/png" href="#{resource['images/favicon.png']}" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>

        <link rel="stylesheet" media="screen" href="http://fonts.googleapis.com/css?family=Open+Sans:300,400,700" />
        <link href="resources/assets/css/bootstrap.min.css" rel="stylesheet" />
        <link href="resources/assets/css/font-awesome.min.css" rel="stylesheet" />

        <!-- Custom styles for our template -->
        <link href="resources/assets/css/bootstrap-theme.css" rel="stylesheet" />
        <link href="resources/assets/css/main.css" rel="stylesheet" />
        <!-- My own style css -->
        <link href="resources/assets/css/style.css" rel="stylesheet" />
    </h:head>
    <h:body>
        <!-- Start Page Loading -->
        <div id="loader-wrapper">
            <div id="loader"></div>        
            <div class="loader-section section-left"></div>
            <div class="loader-section section-right"></div>
        </div>
        <p:growl id="mensajes" showDetail="true" life="2000"/>
        <h:form id="allform" enctype="multipart/form-data" style=" background: #e3e3e3; min-height: calc(100vh - 424px);">
            <div class="menu">
                <a href="#" class="logo"  title="Logo Senadi" ><img src="resources/images/sena_2.png" width="161px"/></a>

                <i id="edit_action" class="material-icons prefix" style="color: white; margin-left: 14px; display: inline-block">person</i>    

                <p:outputLabel value="#{loginBean.nombre}" style="color: white; font-size: 14px" />


                <div style="float: right; display: inline-block; margin-top: 5px">
                    <p:commandLink styleClass="btn_logout" actionListener="#{loginBean.logout}"
                                   oncomplete="logout(xhr, status, args)"
                                   title="CERRAR SESIÓN" immediate="true">
                        <i class="material-icons" style="font-size: 30px;">exit_to_app</i>
                    </p:commandLink>
                </div>

                <a class="itemm" href="settings.xhtml" title="Configuración" style="display:  #{loginBean.lectura eq true?'none':'inline-block'}"><i class="material-icons" >settings</i></a>
                <a class="activo" href="#" title="CADUCADA NEGADA" >CADUCADA NEGADA</a>
                <a class="itemm" href="desistidaprenda.xhtml" title="Desistida" >DESISTIDAS</a>
                <a class="itemm" href="levanprenda.xhtml" title="Levantamiento Prenda" >LEVANTAMIENTO</a>
                <a class="itemm" href="prorrogaprenda.xhtml" title="Prórrogas" >PRÓRROGAS</a>
                <a class="itemm" href="notificadapre.xhtml" title="Notificaciones" >NOTIFICADAS</a> 
                <a class="itemm" href="certificadopre.xhtml" title="CERTIFICADO" >CERTIFICADO P. COMERCIAL</a>                                
            </div>
            <div class="card" style="margin-top: 20%; position: absolute;">
                <br/>
                <p:sidebar widgetVar="sidebar1" style="z-index: 999 !important; width: 22%; background: #E8F5E9; overflow: scroll">
                    <div id="menuside"></div>
                </p:sidebar>
                <p:commandButton icon="pi pi-arrow-right" type="button" onclick="PF('sidebar1').show()" styleClass="mr-2 " class="btn_sidebar"
                                 style="position: fixed; z-index: 999; background-color: #d30039 !important;"/>
            </div>
            <br/>
            <h:panelGrid columns="1"  style="text-align: center; font-size: 16px; font-weight: bold; margin: 0 auto; width: 97%;">
                <p:panel class="panelContent" >
                    <p:commandButton id="nuevo_registro" value="NUEVO CADUCADA-NEGADO PRENDA" 
                                     style="font-size: 12px; float: left"
                                     actionListener="#{caducadaPrendaBean.prepararNuevo}"
                                     update="allform:dlgNuevaT allform:frmNuevaT:datosNuevaT allform:frmNuevaT:guardarBtn"
                                     oncomplete="if(args.doit){PF('dlgNuevaT').show()};" process="@this" class="btn_peque" rendered="#{!loginBean.lectura}"/>
                    <p:tabView style="font-size: 12px; margin: 0 auto; width: 50%" >
                        <p:tab title="Búsqueda por Criterio" >
                            <p:outputLabel value="BUSCAR: " style="font-size: 13px; font-weight: bold; margin-right: 5px;"/>
                            <p:inputText id="buscarText" value="#{caducadaPrendaBean.criterio}" 
                                         style="font-size: 14px; margin-right: 5px; width: 40%" placeholder="Ingrese un criterio de búsqueda"
                                         title="Puede buscar por No. Solicitud, Denominación o Titular Actual"/>
                            <p:commandButton value="BUSCAR" actionListener="#{caducadaPrendaBean.buscarCaducada}"
                                             update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px"
                                             process="@parent" class="btn_peque"/>
                        </p:tab>
                        <p:tab title="Búsqueda por Fecha" >                            
                            <p:outputLabel value="DESDE:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{caducadaPrendaBean.fechaInicio}" label="Fecha Desde" style="font-size: 13px; margin-right: 5px;" 
                                        placeholder="Fecha Inicio de Búsqueda" navigator="true"/>
                            <p:outputLabel value="HASTA:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{caducadaPrendaBean.fechaFin}" label="Fecha Hasta" style="font-size: 13px; margin-right: 5px;"
                                        placeholder="Fecha Fin de Búsqueda" navigator="true"/>

                            <p:commandButton value="BUSCAR"  
                                             actionListener="#{caducadaPrendaBean.buscarCaducadasPorFecha}" 
                                             update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px"
                                             process="@parent" title="Se busca por fecha de Presentación" class="btn_peque"/>                            
                        </p:tab>
                    </p:tabView>
                    <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()" />

                    <p:dialog widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                        <p:graphicImage name="/images/ajax-loader.gif" />
                    </p:dialog>
                    <p:outputLabel id="num_reg" value="#{caducadaPrendaBean.numRegistros}" style="float: left; font-size: 12px"/>
                    <br/>
                    <p:dataTable id="tablaDeDatos" var="caducada"
                                 value="#{caducadaPrendaBean.caducadas}" widgetVar="tablaDeCaducadas"
                                 emptyMessage="No hay Datos para mostrar"                                              
                                 filteredValue="#{caducadaPrendaBean.caducadasFiltradas}"
                                 binding="#{caducadaPrendaBean.caducadaDataTable}"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="20" rowKey="#{caducada.id}"
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 selection="#{caducadaPrendaBean.selectedCaducadas}"
                                 style="margin:3px auto; font-size: 9px !important;" >

                        <f:facet name="header">
                            <p:outputPanel>
                                <h:outputText value="BUSCAR EN RESULTADO: " />
                                <p:inputText id="globalFilter" onkeyup="PF('tablaDeCaducadas').filter()"
                                             style="width:300px" placeholder="Escriba aquí"/>
                            </p:outputPanel>
                        </f:facet>
                        
                        <p:column selectionMode="multiple" style="width:16px;text-align:center" rendered="#{!loginBean.lectura}" exportable="false"/>
                        
                        <p:column headerText="Solicitud" style="text-align: center;" filterBy="#{caducada.solicitud}" >
                            <h:outputText value="#{caducada.solicitud}" />
                        </p:column>
                        <p:column headerText="F. Presentacion" style="text-align: center;" filterBy="#{caducada.fechaPresentacion}" >
                            <h:outputText value="#{caducada.fechaPresentacion}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Resolución" style="text-align: center; width: 13rem" filterBy="#{caducada.resolucionNo}" >
                            <h:outputText value="#{caducada.resolucionCaducada}" />
                        </p:column>
                        <p:column headerText="F. Resolución" style="text-align: center;" filterBy="#{caducada.fechaResolucion}" >
                            <h:outputText value="#{caducada.fechaResolucionCaducada}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Denominación" style="text-align: center;" filterBy="#{caducada.denominacion}" >
                            <h:outputText value="#{caducada.denominacion}" />
                        </p:column>
                        <p:column headerText="Registro" style="text-align: center; width: 13rem" filterBy="#{caducada.registro}" >
                            <h:outputText value="#{caducada.registro}" />
                        </p:column>
                        <p:column headerText="F. Registro" style="text-align: center;" filterBy="#{caducada.fechaRegistro}" >
                            <h:outputText value="#{caducada.fechaRegistro}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="signo" style="text-align: center;" filterBy="#{caducada.signo}" >
                            <h:outputText value="#{caducada.signo}" />
                        </p:column>
                        <p:column headerText="F. Contrato" style="text-align: center;" filterBy="#{caducada.fechaContrato}" >
                            <h:outputText value="#{caducada.fechaContrato}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>                        
                        <p:column headerText="Responsable" style="text-align: center;">
                            <h:outputText value="#{caducada.responsable}" />
                        </p:column>
                        <p:column id="editar" headerText="Acción"  exportable="false" style="margin: 0 auto; width: 150px;" rendered="#{!loginBean.lectura}">                            
                            <p:commandLink class="link"
                                           actionListener="#{caducadaPrendaBean.prepararEditar}"
                                           update="allform:dlgNuevaT allform:frmNuevaT:datosNuevaT allform:frmNuevaT:guardarBtn "
                                           oncomplete="if(args.peditar){PF('dlgNuevaT').show()};"
                                           process="@this"
                                           title="Editar" >
                                <i id="edit_action" class="material-icons md-18">edit</i>
                            </p:commandLink>
                            <p:commandLink class="link" title="Descargar"
                                           actionListener="#{caducadaPrendaBean.viewCaducada}"
                                           process="@this" 
                                           update="mensajes"
                                           oncomplete="popupwindow('caducareport', '_blank', args);">
                                <i id="download_action" class="material-icons md-18">cloud_download</i>
                            </p:commandLink>
                            <p:commandLink class="link"
                                           actionListener="#{caducadaPrendaBean.prepararHistorial}"
                                           title="Seguimiento" process="@this"
                                           update="allform:dlgHistorial"
                                           oncomplete="PF('dlgHistorial').show();">
                                <i id="history_action" class="material-icons md-18">history</i>                            
                            </p:commandLink>

                            <p:commandLink class="link_remove" 
                                           actionListener="#{caducadaPrendaBean.eliminarCaducada}"
                                           update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                           title="Eliminar" process="@this" >
                                <i id="delete_action" class="material-icons md-18">delete</i>
                                <p:confirm header="CONFIRMAR" message="SEGURO DE ELIMINAR EL CADUCADA CON SOLICITUD: #{caducada.solicitud} ?"/> 
                            </p:commandLink>
                        </p:column>
                        <f:facet name="footer">                            
                            <p:commandButton process="tablaDeDatos" value="Descargar Seleccionados" 
                                             actionListener="#{caducadaPrendaBean.downloadSelected}" 
                                             update="mensajes" oncomplete="if(args.doit){popupwindow('caducareport', '_blank', args);}" 
                                             rendered="#{!loginBean.lectura}" class="btn_peque" />

                        </f:facet>
                    </p:dataTable>
                    <p:outputLabel id="num_registros" value="#{caducadaPrendaBean.numRegistros}" style="float: left; font-size: 12px"/>
                    <h:panelGrid columns="2" style="float: right;">
                        <h:commandLink title="Exportar a excel..." rendered="#{!loginBean.lectura}" immediate="true">
                            <p:graphicImage class="excel" width="20px" height="20px" library="images" name="excel.png"/>
                            <p:dataExporter type="xls" target="tablaDeDatos" fileName="#{caducadaPrendaBean.exportName}" />
                        </h:commandLink>
                        <br/>
                    </h:panelGrid>
                    <br/>
                </p:panel>
            </h:panelGrid>

            <p:dialog id="dlgNuevaT" modal="true" resizable="true" styleClass="dlgFormNice dlg-prenda"
                      header="#{caducadaPrendaBean.dialogTitle}" fitViewport="true" width="80%"
                      widgetVar="dlgNuevaT" style="font-size: 11px; margin-bottom: 10px" showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true">
                <p:ajax event="close" update="dlgNuevaT" resetValues="true" />
                <p:growl id="nuevoreg" life="1000"/>
                <h:form id="frmNuevaT" >
                    <p:panelGrid columns="6" id="datosNuevaT" styleClass="showcase-text-align-center" style="width: 100%"
                                 columnClasses="ten-percent,twenty-percent,ten-percent,twenty-percent,ten-percent,twenty-percent">

                        <p:outputLabel value="Solicitud:" for="solicitudForm"/>
                        <h:panelGroup>
                            <p:inputText id="solicitudForm" value="#{caducadaPrendaBean.caducada.solicitud}" title="Solicitud" required="true" 
                                         style="background: #aed581 !important; width: 85%; text-transform: uppercase"/>
                            <p:commandButton icon="pi pi-search" class="btn_peque" style="position: absolute;" actionListener="#{caducadaPrendaBean.buscarTramite}"
                                             rendered="#{caducadaPrendaBean.dialogTitle eq 'NUEVO CADUCADA-NEGADO PRENDA COMERCIAL'?true:false}" process="@parent" update="mensajes frmNuevaT:datosNuevaT frmNuevaT:cvTitCancelado" oncomplete="if(args.cancelado){PF('cvTitCancelado').show();}"/>
                        </h:panelGroup>

                        <p:outputLabel value="F. Presentacion" for="fpresentacionForm"/>                            
                        <p:calendar id="fpresentacionForm"  value="#{caducadaPrendaBean.caducada.fechaPresentacion}" timeZone="GMT-5" navigator="true"
                                    mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha de Solicitud" inputStyleClass="maxsize"/>

                        <p:outputLabel value="Denominación:" for="denominacionForm"/>                            
                        <p:inputTextarea id="denominacionForm" value="#{caducadaPrendaBean.caducada.denominacion}" title="Denominación" 
                                         required="true" class="maxsize"/>

                        <p:outputLabel value="Registro:" for="registroForm"/>                            
                        <p:inputText id="registroForm" value="#{caducadaPrendaBean.caducada.registro}" title="Registro" required="true" class="maxsize"/>

                        <p:outputLabel value="F. Registro" for="fregistroForm"/>
                        <p:calendar id="fregistroForm"  value="#{caducadaPrendaBean.caducada.fechaRegistro}" timeZone="GMT-5" navigator="true"
                                    mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha de Registro" inputStyleClass="maxsize"/>

                        <p:outputLabel value="Solicitante:" for="soliForm"/>                            
                        <p:inputText id="soliForm" value="#{caducadaPrendaBean.caducada.solicitante}" title="Signo" required="true" class="maxsize"/>
                        
                        <p:outputLabel value="Signo:" for="signoForm"/>                            
                        <p:inputText id="signoForm" value="#{caducadaPrendaBean.caducada.signo}" title="Signo" required="true" class="maxsize"/>

                        <p:outputLabel value="F. Contrato" for="fcontratoForm"/>
                        <p:calendar id="fcontratoForm"  value="#{caducadaPrendaBean.caducada.fechaContrato}" timeZone="GMT-5" navigator="true"
                                    mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha de Contrato" inputStyleClass="maxsize"/>

                        <p:outputLabel value="F. Vence Contrato" for="fvenceForm"/>
                        <p:calendar id="fvenceForm"  value="#{caducadaPrendaBean.caducada.fechaVencimientoContrato}" timeZone="GMT-5" navigator="true"
                                    mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha de Contrato" inputStyleClass="maxsize"/>                       

                        <p:outputLabel value="ProvRegNo:" for="provregnoForm"/>                            
                        <p:inputText id="provregnoForm" value="#{caducadaPrendaBean.caducada.prov_reg_no}" 
                                     title="ProvRegNo" class="maxsize"/>

                        <p:outputLabel value="FechaNotProvReg" for="fnotForm"/>
                        <p:calendar id="fnotForm"  value="#{caducadaPrendaBean.caducada.fechaNotProvReg}" timeZone="GMT-5" navigator="true"
                                    mask="true" pattern="yyyy-MM-dd" title="Fecha de Notificación Prov Reg" inputStyleClass="maxsize"/>

                        <p:outputLabel value="Casillero SENADI:" for="casSenadiForm"/>                            
                        <p:inputText id="casSenadiForm" value="#{caducadaPrendaBean.caducada.casilleroSenadi}" title="Casillero SENADI" class="maxsize"/>

                        <p:outputLabel value="Casillero JUDICIAL:" for="casJudicialForm"/>                            
                        <p:inputText id="casJudicialForm" value="#{caducadaPrendaBean.caducada.casilleroJudicial}" title="Casillero Judicial" class="maxsize"/>

                        <p:outputLabel value="Correo:" for="emaiForm"/>                            
                        <p:inputText id="emaiForm" value="#{caducadaPrendaBean.caducada.email}" title="Correo" class="maxsize"/>

                        <p:outputLabel value="Responsable:" for="responsableForm"/>                            
                        <p:inputText id="responsableForm" value="#{caducadaPrendaBean.caducada.responsable}" title="Responsable" class="maxsize"/>                                                

                        <p:outputLabel value="Comprobante" for="comproForm"/>
                        <p:inputText id="comproForm" value="#{caducadaPrendaBean.caducada.comprobante}" title="comprobante" class="maxsize"/>
                        
                        <p:outputLabel value="Observación:" for="obserForm"/>
                        <p:inputTextarea id="obserForm" value="#{caducadaPrendaBean.caducada.observacion}" title="comprobante" class="maxsize" required="true"/>

                        <p:outputLabel value="Url: " style="float: right !important"/>
                        <p:commandLink value="Ruta Expediente" actionListener="#{caducadaPrendaBean.prepararExpediente}" process="@this"
                                       disabled="#{caducadaPrendaBean.caducada.solicitud eq null? true:false}" style="color: blue"
                                       oncomplete="PF('dlgExpediente').show();" update="allform:dlgExpediente mensajes"/>


                        <p:commandLink value="Ruta Casillero" onclick="otherpage('https://registro.propiedadintelectual.gob.ec/casilleros/media/files/#{caducadaPrendaBean.caducada.casilleroSenadi}/')"  
                                       disabled="#{caducadaPrendaBean.caducada.solicitud eq null? true:false}" style="color: #0089ec"/>
                    </p:panelGrid>

                    <p:panelGrid id="guardarBtn" columns="2" styleClass="ui-noborder" style="float: right">                            

                        <p:commandButton value="#{caducadaPrendaBean.saveEdit}" actionListener="#{caducadaPrendaBean.guardarCaducada}"
                                         update="mensajes allform:tablaDeDatos datosNuevaT"
                                         oncomplete="if(args.saved){PF('dlgNuevaT').hide();}"
                                         process="@form" class="btn_buscar">
                            <p:confirm header="Seguridad" message="#{caducadaPrendaBean.mensajeConfirmacion}" class="btn_peque"/>
                        </p:commandButton>
                        <p:commandButton value="CERRAR" oncomplete="PF('dlgNuevaT').hide();" process="@form" class="btn_cerrar"/>                            
                    </p:panelGrid>
                                    <p:confirmDialog widgetVar="cvTitCancelado" id="cvTitCancelado" appendTo="@(body)"
                                     header="TÍTULO CANCELADO" severity="alert"
                                     message="#{caducadaPrendaBean.mensajeCancelado}"
                                     showEffect="explode" hideEffect="explode">
                        <p:commandButton value="SÍ, REGISTRAR" type="button" onclick="PF('cvTitCancelado').hide();" class="btn_peque"/>
                        <p:commandButton value="NO" actionListener="#{caducadaPrendaBean.descartarTramite}" process="@this"
                                         update="frmNuevaT:datosNuevaT" oncomplete="PF('cvTitCancelado').hide();" class="btn_cerrar"/>
                    </p:confirmDialog>
</h:form>
            </p:dialog>

            <p:dialog id="dlgExpediente" modal="true" resizable="true"
                      header="#{caducadaPrendaBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgExpediente" style="font-size: 11px;" showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true" width="50%">
                <p:ajax event="close" update="dlgExpediente" resetValues="true" />                
                <h:form id="frmExpediente" >
                    <p:dataTable id="tablaDeArchivos" var="archivo"
                                 value="#{caducadaPrendaBean.archivos}" widgetVar="tablaDeArchivos"
                                 emptyMessage="No hay Datos para mostrar"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="20"
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 style="border: black !important" >
                        <p:column headerText="Archivos" style="text-align: center;" filterBy="#{archivo}" >
                            <p:commandLink value="#{archivo.nombre}" style="color: #0089ec; font-size: 14px;"
                                           onclick="otherpage('https://registro.propiedadintelectual.gob.ec/solicitudes/media/files/renewal_forms/#{caducadaPrendaBean.caducada.idRenewalForm}/#{archivo.documento}')"  
                                           />
                        </p:column>
                    </p:dataTable>
                </h:form>
            </p:dialog>

            <p:dialog id="dlgHistorial" modal="true" resizable="true"
                      header="HISTORIAL #{caducadaPrendaBean.caducada.solicitud}" fitViewport="true"
                      widgetVar="dlgHistorial" style="font-size: 11px;" showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true">
                <p:ajax event="close" update="dlgHistorial" resetValues="true" />                
                <h:form id="frmHistory" >
                    <p:inputTextarea id='historialText' value="#{caducadaPrendaBean.historial}" rows="10" cols="160"  readonly="true" style="width: 100%" />
                </h:form>
            </p:dialog>

            <p:confirmDialog global="true" showEffect="explode" hideEffect="explode">
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes btn_peque" update="allform:tablaDeDatos"/>
                <p:commandButton value="No" type="button"  styleClass="ui-confirmdialog-no btn_peque"/>
            </p:confirmDialog>


            <br/>
        </h:form>

        <div id="footer"></div>

        <p:idleMonitor timeout="#{1000*60*60}" id="idleSesion">
            <p:ajax event="idle" listener="#{idleMonitorCtrl.idleListener}"
                    oncomplete="PF('idleDialog').show()" />
        </p:idleMonitor>
        <p:dialog header="Sesión Caducada" resizable="false"
                  widgetVar="idleDialog" modal="true" closable="false" style="font-size: 12px">
            <h:form id="sesionCaducaForm">
                <div class="titlePage">
                    <h:outputText value="Sesión Caducada " />
                    <p:commandButton styleClass="nav-link js-scroll-trigger"
                                     actionListener="#{loginBean.logout}"
                                     oncomplete="logout(xhr, status, args)"
                                     value="ACEPTAR" immediate="true" style="font-size: 12px"/>
                </div>
            </h:form>
        </p:dialog>

        <!-- <script src="resources/assets/js/headroom.min.js"></script>
