<!DOCTYPE html>
<html xmlns="http://www.w3c.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:x="http://xpert.com/faces">
    <h:head>
        <meta charset="utf-8" />
        <meta name="viewport"    content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="" />

        <title>CERTIFICADO-PRENDA</title>

        <link rel="shortcut icon" type="image/png" href="#{resource['images/favicon.png']}" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>

        <link rel="stylesheet" media="screen" href="http://fonts.googleapis.com/css?family=Open+Sans:300,400,700" />
        <link href="resources/assets/css/bootstrap.min.css" rel="stylesheet" />
        <link href="resources/assets/css/font-awesome.min.css" rel="stylesheet" />

        <!-- Custom styles for our template -->
        <link href="resources/assets/css/bootstrap-theme.css" rel="stylesheet" />
        <link href="resources/assets/css/main.css" rel="stylesheet" />
        <!-- My own style css -->
        <link href="resources/assets/css/style.css" rel="stylesheet" />
    </h:head>
    <h:body>
        <!-- Start Page Loading -->
        <div id="loader-wrapper">
            <div id="loader"></div>        
            <div class="loader-section section-left"></div>
            <div class="loader-section section-right"></div>
        </div>
        <p:growl id="mensajes" showDetail="true" life="4000"/>
        <h:form id="allform" enctype="multipart/form-data" style=" background: #e3e3e3; min-height: calc(100vh - 424px);">
            <div class="menucn">
                <a href="#" class="logo"  title="Logo Senadi" ><img src="resources/images/sena_2.png" width="161px"/></a>

                <i id="edit_action" class="material-icons prefix" style="color: white; margin-left: 20px; display: inline-block">person</i>    

                <p:outputLabel value="#{loginBean.nombre}" style="color: white; font-size: 18px" />

                <div style="float: right; display: inline-block; margin-top: 5px">
                    <p:commandLink styleClass="btn_logout" actionListener="#{loginBean.logout}"
                                   oncomplete="logout(xhr, status, args)"
                                   title="CERRAR SESIÓN" immediate="true">
                        <i class="material-icons" style="font-size: 30px; ">exit_to_app</i>
                    </p:commandLink>
                </div>
                <a class="itemm" href="settings.xhtml" title="Configuración" style="display:  #{loginBean.lectura eq true?'none':'inline-block'}"><i class="material-icons" >settings</i></a>
                <a class="itemm" href="prorrogaprenda.xhtml" title="Prórrogas" >PRÓRROGAS</a>
                <a class="itemm" href="abandonoprenda.xhtml" title="ABANDONO" >ABANDONO</a>
                <a class="itemm" href="caducadaprenda.xhtml" title="CADUCADA NEGADA" >CADUCADA NEGADA</a>
                <a class="itemm" href="desistidaprenda.xhtml" title="Desistida" >DESISTIDAS</a>
                <a class="itemm" href="levanprenda.xhtml" title="Levantamiento Prenda" >LEVANTAMIENTO</a>                
                <a class="itemm" href="notificadapre.xhtml" title="Notificaciones" >NOTIFICADAS</a> 
                <a class="activo" href="#" title="CERTIFICADO" >CERTIFICADO P. COMERCIAL</a>
                <a class="itemm" href="prendrez.xhtml" title="REZAGO" style="display: #{loginBean.lectura eq true?'none':'inline-block'}" >REZAGO</a>
            </div>
            <div class="card" style="margin-top: 20%; position: absolute;">
                <br/>
                <p:sidebar widgetVar="sidebar1" style="z-index: 999 !important; width: 22%; background: #E8F5E9; overflow: scroll">
                    <div id="menuside"></div>
                </p:sidebar>
                <p:commandButton icon="pi pi-arrow-right" type="button" onclick="PF('sidebar1').show()" styleClass="mr-2 " class="btn_sidebar"
                                 style="position: fixed; z-index: 999; background-color: #d30039 !important;"/>
            </div>
            <br/>
            <h:panelGrid columns="1"  style="text-align: center; font-size: 16px; font-weight: bold; margin: 0 auto; width: 97%;">
                <p:panel class="panelContent" >
                    <p:commandButton id="nuevo_registro" value="NUEVO CERTIFICADO PRENDA COMERCIAL" 
                                     style="font-size: 12px; float: left"
                                     class="btn_peque"
                                     actionListener="#{certificadoPrendaBean.prepararNuevo}"
                                     update="allform:dlgNuevaT allform:frmNuevaT:datosNuevaT allform:frmNuevaT:guardarBtn"
                                     oncomplete="if(args.doit){PF('dlgNuevaT').show()};" process="@this" rendered="#{!loginBean.lectura}"/>
                    <p:tabView style="font-size: 12px; margin: 0 auto; width: 50%; color: black !important">
                        <p:tab title="Búsqueda por Criterio" >
                            <p:outputLabel value="BUSCAR: " style="font-size: 13px; font-weight: bold; margin-right: 5px;"/>
                            <p:inputText id="buscarText" value="#{certificadoPrendaBean.criterio}" 
                                         style="font-size: 14px; margin-right: 5px; width: 40%" placeholder="Ingrese un criterio de búsqueda"
                                         title="Puede buscar por No. Solicitud, Denominación o Titular Actual"/>
                            <p:commandButton value="BUSCAR" actionListener="#{certificadoPrendaBean.buscarCertificadosPrendas}"
                                             update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px"
                                             process="@parent" class="btn_peque"/>
                        </p:tab>
                        <p:tab title="Búsqueda por Fecha" >                            
                            <p:outputLabel value="DESDE:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{certificadoPrendaBean.fechaInicio}" label="Fecha Desde" style="font-size: 20px !important; margin-right: 5px;" 
                                        placeholder="Fecha Inicio de Búsqueda" navigator="true"/>
                            <p:outputLabel value="HASTA:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{certificadoPrendaBean.fechaFin}" label="Fecha Hasta" style="font-size: 13px; margin-right: 5px;"
                                        placeholder="Fecha Fin de Búsqueda" navigator="true"/>

                            <p:commandButton value="BUSCAR"  
                                             actionListener="#{certificadoPrendaBean.buscarCertificadoPrendaPorFecha}" 
                                             update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px"
                                             process="@parent" title="Se busca por fecha de Presentación" class="btn_peque"/>
                        </p:tab>
                        <p:tab title="Búsqueda por Fecha Certificado" >                            
                            <p:outputLabel value="DESDE:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{certificadoPrendaBean.fechaInicioCertificado}" label="Fecha Desde" style="font-size: 13px; margin-right: 5px;" 
                                        placeholder="Fecha Inicio de Búsqueda" navigator="true"/>
                            <p:outputLabel value="HASTA:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{certificadoPrendaBean.fechaFinCertificado}" label="Fecha Hasta" style="font-size: 13px; margin-right: 5px;"
                                        placeholder="Fecha Fin de Búsqueda" navigator="true"/>

                            <p:commandButton value="BUSCAR"  
                                             actionListener="#{certificadoPrendaBean.buscarCertificadoPrendaPorFechaPrenda}" 
                                             update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px" class="btn_peque"
                                             process="@parent" title="Se busca por fecha de Presentación"/>                            
                        </p:tab>
                    </p:tabView>

                    <div style="float: right; font-weight: bold; margin-top: -20px; border: solid green; padding: 3px" hidden="#{!loginBean.lectura}">CON CERTIFICADO</div>

                    <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()" />

                    <p:dialog widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                        <p:graphicImage name="/images/ajax-loader.gif" />
                    </p:dialog>
                    <p:outputLabel id="num_reg" value="#{certificadoPrendaBean.numRegistros}" style="float: left; font-size: 12px"/>
                    <br/>
                    <p:dataTable id="tablaDeDatos" var="certificado"
                                 value="#{certificadoPrendaBean.certificados}" widgetVar="tablaDeDatos"
                                 emptyMessage="No hay Datos para mostrar"                                              
                                 filteredValue="#{certificadoPrendaBean.certificadosFiltradas}"
                                 binding="#{certificadoPrendaBean.certificadosDataTable}"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="20"
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 selection="#{certificadoPrendaBean.selectedCertificados}"
                                 style="border: black !important" 
                                 rowKey="#{certificado.id}">

                        <f:facet name="header">
                            <p:outputPanel>
                                <h:outputText value="BUSCAR EN RESULTADO: " />
                                <p:inputText id="globalFilter" onkeyup="PF('tablaDeDatos').filter()"
                                             style="width:300px" placeholder="Escriba aquí"/>
                            </p:outputPanel>
                        </f:facet>

                        <p:column selectionMode="multiple" style="width:16px;text-align:center" rendered="#{!loginBean.lectura}" exportable="false"/>

                        <p:column headerText="Solicitud" style="text-align: center;" filterBy="#{certificado.solicitud}" filterMatchMode="contains">
                            <h:outputText value="#{certificado.solicitud}" />
                        </p:column>

                        <p:column headerText="F. Presentación" style="text-align: center;" filterBy="#{certificado.fechaPresentacion}" >
                            <h:outputText value="#{certificado.fechaPresentacion}" >
                                <f:convertDateTime pattern="yyyy-MM-dd"/>
                            </h:outputText>
                        </p:column>                        

                        <p:column  headerText="Prenda N°" style="text-align: center;" filterBy="#{certificado.prendaNo}" >
                            <p:commandLink id="notlink" value="#{certificado.prendaNo}" style="color: #0089ec; font-size: 14px;" process="@this"
                                           title="Visualizar Certificado #{certificado.prendaNo}" actionListener="#{certificadoPrendaBean.validarCertificado(certificado)}"
                                           oncomplete="if(args.viewnotificacion){otherpage(args.view)};" update="mensajes notlink" rendered="#{certificado.certificadoEmitido and !loginBean.lectura}"/>
                            <h:outputText value="#{certificado.prendaNo}" rendered="#{loginBean.lectura or !certificado.certificadoEmitido}"/>
                        </p:column>

                        <p:column headerText="F. Prenda" style="text-align: center;" filterBy="#{certificado.fechaPrenda}" >
                            <h:outputText value="#{certificado.fechaPrenda}" >
                                <f:convertDateTime pattern="yyyy-MM-dd"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Registro" style="text-align: center; width: 13rem" filterBy="#{certificado.registro}" >
                            <h:outputText value="#{certificado.registro}" />
                        </p:column>
                        <p:column headerText="F. Registro" style="text-align: center;" filterBy="#{certificado.fechaRegistro}" >
                            <h:outputText value="#{certificado.fechaRegistro}" >
                                <f:convertDateTime pattern="yyyy-MM-dd"/>
                            </h:outputText>                                
                        </p:column>

                        <p:column headerText="Denominación" style="text-align: center;" filterBy="#{certificado.denominacion}" >
                            <h:outputText value="#{certificado.denominacion}" />
                        </p:column>
                        <p:column headerText="signo" style="text-align: center;" filterBy="#{certificado.signo}" >
                            <h:outputText value="#{certificado.signo}" />
                        </p:column>
                        <p:column headerText="Deudora Prendaria" style="text-align: center;" filterBy="#{certificado.deudoraPrendaria}" >
                            <h:outputText value="#{certificado.deudoraPrendaria}" />
                        </p:column>
                        <p:column headerText="Prendaria Acreedora" style="text-align: center;" filterBy="#{certificado.prendariaAcreedora}" >
                            <h:outputText value="#{certificado.prendariaAcreedora}" />
                        </p:column>
                        <p:column headerText="Dom. T. Actual" style="text-align: center;" filterBy="#{certificado.domicilioTitularActual}" rendered="false" >
                            <h:outputText value="#{certificado.domicilioTitularActual}" />
                        </p:column>
                        <p:column headerText="Abogado Patrocinador" style="text-align: center;" filterBy="#{certificado.abogadoPatrocinador}" visible="false" >
                            <h:outputText value="#{certificado.abogadoPatrocinador}" />
                        </p:column>
                        <p:column headerText="Casillero Senadi" style="text-align: center;" filterBy="#{certificado.casilleroSenadi}" visible="false" >
                            <h:outputText value="#{certificado.casilleroSenadi}" />
                        </p:column>

                        <p:column headerText="Casillero Judicial" style="text-align: center;" filterBy="#{certificado.casilleroJudicial}" visible="false" >
                            <h:outputText value="#{certificado.casilleroJudicial}" />
                        </p:column>

                        <p:column headerText="Responsable" style="text-align: center;" filterBy="#{certificado.responsable}" >
                            <h:outputText value="#{certificado.responsable}" />
                        </p:column>

                        <p:column id="vernot" headerText="Acción" style="margin: 0 auto; width: 135px;" rendered="#{loginBean.lectura and certificado.certificadoEmitido}" exportable="false">                        
                            <p:commandLink class="link"                                       
                                           title="Notificaciones" process="@this"
                                           actionListener="#{certificadoPrendaBean.verNotificacionPrendaComercial}"
                                           oncomplete="if(args.notit){otherpage(args.rutanot);}" update="mensajes">
                                <i class="pi pi-eye" style="font-size: 2rem"></i>
                            </p:commandLink>
                        </p:column>

                        <p:column id="editar" headerText="Acción"  exportable="false" style="margin: 0 auto; width: 155px;" rendered="#{!loginBean.lectura}"
                                  styleClass="#{certificado.certificadoEmitido eq true ?'border_green_color':null}">
                            <p:commandLink class="link"
                                           actionListener="#{certificadoPrendaBean.prepararEditar}"
                                           update="allform:dlgNuevaT allform:frmNuevaT:datosNuevaT allform:frmNuevaT:guardarBtn "
                                           oncomplete="if(args.peditar){PF('dlgNuevaT').show()};"
                                           process="@this"
                                           title="Editar" >
                                <i id="edit_action" class="material-icons md-18">edit</i>
                            </p:commandLink>
                            <p:commandLink class="link" title="Descargar"
                                           actionListener="#{certificadoPrendaBean.viewCertificadoPrenda}"
                                           process="@this" 
                                           update="mensajes"
                                           oncomplete="popupwindow('prendacomercialr', '_blank', args);">
                                <i id="download_action" class="material-icons md-18">cloud_download</i>                            
                            </p:commandLink>
                            <p:commandLink class="link" title="Descargar Adenda"
                                           actionListener="#{certificadoPrendaBean.viewCertificadoPrendaAdenda}"
                                           process="@this" 
                                           update="mensajes"
                                           oncomplete="popupwindow('prendacomercialr', '_blank', args);">
                                <i id="download_action" class="material-icons md-18">cloud_download</i>                            
                            </p:commandLink>
                            <p:commandLink class="link"
                                           actionListener="#{certificadoPrendaBean.prepararHistorial}"
                                           title="Seguimiento" process="@this"
                                           update="allform:dlgHistorial"
                                           oncomplete="PF('dlgHistorial').show();">
                                <i id="history_action" class="material-icons md-18">history</i>                            
                            </p:commandLink>

                            <p:commandLink class="link_remove" 
                                           actionListener="#{certificadoPrendaBean.eliminarCertificadoCN}"
                                           update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                           title="Eliminar" process="@this" >
                                <i id="delete_action" class="material-icons md-18">delete</i>
                                <p:confirm header="CONFIRMAR" message="SEGURO DE ELIMINAR LA NOTIFICACION CON SOLICITUD: #{certificado.solicitud} ?"/> 
                            </p:commandLink>
                        </p:column>
                        <f:facet name="footer">
                            <!-- <p:selectBooleanCheckbox value="{certificadoPrendaBean.separado}" itemLabel="Separados" rendered="{!loginBean.lectura}" /> -->
                            <p:commandButton process="tablaDeDatos" value="Descargar Seleccionados" 
                                             actionListener="#{certificadoPrendaBean.downloadSelected}" 
                                             update="mensajes" oncomplete="popupwindow('prendacomercialr', '_self', args);" 
                                             rendered="#{!loginBean.lectura}" class="btn_peque" />
                            <p:commandButton process="tablaDeDatos" value="Descargar Seleccionados (Adenda)" 
                                             actionListener="#{certificadoPrendaBean.downloadSelectedAdenda}" 
                                             update="mensajes" oncomplete="popupwindow('prendacomercialr', '_self', args);" 
                                             rendered="#{!loginBean.lectura}" class="btn_peque" />

                        </f:facet>
                    </p:dataTable>
                    <p:outputLabel id="num_registros" value="#{certificadoPrendaBean.numRegistros}" style="float: left; font-size: 12px"/>

                    <h:panelGrid columns="2" style="float: right;">
                        <h:commandLink title="Exportar a excel..." rendered="#{!loginBean.lectura}" immediate="true">
                            <p:graphicImage class="excel" width="20px" height="20px" library="images" name="excel.png"/>
                            <p:dataExporter type="xls" target="tablaDeDatos" fileName="#{certificadoPrendaBean.exportName}" />
                        </h:commandLink>                        
                    </h:panelGrid>
                    <br/>
                </p:panel>              

            </h:panelGrid>
            <p:dialog id="dlgNuevaT" modal="true" resizable="true" styleClass="dlgFormNice dlg-prenda" 
                      header="#{certificadoPrendaBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgNuevaT" style="font-size: 11px; margin-bottom: 10px" showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true" width="80%">
                <p:ajax event="close" update="dlgNuevaT" resetValues="true" />
                <p:growl id="nuevoreg" life="1000"/>
                <h:form id="frmNuevaT" >
                    <p:panelGrid columns="6" id="datosNuevaT" styleClass="showcase-text-align-center" style="width: 100%"
                                 columnClasses="ten-percent,twenty-percent,ten-percent,twenty-percent,ten-percent,twenty-percent">

                        <p:outputLabel value="Solicitud:" for="solicitudForm"/>
                        <h:panelGroup>
                            <p:inputText id="solicitudForm" value="#{certificadoPrendaBean.certificado.solicitud}" title="Solicitud" required="true" 
                                         style="background: #aed581 !important; width: 85%; text-transform: uppercase" />
                            <p:commandButton icon="pi pi-search" class="btn_peque"  style="position: absolute;" actionListener="#{certificadoPrendaBean.buscarTramite}" 
                                             rendered="#{certificadoPrendaBean.dialogTitle eq 'NUEVO CERTIFICADO PRENDA COMERCIAL'?true:false}" process="@parent"
                                             update="mensajes frmNuevaT:datosNuevaT"/>
                        </h:panelGroup>

                        <p:outputLabel value="F. Presentación:" for="fpresentacionForm"/>                            
                        <p:calendar id="fpresentacionForm"  value="#{certificadoPrendaBean.certificado.fechaPresentacion}" timeZone="GMT-5"
                                    mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha de Presentación" inputStyleClass="maxsize"
                                    navigator="true"/>

                        <p:outputLabel value="Prenda N°:" for="certificadoForm"/>                            
                        <p:inputText id="certificadoForm" value="#{certificadoPrendaBean.certificado.prendaNo}"  title="Certificado" 
                                     label="Se genera automáticamente"  disabled="#{certificadoPrendaBean.certificado.id eq null}"
                                     style="background: #FFCDD2 !important;" required="true" class="maxsize" placeholder="Automático">
                            <p:tooltip for="certificadoForm" value="Número que se crea automáticamente" position="right"/>
                            <p:keyFilter mask="num" />
                        </p:inputText>

                        <p:outputLabel value="Fecha Prenda" for="fcertificadoForm"/>                            
                        <p:calendar id="fcertificadoForm"  value="#{certificadoPrendaBean.certificado.fechaPrenda}" timeZone="GMT-5" navigator="true"
                                    mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha de Certificado" inputStyleClass="maxsize"/>

                        <p:outputLabel value="Registro:" for="registroForm"/>                            
                        <p:inputText id="registroForm" value="#{certificadoPrendaBean.certificado.registro}" title="Registro" required="true" class="maxsize"/>

                        <p:outputLabel value="Fecha Registro:" for="fregistroForm"/>
                        <p:calendar id="fregistroForm"  value="#{certificadoPrendaBean.certificado.fechaRegistro}" timeZone="GMT-5" navigator="true"
                                    mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha de Registro" inputStyleClass="maxsize"/>

                        <p:outputLabel value="F. Vence Registro:" for="fregistrovForm"/>
                        <p:calendar id="fregistrovForm"  value="#{certificadoPrendaBean.certificado.fechaVenceRegistro}" timeZone="GMT-5"
                                    mask="true" pattern="yyyy-MM-dd" title="Fecha Vence Registro" inputStyleClass="maxsize"
                                    navigator="true"/>

                        <p:outputLabel value="Fecha Contrato:" for="fcontratoForm"/>
                        <p:calendar id="fcontratoForm"  value="#{certificadoPrendaBean.certificado.fechaContrato}" timeZone="GMT-5"
                                    mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha Contrato" inputStyleClass="maxsize"
                                    navigator="true"/>

                        <p:outputLabel value="Denominación:" for="denominacionForm"/>                            
                        <p:inputTextarea id="denominacionForm" value="#{certificadoPrendaBean.certificado.denominacion}" title="Denominación" 
                                         required="true" style="width: 100% !important" class="maxsize"/>

                        <p:outputLabel value="Signo:" for="signoForm"/>                            
                        <p:inputText id="signoForm" value="#{certificadoPrendaBean.certificado.signo}" title="Signo" required="true" class="maxsize"/>

                        <p:outputLabel value="Deudora Prendaria:" for="deudoraForm"/>                            
                        <p:inputTextarea id="deudoraForm" value="#{certificadoPrendaBean.certificado.deudoraPrendaria}" title="Deudora Prendaria" required="true" class="maxsize"/>

                        <p:outputLabel value="Acreedora Prendario:" for="tactualForm"/>                            
                        <p:inputTextarea id="tactualForm" value="#{certificadoPrendaBean.certificado.prendariaAcreedora}" title="Prendaria Acreedora" required="true" class="maxsize"/>

                        <p:outputLabel value="Domicilio T. Actual:" for="dtactualForm" rendered="false"/>                            
                        <p:inputTextarea id="dtactualForm" value="#{certificadoPrendaBean.certificado.domicilioTitularActual}" title="Domicilio Titular Actual" 
                                         class="maxsize" rendered="false"/>

                        <p:outputLabel value="TitApodRepre:" for="titapodForm"/>
                        <p:inputTextarea id="titapodForm" value="#{certificadoPrendaBean.certificado.titApodRepre}" title="Tit apod repre" 
                                         class="maxsize" required="true"/>

                        <p:outputLabel value="Abogado Patrocinador:" for="abopatForm"/>
                        <p:inputTextarea id="abopatForm" value="#{certificadoPrendaBean.certificado.abogadoPatrocinador}" title="Abogado Patrocinador" 
                                         class="maxsize"/>

                        <p:outputLabel value="Correo Acreedor:" for="correoForm"/>
                        <p:inputText id="correoForm" value="#{certificadoPrendaBean.certificado.email}" title="Correo Eléctronico" 
                                     class="maxsize" />

                        <p:outputLabel value="Casillero SENADI Acreedor:" for="casSenadiAcForm"/>
                        <h:panelGroup>
                            <p:inputText id="casSenadiAcForm" value="#{certificadoPrendaBean.certificado.casilleroSenadiAcreedor}" title="Solicitud" 
                                         style="width: 85%; text-transform: uppercase" />
                            <p:commandButton icon="pi pi-search" class="btn_peque"  style="position: absolute;" title="Buscar Casillero"
                                             actionListener="#{certificadoPrendaBean.prepararBusquedaCasillero}"
                                             oncomplete="PF('dlgCasillero').show();" process="@this" update="mensajes allform:dlgCasillero"/>
                        </h:panelGroup>

                        <p:outputLabel value="Casillero SENADI:" for="casSenadiForm"/>                            
                        <p:inputText id="casSenadiForm" value="#{certificadoPrendaBean.certificado.casilleroSenadi}" title="Casillero SENADI" class="maxsize"/>

                        <p:outputLabel value="Casillero JUDICIAL:" for="casJudicialForm"/>                            
                        <p:inputText id="casJudicialForm" value="#{certificadoPrendaBean.certificado.casilleroJudicial}" title="Casillero Judicial" class="maxsize"/>                        

                        <p:outputLabel value="Comprobante:" for="compForm"/>                            
                        <p:inputText id="compForm" value="#{certificadoPrendaBean.certificado.comprobante}" title="Comprobante" class="maxsize"/>                        


                        <p:outputLabel value="Responsable:" for="responsableForm"/>                            
                        <p:inputText id="responsableForm" value="#{certificadoPrendaBean.certificado.responsable}" title="Responsable" 
                                     rendered="true" required="true" style="background: #E8F5E9 !important;" class="maxsize"/>                       

                        <p:outputLabel value="Url: " style="float: right !important"/>                        
                        <p:commandLink value="Ruta Expediente" actionListener="#{certificadoPrendaBean.prepararExpediente}" process="@this"
                                       disabled="#{certificadoPrendaBean.certificado.solicitud eq null? true:false}" style="color: blue"
                                       oncomplete="PF('dlgExpediente').show();" update="allform:dlgExpediente mensajes"/>                        

                    </p:panelGrid>
                    <p:panelGrid id="guardarBtn" columns="2" class="panel-bottom" >                            

                        <p:outputLabel value="PASAR A: " class="float-right" 
                                       rendered="#{certificadoPrendaBean.dialogTitle eq 'NUEVO CERTIFICADO PRENDA COMERCIAL'?false:true}"/>
                        <p:selectOneMenu id="estadoRegistro" class="float-right" value="#{certificadoPrendaBean.estadoTemp}" 
                                         rendered="#{certificadoPrendaBean.dialogTitle eq 'NUEVO CERTIFICADO PRENDA COMERCIAL'?false:true}">
                            <f:selectItem itemLabel="Seleccionar..." itemValue="" noSelectionOption="true"/>
                            <f:selectItem itemLabel="NOTIFICADAS" itemValue="NOTIFICADAS"/>
                            <f:selectItem itemLabel="LEVANTAMIENTO" itemValue="LEVANTAMIENTO"/>
                            <f:selectItem itemLabel="DESISTIDAS" itemValue="DESISTIDAS"/>
                            <f:selectItem itemLabel="CADUCADAS-NEGADAS" itemValue="CADUCADAS"/>
                        </p:selectOneMenu>                        
                    </p:panelGrid>
                    <p:commandButton value="CERRAR" oncomplete="PF('dlgNuevaT').hide();" process="@form" class="btn_cerrar float-right"/>
                    <p:commandButton value="#{certificadoPrendaBean.saveEdit}" actionListener="#{certificadoPrendaBean.guardarCertificadoPrenda}"
                                     update="mensajes allform:tablaDeDatos datosNuevaT"
                                     oncomplete="if(args.saved){PF('dlgNuevaT').hide();}"
                                     process="@form" class="btn_buscar float-right">
                        <p:confirm header="Seguridad" message="#{certificadoPrendaBean.mensajeConfirmacion}" />
                    </p:commandButton>
                </h:form>
            </p:dialog>

            <p:dialog id="dlgCasillero" modal="true" resizable="true"
                      header="BUSCAR CASILLERO ACREEDOR PARA EL TRÁMITE #{certificadoPrendaBean.certificado.solicitud}" fitViewport="true"
                      widgetVar="dlgCasillero" style="font-size: 11px; text-align: center;" showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true" width="70%">
                <p:ajax event="close" update="dlgCasillero" resetValues="true" />

                <h:form id="frmCasillero" >
                    <p:outputLabel value="Criterio de búsqueda:  "/>
                    <p:inputText value="#{certificadoPrendaBean.criterioOwner}" style="width: 50%" placeholder="Ingrese un nombre o identificación"/>
                    <p:commandButton value="BUSCAR" actionListener="#{certificadoPrendaBean.buscarCasillero}" update="allform:frmCasillero:tablaDeCasilleros mensajes" 
                                     process="@parent"/>
                    <p:dataTable id="tablaDeCasilleros" var="owner"
                                 value="#{certificadoPrendaBean.owners}" widgetVar="tablaDeCasilleros"
                                 emptyMessage="No hay Datos para mostrar"                                              
                                 filteredValue="#{certificadoPrendaBean.ownersFiltrados}"
                                 binding="#{certificadoPrendaBean.ownerDataTable}"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="10"
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 style="border: black !important" 
                                 selectionMode="single"
                                 rowKey="#{owner.id}">
                        <p:column headerText="Casillero" style="text-align: center;"  >
                            <h:outputText value="#{owner.casillero}" style="font-weight: bold; font-size: 13px"/>
                        </p:column>
                        <p:column headerText="Nombre" style="text-align: center;"  filterBy="#{owner.firstname}" filterMatchMode="contains">
                            <h:outputText value="#{owner.firstname}" />
                        </p:column>
                        <p:column headerText="Apellido" style="text-align: center;" filterBy="#{owner.lastname}" filterMatchMode="contains" >
                            <h:outputText value="#{owner.lastname}" />
                        </p:column>
                        <p:column headerText="Tipo Doc." style="text-align: center;"  >
                            <h:outputText value="#{owner.document_type}" />
                        </p:column>
                        <p:column headerText="Documento" style="text-align: center;"  filterBy="#{owner.document}" filterMatchMode="contains">
                            <h:outputText value="#{owner.document}" />
                        </p:column>
                        <p:column headerText="Email" style="text-align: center;"  filterBy="#{owner.email}" filterMatchMode="contains">
                            <h:outputText value="#{owner.email}" />
                        </p:column>
                        <p:column headerText="Phone" style="text-align: center;"  >
                            <h:outputText value="#{owner.phone}" />
                        </p:column>
                        <p:column headerText="Celular" style="text-align: center;"  >
                            <h:outputText value="#{owner.mobile}" />
                        </p:column>                        
                        <p:column headerText="Acción" style="text-align: center">
                            <p:commandLink class="linkcas"
                                           actionListener="#{certificadoPrendaBean.seleccionarCasillero}"
                                           update="allform:frmNuevaT:datosNuevaT mensajes"
                                           oncomplete="PF('dlgCasillero').hide();"
                                           process="@this"
                                           title="Seleccionar #{owner.casillero}" >
                                <i class="pi pi-check"></i>
                            </p:commandLink>
                        </p:column>
                    </p:dataTable>
                </h:form>
            </p:dialog>

            <p:dialog id="dlgExpediente" modal="true" resizable="true"
                      header="#{certificadoPrendaBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgExpediente" style="font-size: 11px;" showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true" width="50%">
                <p:ajax event="close" update="dlgExpediente" resetValues="true" />                
                <h:form id="frmExpediente" >
                    <p:dataTable id="tablaDeArchivos" var="archivo"
                                 value="#{certificadoPrendaBean.archivos}" widgetVar="tablaDeArchivos"
                                 emptyMessage="No hay Datos para mostrar"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="20"
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 style="border: black !important" >
                        <p:column headerText="Archivos" style="text-align: center;" filterBy="#{archivo}" >
                            <p:commandLink value="#{archivo.nombre}" style="color: #0089ec; font-size: 14px;"
                                           onclick="otherpage('https://registro.propiedadintelectual.gob.ec/solicitudes/media/files/renewal_forms/#{certificadoPrendaBean.certificado.idRenewalForm}/#{archivo.documento}')"  
                                           />
                        </p:column>
                    </p:dataTable>
                </h:form>
            </p:dialog>

            <p:dialog id="dlgHistorial" modal="true" resizable="true"
                      header="#{certificadoPrendaBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgHistorial" style="font-size: 11px;" showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true">
                <p:ajax event="close" update="dlgHistorial" resetValues="true" />                
                <h:form id="frmHistory" >

                    <p:inputTextarea id='historialText' value="#{certificadoPrendaBean.historial}" rows="10" cols="115" readonly="true"/>

                </h:form>

            </p:dialog>

            <p:confirmDialog global="true" showEffect="explode" hideEffect="explode">
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes btn_peque" update="allform:tablaDeDatos"/>
                <p:commandButton value="No" type="button"  styleClass="ui-confirmdialog-no btn_peque" />
            </p:confirmDialog>
            <br/>
        </h:form>

        <div id="footer"></div>

        <p:idleMonitor timeout="#{1000*60*60}" id="idleSesion">
            <p:ajax event="idle" listener="#{idleMonitorCtrl.idleListener}"
                    oncomplete="PF('idleDialog').show()" />
        </p:idleMonitor>
        <p:dialog header="Sesión Caducada" resizable="false"
                  widgetVar="idleDialog" modal="true" closable="false" style="font-size: 12px">
            <h:form id="sesionCaducaForm">
                <div class="titlePage">
                    <h:outputText value="Sesión Caducada " />
                    <p:commandButton styleClass="nav-link js-scroll-trigger"
                                     actionListener="#{loginBean.logout}"
                                     oncomplete="logout(xhr, status, args)"
                                     value="ACEPTAR" immediate="true" style="font-size: 12px"/>
                </div>
            </h:form>
        </p:dialog>


        <!-- JavaScript libs are placed at the end of the document so the pages load faster -->

        <!-- <script src="resources/assets/js/headroom.min.js"></script>
        <script src="resources/assets/js/jQuery.headroom.min.js"></script>
        <script src="resources/assets/js/template.js"></script> -->


    </h:body>
    <script type="text/javascript">
        $(document).ready(function () {
            setTimeout(function () {
                $('body').addClass('loaded');
                $('h1').css('color', '#222222');
                $("#footer").load("footer.html");
            }, 150);
            $("#menuside").load("menusidebar.html", function () {
                jQuery('#cer_pre').addClass('activomenu');
                jQuery('#prendastitul').removeClass('sideinactivo').addClass('sideactivo');
            });
        });

        function getIdIndex(idName) {
            var doc = document.forms['allform'];
            var i;
            var idResult = 0;
            for (i = 0; doc.length > i; i++) {
                if (doc[i].id.includes(idName)) {
                    idResult = i;
                    console.log(doc[i].id);
                    break;
                }
            }
            return idResult;
        }

        //<![CDATA[
        function popupwindow(url, title, args) {
            if (args.doit) {
                window.open(url, title);
            }
        }
        function otherpage(url) {
            setTimeout(function () {
                window.open(url, '_blank');
            }, 0);
        }
        function logout(xhr, status, args) {
            setTimeout(function () {
                window.location = 'login.xhtml';
            }, 500);
        }
        //]]>
    </script>
</html>
