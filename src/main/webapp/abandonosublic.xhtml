<!DOCTYPE html>
<html xmlns="http://www.w3c.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:x="http://xpert.com/faces">
    <h:head>
        <meta charset="utf-8" />
        <meta name="viewport"    content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="" />

        <title>ABANDONO-SUBLICENCIA</title>

        <link rel="shortcut icon" type="image/png" href="#{resource['images/favicon.png']}" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>

        <link rel="stylesheet" media="screen" href="http://fonts.googleapis.com/css?family=Open+Sans:300,400,700" />
        <link href="resources/assets/css/bootstrap.min.css" rel="stylesheet" />
        <link href="resources/assets/css/font-awesome.min.css" rel="stylesheet" />

        <!-- Custom styles for our template -->
        <link href="resources/assets/css/bootstrap-theme.css" rel="stylesheet" />
        <link href="resources/assets/css/main.css" rel="stylesheet" />
        <!-- My own style css -->
        <link href="resources/assets/css/style.css" rel="stylesheet" />
    </h:head>
    <h:body>
        <!-- Start Page Loading -->
        <div id="loader-wrapper">
            <div id="loader"></div>        
            <div class="loader-section section-left"></div>
            <div class="loader-section section-right"></div>
        </div>
        <p:growl id="mensajes" showDetail="true" life="3000"/>
        <h:form id="allform" enctype="multipart/form-data" style=" background: #e3e3e3; min-height: calc(100vh - 424px);">
            <div class="menu">
                <a href="#" class="logo"  title="Logo Senadi" ><img src="resources/images/sena_2.png" width="161px"/></a>

                <i id="edit_action" class="material-icons prefix" style="color: white; margin-left: 20px; display: inline-block">person</i>    

                <p:outputLabel value="#{loginBean.nombre}" style="color: white; font-size: 18px" />


                <div style="float: right; display: inline-block; margin-top: 5px">
                    <p:commandLink styleClass="btn_logout" actionListener="#{loginBean.logout}"
                                   oncomplete="logout(xhr, status, args)"
                                   title="CERRAR SESIÓN" immediate="true">
                        <i class="material-icons" style="font-size: 30px; ">exit_to_app</i>
                    </p:commandLink>
                </div>
                <a class="itemm" href="settings.xhtml" title="Configuración" style="display:  #{loginBean.lectura eq true?'none':'inline-block'}"><i class="material-icons" >settings</i></a>
                <a class="itemm" href="prorrogasublic.xhtml" title="Prórrogas" >PRÓRROGAS</a>
                <a class="activo" href="#" title="Abandonos" >ABANDONOS</a>
                <a class="itemm" href="caducadasublic.xhtml" title="CADUCADA NEGADA" >CADUCADA NEGADA</a>
                <a class="itemm" href="desistidasublic.xhtml" title="Desistida" >DESISTIDAS</a>
                <a class="itemm" href="terminacionsublic.xhtml" title="Terminación SubLicencia" >TERMINACIÓN SUBLICENCIA</a>                
                <a class="itemm" href="notificadasublic.xhtml" title="Notificaciones" >NOTIFICADAS</a> 
                <a class="itemm" href="certificadosublic.xhtml" title="CERTIFICADO" >CERTIFICADO SUBLICENCIA</a>
            </div>
            <div class="card" style="margin-top: 20%; position: absolute;">
                <br/>
                <p:sidebar widgetVar="sidebar1" style="z-index: 999 !important; width: 22%; background: #E8F5E9; overflow: scroll">
                    <div id="menuside"></div>
                </p:sidebar>
                <p:commandButton icon="pi pi-arrow-right" type="button" onclick="PF('sidebar1').show()" styleClass="mr-2 " class="btn_sidebar"
                                 style="position: fixed; z-index: 999; background-color: #d30039 !important;"/>
            </div>
            <br/>
            <h:panelGrid columns="1"  style="text-align: center; font-size: 16px; font-weight: bold; margin: 0 auto; width: 97%;">
                <p:panel class="panelContent" >
                    <p:commandButton id="nuevo_registro" value="NUEVO ABANDONO SUBLICENCIA" 
                                     class="btn_peque"
                                     style="font-size: 12px; float: left"
                                     actionListener="#{abandonoSubLicBean.prepararNuevo}"
                                     update="allform:dlgNuevaT allform:frmNuevaT:datosNuevaT allform:frmNuevaT:guardarBtn"
                                     oncomplete="if(args.doit){PF('dlgNuevaT').show()};" process="@this" rendered="#{!loginBean.lectura}"/>
                    <p:tabView style="font-size: 12px; margin: 0 auto; width: 50%">
                        <p:tab title="Búsqueda por Criterio" >
                            <p:outputLabel value="BUSCAR: " style="font-size: 13px; font-weight: bold; margin-right: 5px;"/>
                            <p:inputText id="buscarText" value="#{abandonoSubLicBean.criterio}" 
                                         style="font-size: 14px; margin-right: 5px; width: 40%" placeholder="Ingrese un criterio de búsqueda"
                                         title="Puede buscar por No. Solicitud, Denominación o Titular Actual"/>
                            <p:commandButton value="BUSCAR" actionListener="#{abandonoSubLicBean.buscarAbandonosLicencia}"
                                             update="allform:tablaDeAbandonos mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px"
                                             process="@parent" class="btn_peque"/>
                        </p:tab>
                        <p:tab title="Búsqueda por Fecha" >                            
                            <p:outputLabel value="DESDE:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{abandonoSubLicBean.fechaInicio}" label="Fecha Desde" style="font-size: 13px; margin-right: 5px;" 
                                        placeholder="Fecha Inicio de Búsqueda" navigator="true"/>
                            <p:outputLabel value="HASTA:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{abandonoSubLicBean.fechaFin}" label="Fecha Hasta" style="font-size: 13px; margin-right: 5px;"
                                        placeholder="Fecha Fin de Búsqueda" navigator="true"/>

                            <p:commandButton value="BUSCAR"  
                                             actionListener="#{abandonoSubLicBean.buscarAbandonosPorFecha}" 
                                             update="allform:tablaDeAbandonos mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px" class="btn_peque"
                                             process="@parent" title="Se busca por fecha de Presentación"/>                            
                        </p:tab>
                        <p:tab title="Búsqueda por Fecha Abandono" >                            
                            <p:outputLabel value="DESDE:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{abandonoSubLicBean.fechaInicioCertificado}" label="Fecha Desde" style="font-size: 13px; margin-right: 5px;" 
                                        placeholder="Fecha Inicio de Búsqueda" navigator="true"/>
                            <p:outputLabel value="HASTA:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{abandonoSubLicBean.fechaFinCertificado}" label="Fecha Hasta" style="font-size: 13px; margin-right: 5px;"
                                        placeholder="Fecha Fin de Búsqueda" navigator="true"/>

                            <p:commandButton value="BUSCAR"  
                                             actionListener="#{abandonoSubLicBean.buscarAbandonosPorFechaLicencia}" 
                                             update="allform:tablaDeAbandonos mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px" class="btn_peque"
                                             process="@parent" title="Se busca por fecha de Presentación"/>                            
                        </p:tab>
                    </p:tabView>

                    <div style="float: right; font-weight: bold; margin-top: -20px; border: solid green; padding: 3px" >CON NOTIFICACIÓN</div>

                    <p:commandButton value="PARA PRÓRROGA" actionListener="#{abandonoSubLicBean.prepararParaProrrogas}"
                                     update="mensajes dlgParaProrroga paraProForm"
                                     style="float: right; font-weight: bold; margin-top: 20px; margin-right: 5px;" class="btn_peque"
                                     oncomplete="if(args.proit){PF('dlgParaProrroga').show();}"
                                     title="Los trámites seleccionados pasan a PRÓRROGAS" rendered="#{!loginBean.lectura}"/>

                    <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()" />

                    <p:dialog widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                        <p:graphicImage name="/images/ajax-loader.gif" />
                    </p:dialog>
                    <p:outputLabel id="num_reg" value="#{abandonoSubLicBean.numRegistros}" style="float: left; font-size: 12px"/>
                    <br/>
                    <p:dataTable id="tablaDeAbandonos" var="abandono"
                                 value="#{abandonoSubLicBean.abandonos}" widgetVar="tablaDeAbandonos"
                                 emptyMessage="No hay Datos para mostrar"                                              
                                 filteredValue="#{abandonoSubLicBean.abandonosFiltradas}"
                                 binding="#{abandonoSubLicBean.abandonosDataTable}"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="20"
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 selection="#{abandonoSubLicBean.selectedAbandonos}"
                                 style="margin:3px auto; font-size: 9px !important;" 
                                 rowKey="#{abandono.id}">

                        <f:facet name="header">
                            <p:outputPanel>
                                <h:outputText value="BUSCAR EN RESULTADO: " />
                                <p:inputText id="globalFilter" onkeyup="PF('tablaDeAbandonos').filter()"
                                             style="width:300px" placeholder="Escriba aquí"/>
                            </p:outputPanel>
                        </f:facet>

                        <p:column selectionMode="multiple" style="width:16px;text-align:center" rendered="#{!loginBean.lectura}" exportable="false"/>

                        <p:column headerText="Solicitud" style="text-align: center;" filterBy="#{abandono.solicitud}" >
                            <h:outputText value="#{abandono.solicitud}" />
                        </p:column>
                        <p:column headerText="F. Presentación" style="text-align: center;" filterBy="#{abandono.fechaPresentacion}" >
                            <h:outputText value="#{abandono.fechaPresentacion}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Abandono" style="text-align: center;" filterBy="#{abandono.numeroAbandono}" >
                            <h:outputText value="#{abandono.numeroAbandono}" />
                        </p:column>
                        <p:column headerText="F. Abandono" style="text-align: center;" filterBy="#{abandono.fechaAbandono}" >
                            <h:outputText value="#{abandono.fechaAbandono}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>

                        <p:column  headerText="Notificación" style="text-align: center;" filterBy="#{abandono.notificacion}" filterMatchMode="contains">                            
                            <h:outputText value="#{abandono.notificacion}"/>
                        </p:column>

                        <p:column headerText="F. Notificacion" style="text-align: center;" filterBy="#{abandono.fechaNotificacion}" >
                            <h:outputText value="#{abandono.fechaNotificacion}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Registro" style="text-align: center; width: 13rem" filterBy="#{abandono.registro}" >
                            <h:outputText value="#{abandono.registro}" />
                        </p:column>
                        <p:column headerText="F. Registro" style="text-align: center;" filterBy="#{abandono.fechaRegistro}" >
                            <h:outputText value="#{abandono.fechaRegistro}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Denominación" style="text-align: center;" filterBy="#{abandono.denominacion}" >
                            <h:outputText value="#{abandono.denominacion}" />
                        </p:column>
                        <p:column headerText="signo" style="text-align: center;" filterBy="#{abandono.signo}" >
                            <h:outputText value="#{abandono.signo}" />
                        </p:column>                       
                        <p:column headerText="SubLicenciante" style="text-align: center;" filterBy="#{abandono.sublicenciante}" visible="false">
                            <h:outputText value="#{abandono.sublicenciante}" />
                        </p:column>
                        <p:column headerText="SubLicenciatario" style="text-align: center;" filterBy="#{abandono.sublicenciatario}" visible="false">
                            <h:outputText value="#{abandono.sublicenciatario}" />
                        </p:column>                        
                        <p:column headerText="Casillero Senadi" style="text-align: center;"  visible="false" >
                            <h:outputText value="#{abandono.casilleroSenadi}" />
                        </p:column>
                        <p:column headerText="Casillero Judicial" style="text-align: center;"  visible="false" >
                            <h:outputText value="#{abandono.casilleroJudicial}" />
                        </p:column>
                        <p:column headerText="Tipo Abandono" style="text-align: center;"   >
                            <h:outputText value="#{abandono.tipoAbandono}" />
                        </p:column>
                        <p:column headerText="Responsable" style="text-align: center;">
                            <h:outputText value="#{abandono.responsable}" />
                        </p:column>
                        <p:column id="editar" headerText="Acción"  exportable="false" style="margin: 0 auto; width: 115px;" 
                                  styleClass="#{abandono.abandonoNotificado eq true ?'border_green_color':null}">
                            <p:commandLink class="link"
                                           actionListener="#{abandonoSubLicBean.prepararEditar}"
                                           update="allform:dlgNuevaT allform:frmNuevaT:datosNuevaT allform:frmNuevaT:guardarBtn "
                                           oncomplete="if(args.peditar){PF('dlgNuevaT').show()};"
                                           process="@this"
                                           title="Editar" rendered="#{!loginBean.lectura}">
                                <i id="edit_action" class="material-icons md-18">edit</i>
                            </p:commandLink>
                            <p:commandLink class="link"
                                           actionListener="#{abandonoSubLicBean.prepararHistorial}"
                                           title="Seguimiento" process="@this"
                                           update="allform:dlgHistorial"
                                           oncomplete="PF('dlgHistorial').show();" rendered="#{!loginBean.lectura}">
                                <i id="history_action" class="material-icons md-18">history</i>                            
                            </p:commandLink>
                            <p:commandLink class="link" title="Descargar" 
                                           actionListener="#{abandonoSubLicBean.prepararDescarga}"
                                           process="@this" update="mensajes allform:dlgFechaNotificacion"
                                           oncomplete="if(args.doit){popupwindow('abansubreport', '_blank', args);}" 
                                           rendered="#{!loginBean.lectura}">
                                <i id="download_action" class="material-icons md-18">cloud_download</i>

                            </p:commandLink>

                            <p:commandLink class="link_remove" 
                                           actionListener="#{abandonoSubLicBean.eliminarAbandono}"
                                           update="allform:tablaDeAbandonos mensajes allform:num_registros allform:num_reg"
                                           title="Eliminar" process="@this" rendered="#{!loginBean.lectura}">
                                <i id="delete_action" class="material-icons md-18">delete</i>
                                <p:confirm header="CONFIRMAR" message="SEGURO DE ELIMINARE EL ABANDONO CON SOLICITUD: #{abandono.solicitud} ?"/> 
                            </p:commandLink>
                            <p:commandLink class="link" actionListener="#{abandonoSubLicBean.prepararViewRo}"
                                           update="allform:dlgRoshow mensajes"
                                           oncomplete="if(args.viewro){PF('dlgRoshow').show()};"
                                           process="@this"
                                           title="Visualizar ro" rendered="#{loginBean.lectura}">

                                <i class="pi pi-eye" style="font-size: 2rem"></i>
                            </p:commandLink>
                        </p:column>
                        <f:facet name="footer">
                            <!-- <p:selectBooleanCheckbox value="{abandonoLicenciaBean.separado}" itemLabel="Separados" rendered="{!loginBean.lectura}" /> -->
                            <p:commandButton process="tablaDeAbandonos" value="Descargar Seleccionados" 
                                             actionListener="#{abandonoSubLicBean.downloadSelected}" 
                                             update="mensajes" oncomplete="popupwindow('abansubreport', '_self', args);" 
                                             rendered="#{!loginBean.lectura}" class="btn_peque" />

                        </f:facet>
                    </p:dataTable>
                    <p:outputLabel id="num_registros" value="#{abandonoSubLicBean.numRegistros}" style="float: left; font-size: 12px"/>

                    <h:panelGrid columns="2" style="float: right;">
                        <h:commandLink title="Exportar a excel..." rendered="#{!loginBean.lectura}" immediate="true">
                            <p:graphicImage class="excel" width="20px" height="20px" library="images" name="excel.png"/>
                            <p:dataExporter type="xlsx" target="tablaDeAbandonos" fileName="#{abandonoSubLicBean.exportName}"/>
                        </h:commandLink>
                        <br/>
                    </h:panelGrid>
                    <br/>
                </p:panel>
            </h:panelGrid>

            <p:dialog id="dlgFechaNotificacion" modal="true" resizable="true"
                      header="#{abandonoSubLicBean.abandono.solicitud}" fitViewport="true"
                      widgetVar="dlgFechaNotificacion" style="font-size: 11px; margin-bottom: 10px" showEffect="clip" 
                      hideEffect="explode" closeOnEscape="true" width="30%">
                <p:ajax event="close" update="dlgFechaNotificacion" resetValues="true" />
                <p:growl id="fechareg" life="1000"/>
                <h:form id="frmFecha" >
                    <p:outputLabel value="¿DESEA REGISTRAR LA FECHA DE NOTIFICACIÓN, CON LA FECHA ACTUAL?"/>
                    <p:panelGrid class="noBorders" columns="2" style="float: right;" >                        
                        <p:commandButton value="SI" actionListener="#{abandonoSubLicBean.viewAbandonoSi}" process="@parent" style="float: right"
                                         oncomplete="popupwindow('licenciausor', '_blank', args);PF('dlgFechaNotificacion').hide();" 
                                         class="btn_peque" update="mensajes allform:tablaDeAbandonos"/>
                        <p:commandButton value="NO" actionListener="#{abandonoSubLicBean.viewAbandonoNo}" process="@this" style="float: right"
                                         oncomplete="popupwindow('licenciausor', '_blank', args);PF('dlgFechaNotificacion').hide();" update="mensajes"
                                         class="btn_peque"/>
                    </p:panelGrid>
                </h:form>
            </p:dialog>


            <p:dialog id="dlgRoshow" modal="true" resizable="true"
                      header="MOTIVO DE NOTIFICACIÓN - #{abandonoSubLicBean.abandono.solicitud}" fitViewport="true"
                      widgetVar="dlgRoshow" style="font-size: 11px; margin-bottom: 10px" showEffect="clip" 
                      hideEffect="explode" closeOnEscape="true" width="70%">
                <p:ajax event="close" update="dlgRoshow" resetValues="true" />
                <p:growl id="roreg" life="1000"/>
                <h:form id="frmRoshow" >
                    <p:panel>
                        <p:inputTextarea value="#{abandonoSubLicBean.roshow}" readonly="true" style="width: 100%"/>
                    </p:panel>
                </h:form>
            </p:dialog>                        

            <p:dialog id="dlgParaProrroga" modal="true" resizable="true"
                      header="TRÁMITES SELECCIONADOS PARA PASAR A PRÓRROGA" fitViewport="true"
                      widgetVar="dlgParaProrroga" style="font-size: 11px; margin-bottom: 10px;" showEffect="clip"
                      hideEffect="explode" closeOnEscape="true" width="800px">
                <p:ajax event="close" update="dlgParaProrroga" resetValues="true" />
                <p:growl id="paraPro" life="1000"/>
                <h:form id="paraProForm" >
                    <p:panel style="margin: 0 auto; text-align: center;" styleClass="panelpara">
                        <p:outputLabel value="Los abandonos seleccionados pasarán inmediatamente a la pestaña 'PRÓRROGAS'. A partir de este momento se contabilizarán los días indicados y, una vez vencido el plazo, el sistema mostrará la alerta en dicha pestaña"
                                       style="font-size: 10px !important; text-align: center !important;"/>
                    </p:panel>
                    <p:dataTable id="tablaDeProrroga" var="prorroga"
                                 value="#{abandonoSubLicBean.selectedAbandonos}" widgetVar="tablaDeProrroga"
                                 emptyMessage="No hay Datos para mostrar"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="10"
                                 rowsPerPageTemplate="10,25,60,150,200,250,300"
                                 style="margin:3px auto; font-size: 9px !important; background: none">

                        <p:column headerText="Solicitud" style="text-align: center;" >
                            <h:outputText value="#{prorroga.solicitud}" />
                        </p:column>
                        <p:column headerText="Denominación" style="text-align: center;" >
                            <h:outputText value="#{prorroga.denominacion}" />
                        </p:column>
                        <p:column headerText="Abandono" style="text-align: center;" >
                            <h:outputText value="#{prorroga.numeroAbandono}" />
                        </p:column>
                        <p:column headerText="F. Abandono" style="text-align: center;" >
                            <h:outputText value="#{prorroga.fechaAbandono}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Escrito No. (Alcance)" style="text-align: center;" >
                            <p:inputText value="#{prorroga.numeroAlcance}" title="Número de escrito / alcance" style="width: 90%; text-transform: uppercase"/>
                        </p:column>
                        <p:column headerText="Fecha Escrito" style="text-align: center;" >
                            <p:calendar value="#{prorroga.fechaAlcance}" pattern="yyyy-MM-dd" navigator="true" mask="true" timeZone="GMT-5" title="Fecha del escrito / alcance"/>
                        </p:column>
                        <f:facet name="footer">
                            <p:outputPanel>
                                <h:outputText value="#{abandonoSubLicBean.selectedAbandonos.size()} Registros" style="font-size: 9px"/>
                            </p:outputPanel>
                        </f:facet>
                    </p:dataTable>
                    <p:panelGrid style="width:  100% !important" columns="2" columnClasses="thirty-percent, sixty-percent">
                        <p:outputLabel value="Días de Prórroga:" for="diasProrroga" style="float: right"/>
                        <p:inputText id="diasProrroga" value="#{abandonoSubLicBean.diasProrroga}" title="Días de Prórroga" class="maxsize" required="true">
                            <p:keyFilter mask="num" />
                        </p:inputText>
                    </p:panelGrid>

                    <p:commandButton value="CERRAR" class="btn_cerrar" onclick="PF('dlgParaProrroga').hide();" style="float: right;"/>
                    <p:commandButton value="PASAR A PRÓRROGA" actionListener="#{abandonoSubLicBean.paraProrrogas}"
                                     update="mensajes allform:tablaDeAbandonos allform:num_registros allform:num_reg diasProrroga" process="@form"
                                     style="float: right; font-weight: bold;" class="btn_buscar"
                                     oncomplete="if(args.proit){PF('dlgParaProrroga').hide();}">
                        <p:confirm header="CONFIRMAR" message="SEGURO DE PASAR LOS ABANDONOS SELECCIONADOS A PRÓRROGA ?"/>
                    </p:commandButton>

                </h:form>
            </p:dialog>

            <p:dialog id="dlgNuevaT" modal="true" resizable="true" styleClass="dlgFormNice dlg-sublic"
                      header="#{abandonoSubLicBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgNuevaT" style="font-size: 11px; margin-bottom: 10px" showEffect="clip" 
                      hideEffect="explode" closeOnEscape="true" width="80%">
                <p:ajax event="close" update="dlgNuevaT" resetValues="true" />
                <p:growl id="nuevoreg" life="1000"/>
                <h:form id="frmNuevaT" >
                    <p:panelGrid columns="6" id="datosNuevaT" styleClass="showcase-text-align-center" style="width: 100%" 
                                 columnClasses="ten-percent,twenty-percent,ten-percent,twenty-percent,ten-percent,twenty-percent">

                        <p:outputLabel value="Solicitud:" for="solicitudForm"/>
                        <h:panelGroup>
                            <p:inputText id="solicitudForm" value="#{abandonoSubLicBean.abandono.solicitud}" title="Solicitud" required="true"

                        <p:outputLabel value="Notificación:" for="notificacionForm"/>

                                     required="true" class="maxsize">

                        </p:inputText>

                        <p:outputLabel value="F. Notificación:" for="fechaNotificacionForm"/>
                        <p:calendar id="fechaNotificacionForm"  value="#{abandonoSubLicBean.abandono.fechaNotificacion}" timeZone="GMT-5"

                        <p:outputLabel value="Registro:" for="registroForm"/>

                        <p:outputLabel value="F. Registro:" for="fregistroForm"/>
                        <p:calendar id="fregistroForm"  value="#{abandonoSubLicBean.abandono.fechaRegistro}" timeZone="GMT-5"
                                    mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha de Registro" inputStyleClass="maxsize"
                                    navigator="true"/>

                        <p:outputLabel value="Denominación:" for="denominacionForm"/>
                        <p:inputTextarea id="denominacionForm" value="#{abandonoSubLicBean.abandono.denominacion}" title="Denominación" 
                                         required="true" class="maxsize"/>

                        <p:outputLabel value="Signo:" for="signoForm"/>                            
                        <p:inputText id="signoForm" value="#{abandonoSubLicBean.abandono.signo}" title="Signo" required="true" class="maxsize"/>

                        <p:outputLabel value="F. Contrato:" for="fcontratoForm"/>
                        <p:calendar id="fcontratoForm"  value="#{abandonoSubLicBean.abandono.fechaContrato}" timeZone="GMT-5"
                                    mask="true" pattern="yyyy-MM-dd" title="Fecha Contrato" inputStyleClass="maxsize" navigator="true"/>

                        <p:outputLabel value="F. Vence Contrato:" for="fcontratovForm"/>
                        <p:calendar id="fcontratovForm"  value="#{abandonoSubLicBean.abandono.fechaVenceContrato}" timeZone="GMT-5"
                                    mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha Contrato" inputStyleClass="maxsize"
                                    navigator="true"/>

                        <p:outputLabel value="Pais:" for="paisForm"/>
                        <p:inputText id="paisForm" value="#{abandonoSubLicBean.abandono.t_pais}" title="País" 
                                     class="maxsize"/>

                        <p:outputLabel value="Ciudad:" for="ciudadForm"/>
                        <p:inputText id="ciudadForm" value="#{abandonoSubLicBean.abandono.t_ciudad}" title="Ciudad" 
                                     class="maxsize"/>

                        <p:outputLabel value="Tipo Vigen:" for="tipovForm"/>
                        <p:inputText id="tipovForm" value="#{abandonoSubLicBean.abandono.tipoVigen}" title="Tipo vigen" 
                                     class="maxsize"/>

                        <p:outputLabel value="Vigen:" for="vigenForm"/>
                        <p:inputText id="vigenForm" value="#{abandonoSubLicBean.abandono.vigen}" title="Vigen" 
                                     class="maxsize"/>

                        <p:outputLabel value="Tiempo:" for="tiempoForm"/>
                        <p:inputText id="tiempoForm" value="#{abandonoSubLicBean.abandono.tiempo}" title="Tiempo" 
                                     class="maxsize"/>

                        <p:outputLabel value="Sublicenciante" for="licencianteForm"/>
                        <p:inputTextarea id="licencianteForm" value="#{abandonoSubLicBean.abandono.sublicenciante}" title="Licenciante" 
                                         required="true" class="maxsize"/>

                        <p:outputLabel value="Sublicenciatario" for="licenciatarioForm"/>
                        <p:inputTextarea id="licenciatarioForm" value="#{abandonoSubLicBean.abandono.sublicenciatario}" title="SubLicenciatario" 
                                         required="true" class="maxsize"/>

                        <p:outputLabel value="Apoderado" for="apoderadoForm"/>
                        <p:inputTextarea id="apoderadoForm" value="#{abandonoSubLicBean.abandono.apoderadoRepresentante}" title="Apoderado" 
                                         required="true" class="maxsize"/>                      

                        <p:outputLabel value="Casillero SENADI:" for="casSenadiForm"/>
                        <p:panel class="noBorders" style="padding: 0 0 !important; border: none !important">
                            <p:inputText id="casSenadiForm" value="#{abandonoSubLicBean.abandono.casilleroSenadi}" title="Casillero SENADI" style="width: 80%"/>
                            <p:commandButton icon="pi pi-search" class="btn_peque" actionListener="#{abandonoSubLicBean.buscarCasillero}" 
                                             rendered="#{abandonoSubLicBean.dialogTitle eq 'NUEVO ABANDONO SUBLICENCIA'?false:true}" 
                                             process="@parent" update="casSenadiForm" style="width: 12%" title="BUSCAR CASILLERO"/>
                        </p:panel>                       

                        <p:outputLabel value="Comprobante:" for="comproForm"/>
                        <p:inputText id="comproForm" value="#{abandonoSubLicBean.abandono.comprobante}" title="comprobante" class="maxsize"/>

                        <p:outputLabel value="Responsable:" for="responsableForm"/>                            
                        <p:inputText id="responsableForm" value="#{abandonoSubLicBean.abandono.responsable}" title="Responsable" 
                                     class="maxsize" required="true" />

                        <p:outputLabel value="Tipo Abandono:" for="tipoAbandono"/>
                        <p:selectOneMenu id="tipoAbandono" value="#{abandonoSubLicBean.abandono.tipoAbandono}" class="maxsize" 
                                         required="#{(abandonoSubLicBean.saveEdit eq 'EDITAR') or (abandonoSubLicBean.dialogTitle eq 'NUEVO ABANDONO SUBLICENCIA')}">
                            <f:selectItem itemLabel="Seleccionar..." itemValue="" noSelectionOption="true"/>
                            <f:selectItem itemLabel="ERJAFE" itemValue="ERJAFE"/>
                            <f:selectItem itemLabel="REGLAMENTO" itemValue="REGLAMENTO"/>
                            <f:selectItem itemLabel="COA" itemValue="COA"/>
                        </p:selectOneMenu>                                                

                        <p:outputLabel value="M. Notificación: " for="rofor"/>
                        <p:commandLink id="rofor" value="M. de Notificación" actionListener="#{abandonoSubLicBean.prepararShowRo}" update="allform:dlgRo"
                                       oncomplete="if(args.viewro){PF('dlgRo').show()};" process="@this" style="color: #0089ec"
                                       disabled="#{abandonoSubLicBean.abandono.id eq null? true:false}" />

                        <p:outputLabel value="Url: " style="float: right !important"/>
                        <p:commandLink value="Ruta Expediente" actionListener="#{abandonoSubLicBean.prepararExpediente}" process="@this"
                                       disabled="#{abandonoSubLicBean.abandono.solicitud eq null? true:false}" style="color: blue"
                                       oncomplete="PF('dlgExpediente').show();" update="allform:dlgExpediente mensajes"/>

                    </p:panelGrid>
                    <p:outputLabel value="RO:" for="roForm"/>                            
                    <p:inputTextarea id="roForm" value="#{abandonoSubLicBean.abandono.ro}" title="RO" class="maxsize"/>
                    <br/><br/>
                    <p:panelGrid id="guardarBtn" columns="2" class="panel-bottom">
                        <p:outputLabel value="PASAR A: " class="float-right"
                                       rendered="#{abandonoSubLicBean.dialogTitle eq 'NUEVO ABANDONO SUBLICENCIA'?false:true}"/>
                        <p:selectOneMenu id="estadoRegistro" class="float-left"
                                         value="#{abandonoSubLicBean.estadoTemp}" rendered="#{abandonoSubLicBean.dialogTitle eq 'NUEVO ABANDONO SUBLICENCIA'?false:true}">
                            <f:selectItem itemLabel="Seleccionar..." itemValue="" noSelectionOption="true"/>
                            <f:selectItem itemLabel="NOTIFICADAS" itemValue="NOTIFICADAS"/>
                            <p:ajax event="itemSelect" update="mensajes frmNuevaT" listener="#{abandonoSubLicBean.onTipoAbandonoSelectedListener}" />
                        </p:selectOneMenu>
                    </p:panelGrid>
                    <p:commandButton value="CERRAR" oncomplete="PF('dlgNuevaT').hide();" process="@form" class="btn_cerrar float-right"/>
                    <p:commandButton value="#{abandonoSubLicBean.saveEdit}" actionListener="#{abandonoSubLicBean.guardarAbandono}"
                                     update="mensajes allform:tablaDeAbandonos datosNuevaT frmNuevaT"
                                     oncomplete="if(args.saved){PF('dlgNuevaT').hide();}"
                                     process="@form" class="btn_buscar float-right">
                        <p:confirm header="Seguridad" message="#{abandonoSubLicBean.mensajeConfirmacion}" />
                    </p:commandButton>
                </h:form>
            </p:dialog>

            <p:dialog id="dlgExpediente" modal="true" resizable="true"
                      header="#{abandonoSubLicBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgExpediente" style="font-size: 11px;" showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true" width="50%">
                <p:ajax event="close" update="dlgExpediente" resetValues="true" />                
                <h:form id="frmExpediente" >
                    <p:dataTable id="tablaDeArchivos" var="archivo"
                                 value="#{abandonoSubLicBean.archivos}" widgetVar="tablaDeArchivos"
                                 emptyMessage="No hay Datos para mostrar"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="20"
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 style="border: black !important" >
                        <p:column headerText="Archivos" style="text-align: center;" filterBy="#{archivo}" >
                            <p:commandLink value="#{archivo.nombre}" style="color: #0089ec; font-size: 14px;"
                                           onclick="otherpage('https://registro.propiedadintelectual.gob.ec/solicitudes/media/files/renewal_forms/#{abandonoSubLicBean.abandono.idRenewalForm}/#{archivo.documento}')"  
                                           />
                        </p:column>
                    </p:dataTable>
                </h:form>
            </p:dialog>

            <p:dialog id="dlgRo" modal="true" resizable="true"
                      header="RO #{abandonoSubLicBean.abandono.solicitud}" fitViewport="true"
                      widgetVar="dlgRo" style="font-size: 11px;" showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true" width="75%">
                <p:ajax event="close" update="dlgRo" resetValues="true" />                
                <h:form id="frmRo" >
                    <div style="text-align:  center; margin: 0 auto;">
                        <p:outputLabel value="RO:" for="roselone" style="width: 5%;"/>
                        <p:selectOneMenu id="roselone" value="#{abandonoSubLicBean.roChoose}" style="width: 95%;" title="RO" disabled="#{abandonoSubLicBean.roselectable}" >
                            <f:selectItem itemLabel="Seleccionar..." itemValue="" noSelectionOption="true"/>
                            <f:selectItems value="#{abandonoSubLicBean.roRazones}" class="inputM"/>
                        </p:selectOneMenu>
                        <p:selectBooleanCheckbox itemLabel="Otro:" value="#{abandonoSubLicBean.roselectable}"  style="width: 7%;">
                            <p:ajax update="mensajes otroro roselone" listener="#{abandonoSubLicBean.validaSeleccion}"/>
                        </p:selectBooleanCheckbox>
                        <p:inputText id="otroro" value="#{abandonoSubLicBean.razon}" style="width: 93%;" disabled="#{!abandonoSubLicBean.roselectable}"/>

                        <p:commandButton style="margin-top: 5px;" actionListener="#{abandonoSubLicBean.agregarRo}" title="Agregar ro al trámite #{abandonoSubLicBean.abandono.solicitud}"
                                         update="mensajes tablaDeRo" process="@parent" icon="pi pi-arrow-down" class="btn_peque"/> 

                        <div style="background: cornflowerblue  !important; padding: 0.1px !important; margin-top: 5px;">

                            <p:dataTable id="tablaDeRo" var="ro"
                                         value="#{abandonoSubLicBean.roos}" widgetVar="tablaDeRo"
                                         emptyMessage="No hay Datos para mostrar"
                                         binding="#{abandonoSubLicBean.roDataTable}"
                                         style="margin:3px auto; font-size: 9px !important; " 
                                         rowKey="#{ro.id}">

                                <p:column headerText="Ro" style="text-align: center; width: 90%"  >
                                    <h:outputText value="#{ro.ro}" style="font-size: 12px; font-weight: bold"/>
                                </p:column>

                                <p:column id="removero" headerText="Acción"  exportable="false" style="text-align: center;" >
                                    <p:commandLink class="link_remove" actionListener="#{abandonoSubLicBean.eliminarRo}"
                                                   update="mensajes tablaDeRo" title="Eliminar Ro" process="@this" >
                                        <i id="delete_action" class="material-icons md-18">delete</i>
                                        <p:confirm header="CONFIRMAR" message="SEGURO DE ELIMINAR EL RO SELECCIONADO?"/> 
                                    </p:commandLink>
                                </p:column>
                            </p:dataTable>
                        </div>
                        <br/>
                        <p:commandButton value="CERRAR" class="btn_peque" onclick="PF('dlgRo').hide();" style="float: right"/>
                    </div>

                </h:form>

            </p:dialog>

            <p:dialog id="dlgHistorial" modal="true" resizable="true"
                      header="#{abandonoSubLicBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgHistorial" style="font-size: 11px;" showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true">
                <p:ajax event="close" update="dlgHistorial" resetValues="true" />                
                <h:form id="frmHistory" >
                    <p:inputTextarea id='historialText' value="#{abandonoSubLicBean.historial}" rows="10" cols="160" readonly="true" style="width: 100%"/>
                </h:form>
            </p:dialog>            

            <p:confirmDialog global="true" showEffect="explode" hideEffect="explode">
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes btn_peque" update="renovacionForm:tablaDeAbandonos"/>
                <p:commandButton value="No" type="button"  styleClass="ui-confirmdialog-no btn_peque"/>
            </p:confirmDialog>

            <br/>
        </h:form>

        <div id="footer"></div>

        <p:idleMonitor timeout="#{1000*60*60}" id="idleSesion">
            <p:ajax event="idle" listener="#{idleMonitorCtrl.idleListener}"
                    oncomplete="PF('idleDialog').show()" />
        </p:idleMonitor>
        <p:dialog header="Sesión Caducada" resizable="false"
                  widgetVar="idleDialog" modal="true" closable="false" style="font-size: 12px">
            <h:form id="sesionCaducaForm">
                <div class="titlePage">
                    <h:outputText value="Sesión Caducada " />
                    <p:commandButton styleClass="nav-link js-scroll-trigger"
                                     actionListener="#{loginBean.logout}"
                                     oncomplete="logout(xhr, status, args)"
                                     value="ACEPTAR" immediate="true" style="font-size: 12px"/>
                </div>
            </h:form>
        </p:dialog>


        <!-- JavaScript libs are placed at the end of the document so the pages load faster -->

        <!-- <script src="resources/assets/js/headroom.min.js"></script>
        <script src="resources/assets/js/jQuery.headroom.min.js"></script>
        <script src="resources/assets/js/template.js"></script> -->


    </h:body>
    <script type="text/javascript">
        $(document).ready(function () {
            setTimeout(function () {
                $('body').addClass('loaded');
                $('h1').css('color', '#222222');
                $("#footer").load("footer.html");
            }, 150);
            $("#menuside").load("menusidebar.html", function () {
                jQuery('#aba_sub').addClass('activomenu');
                jQuery('#sublicentitul').removeClass('sideinactivo').addClass('sideactivo');
            });
        });

        function getIdIndex(idName) {
            var doc = document.forms['allform'];
            var i;
            var idResult = 0;
            for (i = 0; doc.length > i; i++) {
                if (doc[i].id.includes(idName)) {
                    idResult = i;
                    console.log(doc[i].id);
                    break;
                }
            }
            return idResult;
        }

        //<![CDATA[
        function popupwindow(url, title, args) {
            if (args.doit) {
                window.open(url, title);
            }
        }
        function otherpage(url) {
            setTimeout(function () {
                window.open(url, '_blank');
            }, 0);
        }
        function logout(xhr, status, args) {
            setTimeout(function () {
                window.location = 'login.xhtml';
            }, 500);
        }
        //]]>
    </script>
