<!DOCTYPE html>
<html xmlns="http://www.w3c.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:x="http://xpert.com/faces">
    <h:head>
        <meta charset="utf-8" />
        <meta name="viewport"    content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="" />

        <title>DESISTIMIENTO-CN</title>

        <link rel="shortcut icon" type="image/png" href="#{resource['images/favicon.png']}" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>

        <link rel="stylesheet" media="screen" href="http://fonts.googleapis.com/css?family=Open+Sans:300,400,700" />
        <link href="resources/assets/css/bootstrap.min.css" rel="stylesheet" />
        <link href="resources/assets/css/font-awesome.min.css" rel="stylesheet" />

        <!-- Custom styles for our template -->
        <link href="resources/assets/css/bootstrap-theme.css" rel="stylesheet" />
        <link href="resources/assets/css/main.css" rel="stylesheet" />
        <!-- My own style css -->
        <link href="resources/assets/css/style.css" rel="stylesheet" />
    </h:head>
    <h:body>
        <!-- Start Page Loading -->
        <div id="loader-wrapper">
            <div id="loader"></div>        
            <div class="loader-section section-left"></div>
            <div class="loader-section section-right"></div>
        </div>
        <p:growl id="mensajes" showDetail="true" life="2000"/>
        <h:form id="allform" enctype="multipart/form-data" style=" background: #e3e3e3; min-height: calc(100vh - 424px);">
            <div class="menu">
                <a href="#" class="logo"  title="Logo Senadi" ><img src="resources/images/sena_2.png" width="161px"/></a>

                <i id="edit_action" class="material-icons prefix" style="color: white; margin-left: 20px; display: inline-block">person</i>    

                <p:outputLabel value="#{loginBean.nombre}" style="color: white; font-size: 18px" />


                <div style="float: right; display: inline-block; margin-top: 5px">
                    <p:commandLink styleClass="btn_logout" actionListener="#{loginBean.logout}"
                                   oncomplete="logout(xhr, status, args)"
                                   title="CERRAR SESIÓN" immediate="true">
                        <i class="material-icons" style="font-size: 30px; ">exit_to_app</i>
                    </p:commandLink>
                </div>
                <a class="itemm" href="settings.xhtml" title="Configuración" style="display:  #{loginBean.lectura eq true?'none':'inline-block'}"><i class="material-icons" >settings</i></a>
                <a class="itemm" href="abandonocn.xhtml" title="Abandono" >ABANDONO</a>
                <a class="itemm" href="caducadacn.xhtml" title="Caducadas" >CADUCADAS - NEGADAS</a> 
                <a class="activo" href="#" title="Desistimientos" >DESISTIDAS</a> 
                <a class="itemm" href="notificadacn.xhtml" title="Notificaciones" >NOTIFICADAS</a> 
                <a class="itemm" href="certificadocn.xhtml" title="Certificado Cambio Nombre" >CERTIFICADO C. NOMBRE</a>
            </div>
            <div class="card" style="margin-top: 20%; position: absolute;">
                <br/>
                <p:sidebar widgetVar="sidebar1" style="z-index: 999 !important; width: 22%; background: #E8F5E9; overflow: scroll">
                    <div id="menuside"></div>
                </p:sidebar>
                <p:commandButton icon="pi pi-arrow-right" type="button" onclick="PF('sidebar1').show()" styleClass="mr-2 " class="btn_sidebar"
                                 style="position: fixed; z-index: 999; background-color: #d30039 !important;"/>
            </div>
            <br/>
            <h:panelGrid columns="1"  style="text-align: center; font-size: 16px; font-weight: bold; margin: 0 auto; width: 97%;">
                <p:panel class="panelContent" >
                    <p:commandButton id="nuevo_registro" value="NUEVO DESISTIMIENTO C. NOMBRE" 
                                     class="btn_peque"
                                     style="font-size: 12px; float: left"
                                     actionListener="#{desistidacnBean.prepararNuevo}"
                                     update="allform:dlgNuevaT allform:frmNuevaT:datosNuevaT allform:frmNuevaT:guardarBtn"
                                     oncomplete="if(args.doit){PF('dlgNuevaT').show()};" process="@this" rendered="#{!loginBean.lectura}"/>
                    <p:tabView style="font-size: 12px; margin: 0 auto; width: 50%" >
                        <p:tab title="Búsqueda por Criterio" >
                            <p:outputLabel value="BUSCAR: " style="font-size: 13px; font-weight: bold; margin-right: 5px;"/>
                            <p:inputText id="buscarText" value="#{desistidacnBean.criterio}" 
                                         style="font-size: 14px; margin-right: 5px; width: 40%" placeholder="Ingrese un criterio de búsqueda"
                                         title="Puede buscar por No. Solicitud, Denominación o Titular Actual"/>
                            <p:commandButton value="BUSCAR" actionListener="#{desistidacnBean.buscarDesistimiento}"
                                             update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px"
                                             process="@parent" class="btn_peque"/>
                        </p:tab>
                        <p:tab title="Búsqueda por Fecha" >                            
                            <p:outputLabel value="DESDE:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{desistidacnBean.fechaInicio}" label="Fecha Desde" style="font-size: 13px; margin-right: 5px;" 
                                        placeholder="Fecha Inicio de Búsqueda" navigator="true"/>
                            <p:outputLabel value="HASTA:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{desistidacnBean.fechaFin}" label="Fecha Hasta" style="font-size: 13px; margin-right: 5px;"
                                        placeholder="Fecha Fin de Búsqueda" navigator="true"/>

                            <p:commandButton value="BUSCAR"  
                                             actionListener="#{desistidacnBean.buscarDesistimientosPorFecha}" 
                                             update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px"
                                             process="@parent" title="Se busca por fecha de Presentación" class="btn_peque"/>                            
                        </p:tab>
                    </p:tabView>
                    <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()" />

                    <p:dialog widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                        <p:graphicImage name="/images/ajax-loader.gif" />
                    </p:dialog>
                    <p:outputLabel id="num_reg" value="#{desistidacnBean.numRegistros}" style="float: left; font-size: 12px"/>
                    <br/>
                    <p:dataTable id="tablaDeDatos" var="desistida"
                                 value="#{desistidacnBean.desistimientos}" widgetVar="tablaDeResoluciones"
                                 emptyMessage="No hay Datos para mostrar"                                              
                                 filteredValue="#{desistidacnBean.desistimientosFiltradas}"
                                 binding="#{desistidacnBean.desistimientoDataTable}"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="20" selectionMode="single" rowKey="#{desistida.id}"
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 style="margin:3px auto; font-size: 9px !important;" >

                        <f:facet name="header">
                            <p:outputPanel>
                                <h:outputText value="BUSCAR EN RESULTADO: " />
                                <p:inputText id="globalFilter" onkeyup="PF('tablaDeResoluciones').filter()"
                                             style="width:300px" placeholder="Escriba aquí"/>
                            </p:outputPanel>
                        </f:facet>
                        <p:column headerText="Solicitud" style="text-align: center;" filterBy="#{desistida.solicitud}" >
                            <h:outputText value="#{desistida.solicitud}" />
                        </p:column>
                        <p:column headerText="F. Presentación" style="text-align: center;" filterBy="#{desistida.fechaPresentacion}" >
                            <h:outputText value="#{desistida.fechaPresentacion}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Resolución" style="text-align: center;" filterBy="#{desistida.resolucionDesistida}" >
                            <h:outputText value="#{desistida.resolucionDesistida}" />
                        </p:column>
                        <p:column headerText="F. Resolución" style="text-align: center;" filterBy="#{desistida.fechaResolucionDesistida}" >
                            <h:outputText value="#{desistida.fechaResolucionDesistida}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Título" style="text-align: center; width: 13rem" filterBy="#{desistida.registro}" >
                            <h:outputText value="#{desistida.registro}" />
                        </p:column>
                        <p:column headerText="F. Título" style="text-align: center;" filterBy="#{desistida.fechaRegistro}" >
                            <h:outputText value="#{desistida.fechaRegistro}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Denominación" style="text-align: center;" filterBy="#{desistida.denominacion}" >
                            <h:outputText value="#{desistida.denominacion}" />
                        </p:column>
                        <p:column headerText="signo" style="text-align: center;" filterBy="#{desistida.signo}" >
                            <h:outputText value="#{desistida.signo}" />
                        </p:column>                       
                        <p:column headerText="T. Anterior" style="text-align: center;" filterBy="#{desistida.titularAnterior}" >
                            <h:outputText value="#{desistida.titularAnterior}" />
                        </p:column>
                        <p:column headerText="T. Actual" style="text-align: center;" filterBy="#{desistida.titularActual}" >
                            <h:outputText value="#{desistida.titularActual}" />
                        </p:column>
                        <p:column headerText="Responsable" style="text-align: center;">
                            <h:outputText value="#{desistida.responsable}" />
                        </p:column>
                        <p:column id="editar" headerText="Acción"  exportable="false" style="margin: 0 auto; width: 150px;" rendered="#{!loginBean.lectura}">                            
                            <p:commandLink class="link"
                                           actionListener="#{desistidacnBean.prepararEditar}"
                                           update="allform:dlgNuevaT allform:frmNuevaT:datosNuevaT allform:frmNuevaT:guardarBtn "
                                           oncomplete="if(args.peditar){PF('dlgNuevaT').show()};"
                                           process="@this"
                                           title="Editar" >
                                <i id="edit_action" class="material-icons md-18">edit</i>
                            </p:commandLink>
                            <p:commandLink class="link"
                                           actionListener="#{desistidacnBean.prepararHistorial}"
                                           title="Seguimiento" process="@this"
                                           update="allform:dlgHistorial"
                                           oncomplete="PF('dlgHistorial').show();">
                                <i id="history_action" class="material-icons md-18">history</i>                            
                            </p:commandLink>
                            <p:commandLink class="link" title="Descargar"
                                           actionListener="#{desistidacnBean.viewDesistimiento}"
                                           process="@this"                                       
                                           oncomplete="popupwindow('repdes', '_blank', args);" >
                                <i id="download_action" class="material-icons md-18">cloud_download</i>                            
                            </p:commandLink>

                            <p:commandLink class="link_remove" 
                                           actionListener="#{desistidacnBean.eliminarDesistimiento}"
                                           update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                           title="Eliminar" process="@this" >
                                <i id="delete_action" class="material-icons md-18">delete</i>
                                <p:confirm header="CONFIRMAR" message="SEGURO DE ELIMINAR EL DESISTIMIENTO CON SOLICITUD: #{desistida.solicitud} ?"/> 
                            </p:commandLink>
                        </p:column>

                    </p:dataTable>
                    <p:outputLabel id="num_registros" value="#{desistidacnBean.numRegistros}" style="float: left; font-size: 12px"/>
                    <h:panelGrid columns="2" style="float: right;">
                        <h:commandLink title="Exportar a excel..." rendered="#{!loginBean.lectura}" immediate="true">
                            <p:graphicImage class="excel" width="20px" height="20px" library="images" name="excel.png"/>
                            <p:dataExporter type="xls" target="tablaDeDatos" fileName="#{desistidacnBean.exportName}" />
                        </h:commandLink>
                        <br/>
                    </h:panelGrid>
                    <br/>
                </p:panel>
            </h:panelGrid>

            <p:dialog id="dlgNuevaT" modal="true" resizable="true"
                      header="#{desistidacnBean.dialogTitle}" fitViewport="true" width="80%"
                      widgetVar="dlgNuevaT" style="font-size: 11px; margin-bottom: 10px" showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true">
                <p:ajax event="close" update="dlgNuevaT" resetValues="true" />
                <p:growl id="nuevoreg" life="1000"/>
                <h:form id="frmNuevaT" >
                    <p:panelGrid columns="6" id="datosNuevaT" styleClass="showcase-text-align-center" style="width: 100%"
                                 columnClasses="ten-percent,twenty-percent,ten-percent,twenty-percent,ten-percent,twenty-percent">

                        <p:outputLabel value="Solicitud:" for="solicitudForm"/>

                        <h:panelGroup>
                            <p:inputText id="solicitudForm" value="#{desistidacnBean.desistimiento.solicitud}" title="Solicitud" required="true" 
                                         style="background: #aed581 !important; width: 85%; text-transform: uppercase"/>
                            <p:commandButton icon="pi pi-search" class="btn_peque" style="position: absolute;" actionListener="#{desistidacnBean.buscarTramite}"
                                             rendered="#{desistidacnBean.dialogTitle eq 'NUEVO DESISTIMIENTO CAMBIO DE NOMBRE'?true:false}" process="@parent" update="mensajes frmNuevaT:datosNuevaT"/>
                        </h:panelGroup>

                        <p:outputLabel value="F. Solicitud" for="fpresentacionForm"/>                            
                        <p:calendar id="fpresentacionForm"  value="#{desistidacnBean.desistimiento.fechaPresentacion}" timeZone="GMT-5"
                                    mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha de Solicitud" navigator="true"/>

                        <p:outputLabel value="Resolución:" for="resolucionForm"/>
                        <p:inputText id="resolucionForm" value="#{desistidacnBean.desistimiento.resolucionDesistida}" title="Resolución" required="true" 
                                     style="background: #FFCDD2 !important;">
                            <p:keyFilter mask="num" />
                        </p:inputText>

                        <p:outputLabel value="F. Resolución:" for="fresolucionForm"/>                            
                        <p:calendar id="fresolucionForm"  value="#{desistidacnBean.desistimiento.fechaResolucionDesistida}" timeZone="GMT-5"
                                    mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha de Resolución" navigator="true"/>

                        <p:outputLabel value="Título:" for="registroForm"/>                            
                        <p:inputText id="registroForm" value="#{desistidacnBean.desistimiento.registro}" title="Registro" required="true" />

                        <p:outputLabel value="F. Título:" for="fregistroForm"/>                  
                        <p:calendar id="fregistroForm"  value="#{desistidacnBean.desistimiento.fechaRegistro}" timeZone="GMT-5"
                                    mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha de Registro" navigator="true"/>

                        <p:outputLabel value="F. Vencimiento:" for="fvencForm"/>
                        <p:calendar id="fvencForm"  value="#{desistidacnBean.desistimiento.fechaVenceRegistro}" timeZone="GMT-5"
                                    mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha Vence Registro" navigator="true"/>

                        <p:outputLabel value="Denominación:" for="denominacionForm"/>                            
                        <p:inputTextarea id="denominacionForm" value="#{desistidacnBean.desistimiento.denominacion}" title="Denominación" required="true" />

                        <p:outputLabel value="Signo:" for="signoForm"/>                            
                        <p:inputText id="signoForm" value="#{desistidacnBean.desistimiento.signo}" title="Signo" required="true" />

                        <p:outputLabel value="Titular Anterior:" for="tanteriorForm"/>                            
                        <p:inputTextarea id="tanteriorForm" value="#{desistidacnBean.desistimiento.titularAnterior}" title="Titular Anterior" required="true" />

                        <p:outputLabel value="Titular Actual:" for="tactualForm"/>                            
                        <p:inputTextarea id="tactualForm" value="#{desistidacnBean.desistimiento.titularActual}" title="Titular Actual" required="true" />                           

                        <p:outputLabel value="Abogado Patrocinador:" for="aporeplegalForm"/>                            
                        <p:inputTextarea id="aporeplegalForm" value="#{desistidacnBean.desistimiento.apeApodRepre}" title="Abogadp Patrocinador" required="true" />

                        <p:outputLabel value="Casillero SENADI:" for="casSenadiForm"/>                            
                        <p:inputText id="casSenadiForm" value="#{desistidacnBean.desistimiento.casilleroSenadi}" title="Casillero SENADI" />

                        <p:outputLabel value="Casillero JUDICIAL:" for="casJudicialForm"/>                            
                        <p:inputText id="casJudicialForm" value="#{desistidacnBean.desistimiento.casilleroJudicial}" title="Casillero Judicial" />

                        <p:outputLabel value="RO:" for="roForm"/>                            
                        <p:inputText id="roForm" value="#{desistidacnBean.desistimiento.ro}" title="RO"/>

                        <p:outputLabel value="Responsable:" for="responsableForm"/>                            
                        <p:inputText id="responsableForm" value="#{desistidacnBean.desistimiento.responsable}" title="Responsable"/>

                        <p:outputLabel value="Identificación:" for="identificacionForm"/>                            
                        <p:inputText id="identificacionForm" value="#{desistidacnBean.desistimiento.identificacion}" title="Identificación"/>

                        <p:outputLabel value="Correo" for="emaForm"/>                            
                        <p:inputText id="emaForm" value="#{desistidacnBean.desistimiento.email}" title="Correo"/>

                        <p:outputLabel value="Observación" for="obsForm"/>                            
                        <p:inputText id="obsForm" value="#{desistidacnBean.desistimiento.observacion}" title="Observación"/>

                        <p:outputLabel value="Comprobante" for="comproForm"/>
                        <p:inputText id="comproForm" value="#{desistidacnBean.desistimiento.comprobante}" title="comprobante" class="maxsize"/>

                        <p:outputLabel value="Url: " style="float: right !important"/>
                        <p:commandLink value="Ruta Expediente" actionListener="#{desistidacnBean.prepararExpediente}" process="@this"
                                       disabled="#{desistidacnBean.desistimiento.solicitud eq null? true:false}" style="color: blue"
                                       oncomplete="PF('dlgExpediente').show();" update="allform:dlgExpediente mensajes"/>                        

                        <p:commandLink value="Ruta Casillero" onclick="otherpage('https://registro.propiedadintelectual.gob.ec/casilleros/media/files/#{desistidacnBean.desistimiento.casilleroSenadi}/')"  
                                       disabled="#{desistidacnBean.desistimiento.solicitud eq null? true:false}" style="color: #0089ec"/>

                    </p:panelGrid>
                    <p:panelGrid id="guardarBtn" columns="2" class="panel-bottom">                            
                        <p:outputLabel value="PASAR A: " class="float-right"
                                       rendered="#{desistidacnBean.dialogTitle eq 'NUEVO DESISTIMIENTO'?false:true}"/>
                        <p:selectOneMenu id="estadoRegistro" class="float-right"
                                         value="#{desistidacnBean.estadoTemp}" rendered="#{desistidacnBean.dialogTitle eq 'NUEVO DESISTIMIENTO'?false:true}">
                            <f:selectItem itemLabel="Seleccionar..." itemValue="" noSelectionOption="true"/>
                            <f:selectItem itemLabel="CERTIFICADO" itemValue="CERTIFICADO"/>
                            <f:selectItem itemLabel="NOTIFICADAS" itemValue="NOTIFICADA"/>
                            <f:selectItem itemLabel="CADUCADAS-NEGADAS" itemValue="CADUCADA"/>
                        </p:selectOneMenu>                        
                    </p:panelGrid>
                    <p:commandButton value="CERRAR" oncomplete="PF('dlgNuevaT').hide();" process="@form" class="btn_cerrar float-right"/>
                    <p:commandButton value="#{desistidacnBean.saveEdit}" actionListener="#{desistidacnBean.guardarDesistimiento}"
                                     update="mensajes allform:tablaDeDatos datosNuevaT"
                                     oncomplete="if(args.saved){PF('dlgNuevaT').hide();}"
                                     process="@form" class="btn_buscar float-right">
                        <p:confirm header="Seguridad" message="#{desistidacnBean.mensajeConfirmacion}" />
                    </p:commandButton>

                </h:form>
            </p:dialog>

            <p:dialog id="dlgExpediente" modal="true" resizable="true"
                      header="#{desistidacnBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgExpediente" style="font-size: 11px;" showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true" width="50%">
                <p:ajax event="close" update="dlgExpediente" resetValues="true" />                
                <h:form id="frmExpediente" >
                    <p:dataTable id="tablaDeArchivos" var="archivo"
                                 value="#{desistidacnBean.archivos}" widgetVar="tablaDeArchivos"
                                 emptyMessage="No hay Datos para mostrar"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="20"
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 style="border: black !important" >
                        <p:column headerText="Archivos" style="text-align: center;" filterBy="#{archivo}" >
                            <p:commandLink value="#{archivo.nombre}" style="color: #0089ec; font-size: 14px;"
                                           onclick="otherpage('https://registro.propiedadintelectual.gob.ec/solicitudes/media/files/renewal_forms/#{desistidacnBean.desistimiento.idRenewalForm}/#{archivo.documento}')"  
                                           />
                        </p:column>
                    </p:dataTable>
                </h:form>
            </p:dialog>

            <p:dialog id="dlgHistorial" modal="true" resizable="true"
                      header="#{desistidacnBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgHistorial" style="font-size: 11px; width: 200px" showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true">
                <p:ajax event="close" update="dlgHistorial" resetValues="true" />                
                <h:form id="frmHistory" >                    
                    <p:inputTextarea id='historialText' value="#{desistidacnBean.historial}" rows="10" cols="115" readonly="true"/>                    
                </h:form>                
            </p:dialog>

            <p:confirmDialog global="true" showEffect="explode" hideEffect="explode">
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes btn_peque" update="allform:tablaDeDatos"/>
                <p:commandButton value="No" type="button"  styleClass="ui-confirmdialog-no btn_peque"/>
            </p:confirmDialog>


            <br/>
        </h:form>

        <div id="footer"></div>

        <p:idleMonitor timeout="#{1000*60*60}" id="idleSesion">
            <p:ajax event="idle" listener="#{idleMonitorCtrl.idleListener}"
                    oncomplete="PF('idleDialog').show()" />
        </p:idleMonitor>
        <p:dialog header="Sesión Caducada" resizable="false"
                  widgetVar="idleDialog" modal="true" closable="false" style="font-size: 12px">
            <h:form id="sesionCaducaForm">
                <div class="titlePage">
                    <h:outputText value="Sesión Caducada " />
                    <p:commandButton styleClass="nav-link js-scroll-trigger"
                                     actionListener="#{loginBean.logout}"
                                     oncomplete="logout(xhr, status, args)"
                                     value="ACEPTAR" immediate="true" style="font-size: 12px"/>
                </div>
            </h:form>
        </p:dialog>


        <!-- JavaScript libs are placed at the end of the document so the pages load faster -->

        <!-- <script src="resources/assets/js/headroom.min.js"></script>
        <script src="resources/assets/js/jQuery.headroom.min.js"></script>
        <script src="resources/assets/js/template.js"></script> -->


    </h:body>
    <script type="text/javascript">
        $(document).ready(function () {
            setTimeout(function () {
                $('body').addClass('loaded');
                $('h1').css('color', '#222222');
                $("#footer").load("footer.html");
            }, 150);
            $("#menuside").load("menusidebar.html", function () {
                jQuery('#des_nom').addClass('activomenu');
