<!DOCTYPE html>
<html xmlns="http://www.w3c.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:x="http://xpert.com/faces">
    <h:head>
        <meta charset="utf-8" />
        <meta name="viewport"    content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="" />

        <title>ALCANCES</title>

        <link rel="shortcut icon" type="image/png" href="#{resource['images/favicon.png']}" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>

        <link rel="stylesheet" media="screen" href="http://fonts.googleapis.com/css?family=Open+Sans:300,400,700" />
        <link href="resources/assets/css/bootstrap.min.css" rel="stylesheet" />
        <link href="resources/assets/css/font-awesome.min.css" rel="stylesheet" />

        <!-- Custom styles for our template -->
        <link href="resources/assets/css/bootstrap-theme.css" rel="stylesheet" />
        <link href="resources/assets/css/main.css" rel="stylesheet" />
        <!-- My own style css -->
        <link href="resources/assets/css/style.css" rel="stylesheet" />
    </h:head>
    <h:body>
        <!-- Start Page Loading -->
        <div id="loader-wrapper">
            <div id="loader"></div>        
            <div class="loader-section section-left"></div>
            <div class="loader-section section-right"></div>
        </div>
        <p:growl id="mensajes" showDetail="true" life="3000"/>
        <h:form id="allform" enctype="multipart/form-data" style=" background: #e3e3e3; min-height: calc(100vh - 424px);">
            <div class="menu">
                <a href="#" class="logo"  title="Logo Senadi" ><img src="resources/images/sena_2.png" width="161px"/></a>

                <i id="edit_action" class="material-icons prefix" style="color: white; margin-left: 20px; display: inline-block">person</i>    

                <p:outputLabel value="#{loginBean.nombre}" style="color: white; font-size: 18px" />

                <div style="float: right; display: inline-block; margin-top: 5px">
                    <p:commandLink styleClass="btn_logout" actionListener="#{loginBean.logout}"
                                   oncomplete="logout(xhr, status, args)"
                                   title="CERRAR SESIÓN" immediate="true">
                        <i class="material-icons" style="font-size: 30px; ">exit_to_app</i>
                    </p:commandLink>
                </div>
                <a class="itemm" href="settings.xhtml" title="Configuración" style="display: #{loginBean.grupoActivo eq 'SC_CancelacionTitulos' or loginBean.lectura ? 'none':'inline-block'}"><i class="material-icons" >settings</i></a> 
                <a class="itemm" href="uplocert.xhtml" title="Upload Certificados" style="display: #{loginBean.grupoActivo eq 'SC_CancelacionTitulos' or loginBean.lectura ? 'none':'inline-block'}"><i class="material-icons" >upload</i></a>
                <a class="itemm" href="reportemod.xhtml" title="Reporte Modificaciones" >REPORTE MODIFICACIONES</a>
                <a class="itemm" href="cambiocasillero.xhtml" title="Cambio de Casillero" style="display: #{loginBean.grupoActivo eq 'SC_CancelacionTitulos' or loginBean.lectura ? 'none':'inline-block'}">CAMBIO DE CASILLERO</a>
                <a class="itemm" href="cancelacionti.xhtml" title="Cancelación títulos" >CANCELACIÓN DE TÍTULOS</a>
                <a class="activo" href="#" title="Alcances de Modificaciones" >ALCANCES</a>
            </div>
            <div class="card" style="margin-top: 20%; position: absolute;">
                <br/>
                <p:sidebar widgetVar="sidebar1" style="z-index: 999 !important; width: 22%; background: #E8F5E9; overflow: scroll">
                    <div id="menuside"></div>
                </p:sidebar>
                <p:commandButton icon="pi pi-arrow-right" type="button" onclick="PF('sidebar1').show()" styleClass="mr-2 " class="btn_sidebar"
                                 style="position: fixed; z-index: 999; background-color: #d30039 !important;"/>
            </div>
            <br/>
            <h:panelGrid columns="1"  style="text-align: center; font-size: 16px; font-weight: bold; margin: 0 auto; width: 70%;">
                <p:panel class="panelContent" >                    
                    <p:tabView style="font-size: 12px; margin: 0 auto; width: 50%">
                        <p:tab title="Búsqueda por Criterio" >
                            <p:outputLabel value="BUSCAR: " style="font-size: 13px; font-weight: bold; margin-right: 5px;"/>
                            <p:inputText id="buscarText" value="#{scopeBean.criterio}" 
                                         style="font-size: 14px; margin-right: 5px; width: 40%" placeholder="Ingrese un criterio de búsqueda"
                                         title="Puede buscar alcance y trámite afectado"/>
                            <p:commandButton value="BUSCAR" actionListener="#{scopeBean.buscarPorCriterio}"
                                             update="allform:tablaDeAlcances mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px"
                                             process="@parent" class="btn_peque"/>
                        </p:tab>
                        <p:tab title="Búsqueda por Fecha de Presentación" >                            
                            <p:outputLabel value="DESDE:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{scopeBean.fechaInicio}" label="Fecha Desde" style="font-size: 13px; margin-right: 5px;" 
                                        placeholder="Fecha Inicio de Búsqueda" navigator="true"/>
                            <p:outputLabel value="HASTA:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{scopeBean.fechaFin}" label="Fecha Hasta" style="font-size: 13px; margin-right: 5px;"
                                        placeholder="Fecha Fin de Búsqueda" navigator="true"/>

                            <p:commandButton value="BUSCAR"  
                                             actionListener="#{scopeBean.buscarPorFechaPresentacion}" 
                                             update="allform:tablaDeAlcances mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px" class="btn_peque"
                                             process="@parent" title="Se busca por fecha de Presentación"/>                            
                        </p:tab>                        
                    </p:tabView>

                    <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()" />

                    <p:dialog widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                        <p:graphicImage name="/images/ajax-loader.gif" />
                    </p:dialog>
                    <p:outputLabel id="num_reg" value="Registros Mostrados #{scopeBean.scopes.size()}" style="float: left; font-size: 12px"/>
                    <br/>
                    <p:dataTable id="tablaDeAlcances" var="scope"
                                 value="#{scopeBean.scopes}" widgetVar="tablaDeAlcances"
                                 emptyMessage="No hay Datos para mostrar"                                              
                                 filteredValue="#{scopeBean.scopesFilter}"
                                 binding="#{scopeBean.scopeDataTable}"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="20"
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 style="margin:3px auto; font-size: 9px !important;"
                                 rowKey="#{scope.id}"
                                 rowStyleClass="#{scope.attended?'greenMode':''}">
                        <f:facet name="header">
                            <p:outputPanel>
                                <h:outputText value="BUSCAR EN RESULTADO: " />
                                <p:inputText id="globalFilter" onkeyup="PF('tablaDeAlcances').filter()"
                                             style="width:300px" placeholder="Escriba aquí"/>
                            </p:outputPanel>
                        </f:facet>

                        <p:column headerText="Alcance" style="text-align: center;" filterBy="#{scope.scopeNumber}" >
                            <h:outputText value="#{scope.scopeNumber}" />
                        </p:column>
                        <p:column headerText="Trámite Afectado" style="text-align: center;" filterBy="#{scope.affectedApplicationNumber}" >
                            <h:outputText value="#{scope.affectedApplicationNumber}" />
                        </p:column>
                        <p:column headerText="Tipo" style="text-align: center;" filterBy="#{scope.modificationType}" >
                            <h:outputText value="#{scope.modificationType}" />
                        </p:column>
                        <p:column headerText="Fecha Creación" style="text-align: center;" filterBy="#{scope.createDate}" >
                            <h:outputText value="#{scope.createDate}" >
                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss" timeZone="America/Guayaquil"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Fecha de Presentación" style="text-align: center;" filterBy="#{scope.submissionDate}" >
                            <h:outputText value="#{scope.submissionDate}" >
                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss" timeZone="America/Guayaquil"/>
                            </h:outputText>
                        </p:column>

                        <p:column  headerText="Estado" style="text-align: center;" filterBy="#{scope.status}" filterMatchMode="contains">                            
                            <h:outputText value="#{scope.status}"/>
                        </p:column>

                        <p:column id="editar" headerText="Documentos"  exportable="false" style="margin: 0 auto; width: 115px;">                           
                            <p:commandLink class="linkdoit" title="ATENDER EL REGISTRO" 
                                           actionListener="#{scopeBean.putAttended}"
                                           process="@this" update="mensajes allform:dlgAtendido allform:frmAtendido " 
                                           oncomplete="if(args.viewat){PF('dlgAtendido').show();};" rendered="#{!scope.attended}">
                                <i class="pi pi-user-edit" style="font-size: 2rem"></i>
                            </p:commandLink>
                            <p:commandLink class="linkdoit" title="RAZÓN ATENDIDO" 
                                           actionListener="#{scopeBean.showAttended}" 
                                           process="@this" update="mensajes allform:dlgAtendido allform:frmAtendido " 
                                           oncomplete="if(args.viewat){PF('dlgAtendido').show();};" rendered="#{scope.attended}">
                                <i class="pi pi-chevron-circle-up" style="font-size: 2rem"></i>
                            </p:commandLink>
                            <p:commandLink class="linkdoit" title="VISUALIZAR ALCANCE #{scope.pathScope}" 
                                           actionListener="#{scopeBean.viewScope}"
                                           process="@this" update="mensajes" oncomplete="if(args.viewscope){otherpage(args.view)};"                   
                                           rendered="#{scope.status eq 'PREVIEW'?false:true}">
                                <i class="pi pi-file" style="font-size: 2rem"></i>
                            </p:commandLink>
                            <p:commandLink class="linkdoit" title="VISUALIZAR FORMULARIO"
                                           actionListener="#{scopeBean.viewFormulario}"
                                           process="@this" update="mensajes"
                                           oncomplete="if(args.viewform){otherpage(args.view)};">
                                <i class="pi pi-file-edit" style="font-size: 2rem"></i>
                            </p:commandLink>

                        </p:column>
                    </p:dataTable>
                    <h:panelGrid columns="2" style="float: right;">
                        <h:commandLink title="Exportar a excel..." rendered="#{!loginBean.lectura}" immediate="true">
                            <p:graphicImage class="excel" width="20px" height="20px" library="images" name="excel.png"/>
                            <p:dataExporter type="xlsx" target="tablaDeAlcances" fileName="alcances_modificaciones"/>
                        </h:commandLink>
                        <br/>
                    </h:panelGrid>
                    <div class="leyendaIconos" style="text-align: left; font-size: 11px; font-weight: normal; padding: 8px 4px; float: right">
                        <span style="font-weight: bold; margin-right: 10px;">LEYENDA:</span>
                        <span style="margin-right: 15px;">
                            <i class="pi pi-user-edit" style="font-size: 1.1rem; vertical-align: middle;"></i> Atender el registro
                        </span>
                        <span style="margin-right: 15px;">
                            <i class="pi pi-chevron-circle-up" style="font-size: 1.1rem; vertical-align: middle;"></i> Razón atendido
                        </span>
                        <span style="margin-right: 15px;">
                            <i class="pi pi-file" style="font-size: 1.1rem; vertical-align: middle;"></i> Visualizar alcance
                        </span>
                        <span style="margin-right: 15px;">
                            <i class="pi pi-file-edit" style="font-size: 1.1rem; vertical-align: middle;"></i> Visualizar formulario
                        </span>
                    </div>
                    <p:dialog id="dlgAtendido" modal="true" resizable="true"
                              header="ALCANCE #{scopeBean.scope.scopeNumber} DEL TRÁMITE #{scopeBean.scope.affectedApplicationNumber}" fitViewport="true"
                              widgetVar="dlgAtendido" style="font-size: 11px; margin-bottom: 10px" showEffect="explode" 
                              hideEffect="explode" closeOnEscape="true" width="50%">
                        <p:ajax event="close" update="dlgAtendido" resetValues="true" />
                        <p:growl id="nuevoreg" life="1000"/>
                        <h:form id="frmAtendido" >
                            <p:outputLabel value="#{scopeBean.labelAttended}" 
                                           style="text-align: left !important" for="atob"/>
                            <br/>
                            <p:inputTextarea id="atob" maxlength="255" value="#{scopeBean.scope.attendedObservation}" class="maxsize"
                                             required="true" disabled="#{scopeBean.scope.attended}"/>
                            <br/>
                            <br/>
                            <p:commandButton value="GUARDAR" class="btn_buscar" process="@form" actionListener="#{scopeBean.saveAttended}"
                                             update="mensajes allform:tablaDeAlcances @form" oncomplete="if(args.scopesa){PF('dlgAtendido').hide();}"
                                             rendered="#{!scopeBean.scope.attended}">
                                <p:confirm header="Seguridad" message="SEGURO DE GUARDAR COMO ATENDIDO?" />
                            </p:commandButton>
                            <p:commandButton value="CERRAR" oncomplete="PF('dlgAtendido').hide();" class="btn_cerrar"/>
                        </h:form>
                    </p:dialog>
                    <p:outputLabel id="num_registros" value="Registros Mostrados #{scopeBean.scopes.size()}" style="float: left; font-size: 12px"/>


                    <br/>
                </p:panel>
            </h:panelGrid>                       

            <p:confirmDialog global="true" showEffect="explode" hideEffect="explode">
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes btn_peque" update="renovacionForm:tablaDeAlcances"/>
                <p:commandButton value="No" type="button"  styleClass="ui-confirmdialog-no btn_peque"/>
            </p:confirmDialog>

            <br/>
        </h:form>

        <div id="footer"></div>

        <p:idleMonitor timeout="#{1000*60*60}" id="idleSesion">
            <p:ajax event="idle" listener="#{idleMonitorCtrl.idleListener}"
                    oncomplete="PF('idleDialog').show()" />
        </p:idleMonitor>
        <p:dialog header="Sesión Caducada" resizable="false"
                  widgetVar="idleDialog" modal="true" closable="false" style="font-size: 12px">
            <h:form id="sesionCaducaForm">
                <div class="titlePage">
                    <h:outputText value="Sesión Caducada " />
                    <p:commandButton styleClass="nav-link js-scroll-trigger"
                                     actionListener="#{loginBean.logout}"
                                     oncomplete="logout(xhr, status, args)"
                                     value="ACEPTAR" immediate="true" style="font-size: 12px"/>
                </div>
            </h:form>
        </p:dialog>


        <!-- JavaScript libs are placed at the end of the document so the pages load faster -->

        <!-- <script src="resources/assets/js/headroom.min.js"></script>
        <script src="resources/assets/js/jQuery.headroom.min.js"></script>
        <script src="resources/assets/js/template.js"></script> -->


    </h:body>
    <script type="text/javascript">
        $(document).ready(function () {
            setTimeout(function () {
                $('body').addClass('loaded');
                $('h1').css('color', '#222222');
                $("#footer").load("footer.html");
            }, 150);
            $("#menuside").load("menusidebar.html", function () {
                jQuery('#aba_lic').addClass('activomenu');
                jQuery('#licentitul').removeClass('sideinactivo').addClass('sideactivo');
            });
        });

        function getIdIndex(idName) {
            var doc = document.forms['allform'];
            var i;
            var idResult = 0;
            for (i = 0; doc.length > i; i++) {
                if (doc[i].id.includes(idName)) {
                    idResult = i;
                    console.log(doc[i].id);
                    break;
                }
            }
            return idResult;
        }

        //<![CDATA[
        function popupwindow(url, title, args) {
            if (args.doit) {
                window.open(url, title);
            }
        }
        function otherpage(url) {
            setTimeout(function () {
                window.open(url, '_blank');
            }, 0);
        }
        function logout(xhr, status, args) {
            setTimeout(function () {
                window.location = 'login.xhtml';
            }, 500);
        }
        //]]>
    </script>
</html>
