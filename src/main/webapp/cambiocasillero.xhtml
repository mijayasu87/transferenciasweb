<!DOCTYPE html>
<html xmlns="http://www.w3c.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:x="http://xpert.com/faces">
    <h:head>
        <meta charset="utf-8" />
        <meta name="viewport"    content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="" />

        <title>CAMBIO CASILLERO</title>

        <link rel="shortcut icon" type="image/png" href="#{resource['images/favicon.png']}" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>

        <link rel="stylesheet" media="screen" href="http://fonts.googleapis.com/css?family=Open+Sans:300,400,700" />
        <link href="resources/assets/css/bootstrap.min.css" rel="stylesheet" />
        <link href="resources/assets/css/font-awesome.min.css" rel="stylesheet" />

        <!-- Custom styles for our template -->
        <link href="resources/assets/css/bootstrap-theme.css" rel="stylesheet" />
        <link href="resources/assets/css/main.css" rel="stylesheet" />
        <!-- My own style css -->
        <link href="resources/assets/css/style.css" rel="stylesheet" />
        <meta http-equiv="Refresh" content="#{loginBean.lectura eq false ? '':(loginBean.grupoActivo eq 'SC_AnexosModificaciones' ? '0.1;url=uplocert.xhtml':'0.1;url=index.xhtml')}"/>
    </h:head>
    <h:body>
        <!-- Start Page Loading -->
        <div id="loader-wrapper">
            <div id="loader"></div>        
            <div class="loader-section section-left"></div>
            <div class="loader-section section-right"></div>
        </div>
        <p:growl id="mensajes" showDetail="true" life="4000"/>
        <h:form id="allform" enctype="multipart/form-data" style=" background: #e3e3e3; min-height: calc(100vh - 424px);">
            <div class="menu">
                <a href="#" class="logo"  title="Logo Senadi" ><img src="resources/images/sena_2.png" width="161px"/></a>

                <i id="edit_action" class="material-icons prefix" style="color: white; margin-left: 20px; display: inline-block">person</i>    

                <p:outputLabel value="#{loginBean.nombre}" style="color: white; font-size: 18px" />

                <div style="float: right; display: inline-block; margin-top: 5px">
                    <p:commandLink styleClass="btn_logout" actionListener="#{loginBean.logout}"
                                   oncomplete="logout(xhr, status, args)"
                                   title="CERRAR SESIÓN" immediate="true">
                        <i class="material-icons" style="font-size: 30px; ">exit_to_app</i>
                    </p:commandLink>
                </div>
                <a class="itemm" href="settings.xhtml" title="Configuración" ><i class="material-icons" >settings</i></a> 
                <a class="itemm" href="uplocert.xhtml" title="Upload Certificados" ><i class="material-icons" >upload</i></a>
                <a class="itemm" href="reportemod.xhtml" title="Reporte Modificaciones" >REPORTE MODIFICACIONES</a>
                <a class="activo" href="#" title="Cambio de Casillero" >CAMBIO DE CASILLERO</a>
                <a class="itemm" href="cancelacionti.xhtml" title="Cancelación títulos" >CANCELACIÓN DE TÍTULOS</a>
                <a class="itemm" href="alcancesmod.xhtml" title="Alcances de Modificaciones" >ALCANCES</a>

            </div>
            <div class="card" style="margin-top: 20%; position: absolute;">
                <br/>
                <p:sidebar widgetVar="sidebar1" style="z-index: 999 !important; width: 22%; background: #E8F5E9; overflow: scroll">
                    <div id="menuside"></div>
                </p:sidebar>
                <p:commandButton icon="pi pi-arrow-right" type="button" onclick="PF('sidebar1').show()" styleClass="mr-2 " class="btn_sidebar"
                                 style="position: fixed; z-index: 999; background-color: #d30039 !important;"/>
            </div>
            <br/>

            <p:panel style="text-align: center; margin: 0 auto; width: 75%" id="panelprin" rendered="#{!loginBean.lectura}" >
                <p:outputLabel value="Número de Trámite:"/>
                <p:inputText value="#{cambioCasilleroBean.numtramite}" placeholder="Ej: SENADI-2022-111111" style="text-transform: uppercase; width: 200px"/>
                <p:commandButton value="BUSCAR" actionListener="#{cambioCasilleroBean.buscarTramite}" process="@form"
                                 update="mensajes allform:panelprin allform:dlgCasillero btn_cambiar " class="btn_peque"/>

                <p:panelGrid columns="4" style="text-align: center; margin: 0 auto !important; width: 100%; border-style: solid; padding-bottom: 2px !important;" 
                             id="tramen" rendered="#{cambioCasilleroBean.busqueda}">
                    <p:outputLabel value="Trámite:"/>
                    <p:inputText value="#{cambioCasilleroBean.cambioCasillero.tramite}" readonly="true" class="maxsize"/>
                    <p:outputLabel value="Tipo: "/>
                    <p:inputText value="#{cambioCasilleroBean.cambioCasillero.tipoModificacion}" readonly="true" class="maxsize"/>
                    <p:outputLabel value="Estado: "/>
                    <p:inputText value="#{(cambioCasilleroBean.renewal.status != null and cambioCasilleroBean.renewal.status eq 'DELIVERED')?'PROCESO INICIADO':'NO INICIADO'}" readonly="true" class="maxsize"/>
                    <p:outputLabel value="Denominación: " for="denomcas"/>
                    <p:inputText id="denomcas" value="#{cambioCasilleroBean.cambioCasillero.denominacion}" class="maxsize" required="true"/>
                    <p:outputLabel value="Titular Casillero "/>
                    <p:inputText value="#{cambioCasilleroBean.cambioCasillero.titularCasilleroAnterior}" readonly="true" class="maxsize"/>                        
                    <p:outputLabel value="Correo: "/>
                    <p:inputText value="#{cambioCasilleroBean.cambioCasillero.correoTitularAnterior}" readonly="true" class="maxsize"/>                        
                    <p:outputLabel value="Casillero: "/>
                    <p:inputText value="#{cambioCasilleroBean.cambioCasillero.casilleroAnterior}" readonly="true" style="background: #aed581 !important; font-size: 16px !important; font-weight: bold" class="maxsize"/>

                </p:panelGrid>

                <div style="text-align: center !important; margin: 0 auto !important">                        
                    <p:panelGrid columns="4" style="text-align: center; margin: 0 auto !important; width: 100%; border-style: solid" id="asignpan"
                                 rendered="#{cambioCasilleroBean.busqueda}">
                        <p:outputLabel value="Asignar al Casillero: " for="casSenadiAcForm"/>
                        <h:panelGroup>
                            <p:inputText id="casSenadiAcForm" value="#{cambioCasilleroBean.cambioCasillero.nuevoCasillero}" title="Nuevo Casillero para el trámite #{configuracionBean.cambioCasillero.tramite}" 
                                         style="font-size: 16px !important; font-weight: bold; text-align: center !important; width: 70%" readonly="true">
                                <p:keyFilter mask="num" />
                            </p:inputText>
                            <p:commandButton icon="pi pi-search" class="btn_peque"  style="position: absolute;" title="Buscar Casillero"
                                             actionListener="#{cambioCasilleroBean.prepararBusquedaCasillero}" 
                                             oncomplete="if(args.casit){PF('dlgCasillero').show();}" process="@form" 
                                             update="mensajes allform:dlgCasillero tramen"/>
                        </h:panelGroup>

                        <p:outputLabel value="Titular Casillero: " for="titCasNuevoForm"/>
                        <p:inputText id="titCasNuevoForm" value="#{cambioCasilleroBean.cambioCasillero.titularCasilleroNuevo}" readonly="true" class="maxsize"/>

                        <p:outputLabel value="Correo: " for="correoNuevoForm"/>
                        <p:inputText id="correoNuevoForm" value="#{cambioCasilleroBean.cambioCasillero.correoTitularNuevo}" readonly="true" class="maxsize"/>

                        <p:outputLabel value="Visualizar Providencia: " />
                        <p:commandLink class="link" title="Providencia"
                                       actionListener="#{cambioCasilleroBean.viewProvidenciaCambioCasillero}"
                                       process="@this" disabled="#{cambioCasilleroBean.cambioCasillero.nuevoCasillero eq null?true:false}"
                                       update="mensajes allform:asignpan"
                                       oncomplete="popupwindow('cambiocas', '_blank', args);">
                            <i id="download_action" class="material-icons md-18">cloud_download</i>
                            <p:confirm header="VISUALIZAR PROVIDENCIA" message="SI ELIJE SI, SE ASIGNARÁ UN NÚMERO DE PROVIDENCIA AL DOCUMENTO, CONTINUAR?"/>
                        </p:commandLink>

                        <p:outputLabel value="Providencia: " for="providenciaForm"/>
                        <p:inputText id="providenciaForm" value="#{cambioCasilleroBean.cambioCasillero.providencia} - SENADI-#{cambioCasilleroBean.cambioCasillero.fechaProvidencia.year+1900}" readonly="true" class="maxsize"/>

                        <p:outputLabel value="Adjuntar Providencia Firmada: " />
                        <p:fileUpload skinSimple="true" mode="simple" label="ADJUNTAR PROVIDENCIA" accept=".pdf" update="mensajes"
                                      uploadLabel="SUBIR" value="#{cambioCasilleroBean.file}" title="ADJUNTE LA PROVIDENCIA FIRMADA"
                                      rendered="#{cambioCasilleroBean.cambioCasillero.providencia eq null?false:true}"/>

                    </p:panelGrid>
                </div>

                <p:commandButton value="CAMBIAR CASILLERO"  class="btn_buscar" style="float: right" id="btn_cambiar"
                                 action="#{cambioCasilleroBean.cambiarCasillero}" oncomplete="limpiarForm()" rendered="#{cambioCasilleroBean.busqueda}"
                                 update="mensajes allform:panelprin allform:paneltab allform:tablaDeCambios" process="@form" disabled="#{!cambioCasilleroBean.cambioc}" >

                    <p:confirm header="CONFIRMAR" rendered="#{cambioCasilleroBean.cambioCasillero.providencia eq null?false:true}"
                               message="#{cambioCasilleroBean.confirmChangeMessage}"/>

                </p:commandButton>
                <br/><br/>
            </p:panel>
            <br/>

            <p:panel style="text-align: center; margin: 0 auto; width: 90%" id="paneltab">
                <p:dataTable id="tablaDeCambios" var="cambio"
                             value="#{cambioCasilleroBean.cambiosCasillero}" widgetVar="tablaDeCambios"
                             emptyMessage="No hay Datos para mostrar"                                              
                             filteredValue="#{cambioCasilleroBean.cambiosCasilleroFiltrados}"
                             binding="#{cambioCasilleroBean.cambiosCasilleroDataTable}"
                             paginator="true"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             rows="20"
                             rowsPerPageTemplate="20,50,100,150,200,250,300"
                             style="border: black !important" >

                    <p:column headerText="Trámite" style="text-align: center;" filterBy="#{cambio.tramite}" >
                        <h:outputText value="#{cambio.tramite}" />
                    </p:column>

                    <p:column headerText="Denominación" style="text-align: center;" filterBy="#{cambio.denominacion}" >
                        <h:outputText value="#{cambio.denominacion}" />
                    </p:column>

                    <p:column headerText="Titular Anterior" style="text-align: center;" filterBy="#{cambio.titularCasilleroAnterior}" >
                        <h:outputText value="#{cambio.titularCasilleroAnterior}" />
                    </p:column>                            

                    <p:column headerText="Casillero Anterior" style="text-align: center;" filterBy="#{cambio.casilleroAnterior}" >
                        <h:outputText value="#{cambio.casilleroAnterior}" />
                    </p:column>

                    <p:column headerText="Titular Actual" style="text-align: center;" filterBy="#{cambio.titularCasilleroNuevo}" >
                        <h:outputText value="#{cambio.titularCasilleroNuevo}" />
                    </p:column>

                    <p:column headerText="Casillero Actual" style="text-align: center;" filterBy="#{cambio.nuevoCasillero}" >
                        <h:outputText value="#{cambio.nuevoCasillero}" />
                    </p:column>

                    <p:column headerText="Providencia" style="text-align: center;" filterBy="#{cambio.providencia}" >
                        <h:outputText value="#{cambio.providencia}" />
                    </p:column>

                    <p:column headerText="F. Providencia" style="text-align: center;" filterBy="#{cambio.fechaProvidencia}" >
                        <h:outputText value="#{cambio.fechaProvidencia}" >
                            <f:convertDateTime pattern="yyyy-MM-dd" />
                        </h:outputText>
                    </p:column>

                    <p:column  headerText="Documento" style="text-align: center;" >
                        <p:commandLink id="notlink"  style="color: #0089ec; font-size: 14px;" process="@this"
                                       title="Visualizar Providencia #{cambio.providencia}" actionListener="#{cambioCasilleroBean.validarProvidencia(cambio)}"
                                       oncomplete="if(args.viewdoc){otherpage(args.view)};" update="mensajes notlink" rendered="#{!loginBean.lectura}">
                            <i class="pi pi-eye" style="font-size: 2rem"></i>
                        </p:commandLink>
                    </p:column>

                    <f:facet name="footer">
                        <span class="font-bold">#{cambioCasilleroBean.cambiosCasillero.size()} registros.</span>
                    </f:facet>
                </p:dataTable>
            </p:panel>

            <p:dialog id="dlgCasillero" modal="true" resizable="true"
                      header="BUSCAR NUEVO CASILLERO PARA EL TRÁMITE #{cambioCasilleroBean.numtramite}" fitViewport="true"
                      widgetVar="dlgCasillero" style="font-size: 11px; text-align: center;" showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true" width="80%">
                <p:ajax event="close" update="dlgCasillero" resetValues="true" />

                <h:form id="frmCasillero" >
                    <p:outputLabel value="Criterio de búsqueda:  "/>
                    <p:inputText value="#{cambioCasilleroBean.criterioOwner}" style="width: 50%" placeholder="Ingrese un nombre o identificación"/>
                    <p:commandButton value="BUSCAR" actionListener="#{cambioCasilleroBean.buscarCasillero}" update="allform:frmCasillero:tablaDeCasilleros mensajes" 
                                     process="@parent"/>
                    <p:dataTable id="tablaDeCasilleros" var="owner"
                                 value="#{cambioCasilleroBean.owners}" widgetVar="tablaDeCasilleros"
                                 emptyMessage="No hay Datos para mostrar"                                              
                                 filteredValue="#{cambioCasilleroBean.ownersFiltrados}"
                                 binding="#{cambioCasilleroBean.ownerDataTable}"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="10"
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 style="border: black !important" 
                                 selectionMode="single"
                                 rowKey="#{owner.id}">
                        <p:column headerText="Casillero" style="text-align: center;" filterBy="#{owner.casillero}" filterMatchMode="contains">
                            <h:outputText value="#{owner.casillero}" style="font-weight: bold; font-size: 13px"/>
                        </p:column>
                        <p:column headerText="Nombre" style="text-align: center;"  filterBy="#{owner.firstname}" filterMatchMode="contains">
                            <h:outputText value="#{owner.firstname}" />
                        </p:column>
                        <p:column headerText="Apellido" style="text-align: center;" filterBy="#{owner.lastname}" filterMatchMode="contains" >
                            <h:outputText value="#{owner.lastname}" />
                        </p:column>
                        <p:column headerText="Tipo Doc." style="text-align: center;"  >
                            <h:outputText value="#{owner.document_type}" />
                        </p:column>
                        <p:column headerText="Documento" style="text-align: center;"  filterBy="#{owner.document}" filterMatchMode="contains">
                            <h:outputText value="#{owner.document}" />
                        </p:column>
                        <p:column headerText="Email" style="text-align: center;"  filterBy="#{owner.email}" filterMatchMode="contains">
                            <h:outputText value="#{owner.email}" />
                        </p:column>
                        <p:column headerText="Phone" style="text-align: center;"  >
                            <h:outputText value="#{owner.phone}" />
                        </p:column>
                        <p:column headerText="Celular" style="text-align: center;"  >
                            <h:outputText value="#{owner.mobile}" />
                        </p:column>                        
                        <p:column headerText="Acción" style="text-align: center">
                            <p:commandLink class="linkcas"
                                           actionListener="#{cambioCasilleroBean.seleccionarCasillero}"
                                           update="allform:panelprin allform:asignpan mensajes "
                                           oncomplete="PF('dlgCasillero').hide();"
                                           process="@this"
                                           title="Seleccionar #{owner.casillero}" >
                                <i class="pi pi-check"></i>
                            </p:commandLink>
                        </p:column>
                    </p:dataTable>
                </h:form>
            </p:dialog>

            <p:confirmDialog global="true" showEffect="explode" hideEffect="explode" style="white-space: pre; ">
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes btn_peque" update="allform:tablaDeDelegaos"/>
                <p:commandButton value="No" type="button"  styleClass="ui-confirmdialog-no btn_peque" />
            </p:confirmDialog>
            <br/>
            <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()" />

            <p:dialog widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                <p:graphicImage name="/images/ajax-loader.gif" />
            </p:dialog>
        </h:form>        

        <div id="footer"></div>
        <p:idleMonitor timeout="#{1000*60*60}" id="idleSesion">
            <p:ajax event="idle" listener="#{idleMonitorCtrl.idleListener}"
                    oncomplete="PF('idleDialog').show()" />
        </p:idleMonitor>
        <p:dialog header="Sesión Caducada" resizable="false"
                  widgetVar="idleDialog" modal="true" closable="false" style="font-size: 12px">
            <h:form id="sesionCaducaForm">
                <div class="titlePage">
                    <h:outputText value="Sesión Caducada " />
                    <p:commandButton styleClass="nav-link js-scroll-trigger"
                                     actionListener="#{loginBean.logout}"
                                     oncomplete="logout(xhr, status, args)"
                                     value="ACEPTAR" immediate="true" style="font-size: 12px"/>
                </div>
            </h:form>
        </p:dialog>

    </h:body>
    <script type="text/javascript">
        $(document).ready(function () {
            setTimeout(function () {
                $('body').addClass('loaded');
                $('h1').css('color', '#222222');
                $("#footer").load("footer.html");
            }, 150);

            $("#menuside").load("menusidebar.html");
        });

        function getIdIndex(idName) {
            var doc = document.forms['allform'];
            var i;
            var idResult = 0;
            for (i = 0; doc.length > i; i++) {
                if (doc[i].id.includes(idName)) {
                    idResult = i;
                    console.log(doc[i].id);
                    break;
                }
            }
            return idResult;
        }
        function limpiarForm() {
            document.getElementById("allform").reset();
        }

        //<![CDATA[
        function popupwindow(url, title, args) {
            if (args.doit) {
                window.open(url, title);
            }
        }
        function otherpage(url) {
            setTimeout(function () {
                window.open(url, '_blank');
            }, 0);
        }
        function logout(xhr, status, args) {
            setTimeout(function () {
                window.location = 'login.xhtml';
            }, 500);
        }
        //]]>
    </script>
</html>
