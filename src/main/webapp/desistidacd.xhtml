<!DOCTYPE html>
<html xmlns="http://www.w3c.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:x="http://xpert.com/faces">
    <h:head>
        <meta charset="utf-8" />
        <meta name="viewport"    content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="" />

        <title>DESISTIDA-CD</title>

        <link rel="shortcut icon" type="image/png" href="#{resource['images/favicon.png']}" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>

        <link rel="stylesheet" media="screen" href="http://fonts.googleapis.com/css?family=Open+Sans:300,400,700" />
        <link href="resources/assets/css/bootstrap.min.css" rel="stylesheet" />
        <link href="resources/assets/css/font-awesome.min.css" rel="stylesheet" />

        <!-- Custom styles for our template -->
        <link href="resources/assets/css/bootstrap-theme.css" rel="stylesheet" />
        <link href="resources/assets/css/main.css" rel="stylesheet" />
        <!-- My own style css -->
        <link href="resources/assets/css/style.css" rel="stylesheet" />
    </h:head>
    <h:body>
        <!-- Start Page Loading -->
        <div id="loader-wrapper">
            <div id="loader"></div>        
            <div class="loader-section section-left"></div>
            <div class="loader-section section-right"></div>
        </div>
        <p:growl id="mensajes" showDetail="true" life="3000"/>
        <h:form id="allform" enctype="multipart/form-data" style=" background: #e3e3e3; min-height: calc(100vh - 424px);">
            <div class="menu">
                <a href="#" class="logo"  title="Logo Senadi" ><img src="resources/images/sena_2.png" width="161px"/></a>

                <i id="edit_action" class="material-icons prefix" style="color: white; margin-left: 20px; display: inline-block">person</i>    

                <p:outputLabel value="#{loginBean.nombre}" style="color: white; font-size: 18px" />


                <div style="float: right; display: inline-block; margin-top: 5px">
                    <p:commandLink styleClass="btn_logout" actionListener="#{loginBean.logout}"
                                   oncomplete="logout(xhr, status, args)"
                                   title="CERRAR SESIÓN" immediate="true">
                        <i class="material-icons" style="font-size: 30px; ">exit_to_app</i>
                    </p:commandLink>
                </div>
                <a class="itemm" href="settings.xhtml" title="Configuración" style="display:  #{loginBean.lectura eq true?'none':'inline-block'}"><i class="material-icons" >settings</i></a>
                <a class="itemm" href="abandonocd.xhtml" title="Caducadas" >ABANDONO</a>
                <a class="itemm" href="resolucioncd.xhtml" title="Desistimientos" >RESOLUCIONES</a> 
                <a class="itemm" href="caducadacd.xhtml" title="Caducada" >CADUCADAS - NEGADAS</a>
                <a class="activo" href="#" title="Desistidas" >DESISTIDAS</a>
                <a class="itemm" href="notificadacd.xhtml" title="Notificadas" >NOTIFICADAS</a>
                <a class="itemm" href="certificadocd.xhtml" title="Certificado Cambio Nombre" >CERTIFICADO C. DOMICILIO</a>
            </div>
            <div class="card" style="margin-top: 20%; position: absolute;">
                <br/>
                <p:sidebar widgetVar="sidebar1" style="z-index: 999 !important; width: 22%; background: #E8F5E9; overflow: scroll">
                    <div id="menuside"></div>
                </p:sidebar>
                <p:commandButton icon="pi pi-arrow-right" type="button" onclick="PF('sidebar1').show()" styleClass="mr-2 " class="btn_sidebar"
                                 style="position: fixed; z-index: 999; background-color: #d30039 !important;"/>
            </div>
            <br/>
            <h:panelGrid columns="1"  style="text-align: center; font-size: 16px; font-weight: bold; margin: 0 auto; width: 97%;">
                <p:panel class="panelContent" >
                    <p:commandButton id="nuevo_registro" value="NUEVA DESISTIDA C. DOMICILIO" 
                                     class="btn_peque"
                                     style="font-size: 12px; float: left"
                                     actionListener="#{desistidacdBean.prepararNuevo}"
                                     update="allform:dlgNuevaT allform:frmNuevaT:datosNuevaT allform:frmNuevaT:guardarBtn"
                                     oncomplete="if(args.doit){PF('dlgNuevaT').show()};" process="@this" rendered="#{!loginBean.lectura}"/>
                    <p:tabView style="font-size: 12px; margin: 0 auto; width: 50%">
                        <p:tab title="Búsqueda por Criterio" >
                            <p:outputLabel value="BUSCAR: " style="font-size: 13px; font-weight: bold; margin-right: 5px;"/>
                            <p:inputText id="buscarText" value="#{desistidacdBean.criterio}" 
                                         style="font-size: 14px; margin-right: 5px; width: 40%" placeholder="Ingrese un criterio de búsqueda"
                                         title="Puede buscar por No. Solicitud, Denominación o Titular Actual"/>
                            <p:commandButton value="BUSCAR" actionListener="#{desistidacdBean.buscarDesistimiento}"
                                             update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px"
                                             process="@parent" class="btn_peque"/>
                        </p:tab>
                        <p:tab title="Búsqueda por Fecha" >                            
                            <p:outputLabel value="DESDE:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{desistidacdBean.fechaInicio}" label="Fecha Desde" style="font-size: 13px; margin-right: 5px;" 
                                        placeholder="Fecha Inicio de Búsqueda" navigator="true"/>
                            <p:outputLabel value="HASTA:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{desistidacdBean.fechaFin}" label="Fecha Hasta" style="font-size: 13px; margin-right: 5px;"
                                        placeholder="Fecha Fin de Búsqueda" navigator="true"/>

                            <p:commandButton value="BUSCAR"  
                                             actionListener="#{desistidacdBean.buscarDesistimientosPorFecha}" 
                                             update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px" class="btn_peque"
                                             process="@parent" title="Se busca por fecha de Presentación"/>                            
                        </p:tab>                        
                    </p:tabView>
                    <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()" />

                    <p:dialog widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                        <p:graphicImage name="/images/ajax-loader.gif" />
                    </p:dialog>
                    <p:outputLabel id="num_reg" value="#{desistidacdBean.numRegistros}" style="float: left; font-size: 12px"/>
                    <br/>
                    <p:dataTable id="tablaDeDatos" var="desistida"
                                 value="#{desistidacdBean.desistimientos}" widgetVar="tablaDeNotificaciones"
                                 emptyMessage="No hay Datos para mostrar"                                              
                                 filteredValue="#{desistidacdBean.desistimientosFiltradas}"
                                 binding="#{desistidacdBean.desistimientoDataTable}"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="20" selectionMode="single" 
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 style="margin:3px auto; font-size: 9px !important;" 
                                 rowKey="#{desistida.id}">

                        <f:facet name="header">
                            <p:outputPanel>
                                <h:outputText value="BUSCAR EN RESULTADO: " />
                                <p:inputText id="globalFilter" onkeyup="PF('tablaDeNotificaciones').filter()"
                                             style="width:300px" placeholder="Escriba aquí"/>
                            </p:outputPanel>
                        </f:facet>

                        <p:column selectionMode="multiple" style="width:16px;text-align:center" rendered="#{!loginBean.lectura}" exportable="false"/>

                        <p:column headerText="Solicitud" style="text-align: center;" filterBy="#{desistida.solicitud}" >
                            <h:outputText value="#{desistida.solicitud}" />
                        </p:column>
                        <p:column headerText="F. Presentación" style="text-align: center;" filterBy="#{desistida.fechaPresentacion}" >
                            <h:outputText value="#{desistida.fechaPresentacion}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Notificación" style="text-align: center;" filterBy="#{desistida.notificacion}" >
                            <h:outputText value="#{desistida.notificacion}" />
                        </p:column>
                        <p:column headerText="F. Notificacion" style="text-align: center;" filterBy="#{desistida.fechaCertificado}" >
                            <h:outputText value="#{desistida.fechaNotificacion}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Registro" style="text-align: center; width: 13rem" filterBy="#{desistida.registro}" >
                            <h:outputText value="#{desistida.registro}" />
                        </p:column>
                        <p:column headerText="F. Registro" style="text-align: center;" filterBy="#{desistida.fechaRegistro}" >
                            <h:outputText value="#{desistida.fechaRegistro}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Denominación" style="text-align: center;" filterBy="#{desistida.denominacion}" >
                            <h:outputText value="#{desistida.denominacion}" />
                        </p:column>
                        <p:column headerText="signo" style="text-align: center;" filterBy="#{desistida.signo}" >
                            <h:outputText value="#{desistida.signo}" />
                        </p:column>
                        <p:column headerText="T. Actual" style="text-align: center;" filterBy="#{desistida.titularActual}" >
                            <h:outputText value="#{desistida.titularActual}" />
                        </p:column>
                        <p:column headerText="Dom. T. Actual" style="text-align: center;" filterBy="#{desistida.domicilioTitularActual}" >
                            <h:outputText value="#{desistida.domicilioTitularActual}" />
                        </p:column>
                        <p:column headerText="Nom Apod Repre" style="text-align: center;"  visible="false" >
                            <h:outputText value="#{desistida.nomApodRepre}" />
                        </p:column>
                        <p:column headerText="Casillero Senadi" style="text-align: center;"  visible="false" >
                            <h:outputText value="#{notificacion.casilleroSenadi}" />
                        </p:column>
                        <p:column headerText="Casillero Judicial" style="text-align: center;"  visible="false" >
                            <h:outputText value="#{desistida.casilleroJudicial}" />
                        </p:column>
                        <p:column headerText="Responsable" style="text-align: center;">
                            <h:outputText value="#{desistida.responsable}" />
                        </p:column>
                        <p:column id="editar" headerText="Acción"  exportable="false" style="margin: 0 auto; width: 107px;" >                            
                            <p:commandLink class="link"
                                           actionListener="#{desistidacdBean.prepararEditar}"
                                           update="allform:dlgNuevaT allform:frmNuevaT:datosNuevaT allform:frmNuevaT:guardarBtn "
                                           oncomplete="if(args.peditar){PF('dlgNuevaT').show()};"
                                           process="@this"
                                           title="Editar" rendered="#{!loginBean.lectura}">
                                <i id="edit_action" class="material-icons md-18">edit</i>
                            </p:commandLink>
                            <p:commandLink class="link"
                                           actionListener="#{desistidacdBean.prepararHistorial}"
                                           title="Seguimiento" process="@this"
                                           update="allform:dlgHistorial"
                                           oncomplete="PF('dlgHistorial').show();" rendered="#{!loginBean.lectura}">
                                <i id="history_action" class="material-icons md-18">history</i>                            
                            </p:commandLink>

                            <p:commandLink class="link_remove" 
                                           actionListener="#{desistidacdBean.eliminarDesistimiento}"
                                           update="allform:tablaDeDatos mensajes allform:num_registros allform:num_reg"
                                           title="Eliminar" process="@this" rendered="#{!loginBean.lectura}">
                                <i id="delete_action" class="material-icons md-18">delete</i>
                                <p:confirm header="CONFIRMAR" message="SEGURO DE ELIMINAR LA NOTIFICACIÓN CON SOLICITUD: #{desistida.solicitud} ?"/> 
                            </p:commandLink>                
                        </p:column>                        
                    </p:dataTable>
                    <p:outputLabel id="num_registros" value="#{desistidacdBean.numRegistros}" style="float: left; font-size: 12px"/>
                    <h:panelGrid columns="2" style="float: right;">
                        <h:commandLink title="Exportar a excel..." rendered="#{!loginBean.lectura}" immediate="true">
                            <p:graphicImage class="excel" width="20px" height="20px" library="images" name="excel.png"/>
                            <p:dataExporter type="xlsx" target="tablaDeDatos" fileName="#{desistidacdBean.exportName}"/>
                        </h:commandLink>
                        <br/>
                    </h:panelGrid>
                    <br/>
                </p:panel>
            </h:panelGrid>            

            <p:dialog id="dlgNuevaT" modal="true" resizable="true"
                      header="#{desistidacdBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgNuevaT" style="font-size: 11px; margin-bottom: 10px" showEffect="clip" 
                      hideEffect="explode" closeOnEscape="true" width="80%">
                <p:ajax event="close" update="dlgNuevaT" resetValues="true" />
                <p:growl id="nuevoreg" life="1000"/>
                <h:form id="frmNuevaT" >
                    <p:panelGrid columns="6" id="datosNuevaT" styleClass="showcase-text-align-center" style="width: 100%" 
                                 columnClasses="ten-percent,twenty-percent,ten-percent,twenty-percent,ten-percent,twenty-percent">

                        <p:outputLabel value="Solicitud:" for="solicitudForm"/>
                        <h:panelGroup>
                            <p:inputText id="solicitudForm" value="#{desistidacdBean.desistimiento.solicitud}" title="Solicitud" required="true" 
                                         style="background: #aed581 !important; width: 85%; text-transform: uppercase"/>
                            <p:commandButton icon="pi pi-search" class="btn_peque" style="position: absolute;" actionListener="#{desistidacdBean.buscarTramite}"
                                             rendered="#{desistidacdBean.dialogTitle eq 'NUEVO DESISTIMIENTO CAMBIO DE DOMICILIO'?true:false}" process="@parent" update="mensajes frmNuevaT:datosNuevaT"/>
                        </h:panelGroup>

                        <p:outputLabel value="F. Presentación:" for="fpresentacionForm"/>                            
                        <p:calendar id="fpresentacionForm"  value="#{desistidacdBean.desistimiento.fechaPresentacion}" timeZone="GMT-5" navigator="true"
                                    mask="true" pattern="yyyy-MM-dd"  required="true" title="Fecha de Presentación" inputStyleClass="maxsize"/>                                                

                        <p:outputLabel value="Notificación:" for="notificacionForm"/>
                        <p:inputText id="notificacionForm" value="#{desistidacdBean.desistimiento.notificacion}" title="Notificación" 
                                     style="background: #FFCDD2 !important;" required="true" class="maxsize">
                            <p:keyFilter mask="num" />
                        </p:inputText>

                        <p:outputLabel value="Certificado:" for="certForm"/>
                        <p:inputText id="certForm" value="#{desistidacdBean.desistimiento.certificado}" title="Certificado" 
                                     class="maxsize">
                            <p:keyFilter mask="num" />
                        </p:inputText>

                        <p:outputLabel value="Registro:" for="registroForm"/>                            
                        <p:inputText id="registroForm" value="#{desistidacdBean.desistimiento.registro}" title="Registro" required="true" class="maxsize"/>

                        <p:outputLabel value="F. Registro:" for="fregistroForm"/>                            
                        <p:calendar id="fregistroForm"  value="#{desistidacdBean.desistimiento.fechaRegistro}" timeZone="GMT-5" navigator="true"
                                    mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha de Registro" inputStyleClass="maxsize"/>

                        <p:outputLabel value="Denominación:" for="denominacionForm"/>                            
                        <p:inputTextarea id="denominacionForm" value="#{desistidacdBean.desistimiento.denominacion}" title="Denominación" 
                                         required="true" class="maxsize"/>

                        <p:outputLabel value="Signo:" for="signoForm"/>                            
                        <p:inputText id="signoForm" value="#{desistidacdBean.desistimiento.signo}" title="Signo" required="true" class="maxsize"/>

                        <p:outputLabel value="Titular Actual:" for="tactualForm"/>
                        <p:inputTextarea id="tactualForm" value="#{desistidacdBean.desistimiento.titularActual}" title="Titular Actual" 
                                         required="true" class="maxsize"/>

                        <p:outputLabel value="Domicilio T. Actual:" for="dtactualForm"/>                            
                        <p:inputTextarea id="dtactualForm" value="#{desistidacdBean.desistimiento.domicilioTitularActual}" 
                                         title="Domicilio Titular Actual" class="maxsize" />

                        <p:outputLabel value="Nom Apod Repre:" for="nomapForm"/>                            
                        <p:inputTextarea id="nomapForm" value="#{desistidacdBean.desistimiento.nomApodRepre}" title="Apoderado Representante Legal" 
                                         required="true" class="maxsize"/>

                        <p:outputLabel value="ApeApodRepre:" for="aporeplegalForm"/>                            
                        <p:inputTextarea id="aporeplegalForm" value="#{desistidacdBean.desistimiento.apeApodRepre}" title="Apoderado Representante Legal" 
                                         class="maxsize"/>

                        <p:outputLabel value="F. Notificación:" for="fechaNotificacionForm"/>                            
                        <p:calendar id="fechaNotificacionForm"  value="#{desistidacdBean.desistimiento.fechaNotificacion}" timeZone="GMT-5" navigator="true"
                                    mask="true" pattern="yyyy-MM-dd" required="true" title="Fecha Notifición" inputStyleClass="maxsize"/>

                        <p:outputLabel value="Casillero SENADI:" for="casSenadiForm"/>                                                                            
                        <p:panel class="noBorders" style="padding: 0 0 !important; border: none !important">
                            <p:inputText id="casSenadiForm" value="#{desistidacdBean.desistimiento.casilleroSenadi}" title="Casillero SENADI" 
                                         style="width: 80%"/>
                            <p:commandButton icon="pi pi-search" class="btn_peque" actionListener="#{desistidacdBean.buscarCasillero}" 
                                             rendered="#{desistidacdBean.dialogTitle eq 'NUEVO DESISTIMIENTO CAMBIO DE DOMICILIO'?false:true}" 
                                             process="@parent" update="casSenadiForm" style="width: 12%" title="BUSCAR CASILLERO"/>
                        </p:panel>

                        <p:outputLabel value="Casillero JUDICIAL:" for="casJudicialForm"/>                            
                        <p:inputText id="casJudicialForm" value="#{desistidacdBean.desistimiento.casilleroJudicial}" title="Casillero Judicial" class="maxsize"/>

                        <p:outputLabel value="Identificación:" for="identificacionForm"/>                            
                        <p:inputText id="identificacionForm" value="#{desistidacdBean.desistimiento.identificacion}" title="Identificación" class="maxsize"/>

                        <p:outputLabel value="Comprobante" for="comproForm"/>
                        <p:inputText id="comproForm" value="#{desistidacdBean.desistimiento.comprobante}" title="comprobante" class="maxsize"/>

                        <p:outputLabel value="Responsable:" for="responsableForm"/>                            
                        <p:inputText id="responsableForm" value="#{desistidacdBean.desistimiento.responsable}" title="Responsable" 
                                     class="maxsize" required="true" readonly="true"/>                        

                        <p:outputLabel value="Url: " style="float: right !important"/>

                        <p:commandLink value="Ruta Expediente" actionListener="#{desistidacdBean.prepararExpediente}" process="@this"
                                       disabled="#{desistidacdBean.desistimiento.solicitud eq null? true:false}" style="color: blue"
                                       oncomplete="PF('dlgExpediente').show();" update="allform:dlgExpediente mensajes"/>                        

                        <p:commandLink value="Ruta Casillero" onclick="otherpage('https://registro.propiedadintelectual.gob.ec/casilleros/media/files/#{desistidacdBean.desistimiento.casilleroSenadi}/')"  
                                       disabled="#{desistidacdBean.desistimiento.solicitud eq null? true:false}" style="color: #0089ec"/>
                    </p:panelGrid>

                    <p:panelGrid id="guardarBtn" columns="2" class="panel-bottom">
                        <p:outputLabel value="PASAR A: " class="float-right"
                                       rendered="#{desistidacdBean.dialogTitle eq 'NUEVO DESISTIMIENTO CAMBIO DE DOMICILIO'?false:true}"/>
                        <p:selectOneMenu id="estadoRegistro" class="float-right"
                                         value="#{desistidacdBean.estadoTemp}" rendered="#{desistidacdBean.dialogTitle eq 'NUEVO DESISTIMIENTO CAMBIO DE DOMICILIO'?false:true}">
                            <f:selectItem itemLabel="Seleccionar..." itemValue="" noSelectionOption="true"/>
                            <f:selectItem itemLabel="CERTIFICADO" itemValue="CERTIFICADO"/>
                            <f:selectItem itemLabel="NOTIFICADAS" itemValue="NOTIFICADA"/>
                            <f:selectItem itemLabel="CADUCADA" itemValue="CADUCADA"/>
                            <f:selectItem itemLabel="RESOLUCION" itemValue="RESOLUCION"/>
                        </p:selectOneMenu>                        
                    </p:panelGrid>
                    <p:commandButton value="CERRAR" oncomplete="PF('dlgNuevaT').hide();" process="@form" class="btn_cerrar float-right"/>
                    <p:commandButton value="#{desistidacdBean.saveEdit}" actionListener="#{desistidacdBean.guardarDesistimiento}"
                                     update="mensajes allform:tablaDeDatos datosNuevaT"
                                     oncomplete="if(args.saved){PF('dlgNuevaT').hide();}"
                                     process="@form" class="btn_buscar float-right">
                        <p:confirm header="Seguridad" message="#{desistidacdBean.mensajeConfirmacion}" />
                    </p:commandButton>

                </h:form>
            </p:dialog>

            <p:dialog id="dlgExpediente" modal="true" resizable="true"
                      header="#{desistidacdBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgExpediente" style="font-size: 11px;" showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true" width="50%">
                <p:ajax event="close" update="dlgExpediente" resetValues="true" />                
                <h:form id="frmExpediente" >
                    <p:dataTable id="tablaDeArchivos" var="archivo"
                                 value="#{desistidacdBean.archivos}" widgetVar="tablaDeArchivos"
                                 emptyMessage="No hay Datos para mostrar"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="20"
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 style="border: black !important" >
                        <p:column headerText="Archivos" style="text-align: center;" filterBy="#{archivo}" >
                            <p:commandLink value="#{archivo.nombre}" style="color: #0089ec; font-size: 14px;"
                                           onclick="otherpage('https://registro.propiedadintelectual.gob.ec/solicitudes/media/files/renewal_forms/#{desistidacdBean.desistimiento.idRenewalForm}/#{archivo.documento}')"  
                                           />
                        </p:column>
                    </p:dataTable>
                </h:form>
            </p:dialog>

            <p:dialog id="dlgHistorial" modal="true" resizable="true"
                      header="#{desistidacdBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgHistorial" style="font-size: 11px; width: 200px" showEffect="explode" 
                      hideEffect="explode" closeOnEscape="true">
                <p:ajax event="close" update="dlgHistorial" resetValues="true" />                
                <h:form id="frmHistory" >

                    <p:inputTextarea id='historialText' value="#{desistidacdBean.historial}" rows="10" cols="115" readonly="true"/>

                </h:form>

            </p:dialog>

            <p:confirmDialog global="true" showEffect="explode" hideEffect="explode">
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes btn_peque" update="renovacionForm:tablaDeDatos"/>
                <p:commandButton value="No" type="button"  styleClass="ui-confirmdialog-no btn_peque"/>
            </p:confirmDialog>

            <br/>
        </h:form>

        <div id="footer"></div>

        <p:idleMonitor timeout="#{1000*60*60}" id="idleSesion">
            <p:ajax event="idle" listener="#{idleMonitorCtrl.idleListener}"
                    oncomplete="PF('idleDialog').show()" />
        </p:idleMonitor>
        <p:dialog header="Sesión Caducada" resizable="false"
                  widgetVar="idleDialog" modal="true" closable="false" style="font-size: 12px">
            <h:form id="sesionCaducaForm">
                <div class="titlePage">
